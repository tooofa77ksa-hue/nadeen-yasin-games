  if(!dup){const opts=cats.slice(0,4);steps.push({kind:'choice',q:`أي ${th.what} هي الأكثر اختياراً؟`,opts,ci:imax,hints:{any:'إذا شفتي «الأكثر» ← أدوّر على أكبر قطاع ← وأقرأ لونه في المفتاح على الجانب ← وأكتب اسمه.'},after:'الجواب: '+cats[imax]})}
  else{const j=fr.findIndex(x=>x===0.125||x===0.25&&fr.length>3);steps.push({kind:'choice',q:`أي ${th.what} هي الأكثر اختياراً؟`,opts:['الأكبر والأصغر متساويان','أصغرها','لا نعرف'],ci:0,hints:{any:'إذا كل القطاعات بنفس الحجم ← يعني كلها متساوية.'},after:'القطاعات متساوية'})}
  const t=fr.findIndex(x=>x===0.5||x===0.25);if(t>=0&&!dup)steps.push(stepChoice(`القطاع الذي يمثل «${cats[t]}» يساوي…`,['نصف الدائرة','ربع الدائرة','ثُمن الدائرة'],fr[t]===0.5?0:1,{any:'إذا شفتي قطاعاً ← أقارنه بالدائرة: لو يغطي نصفها ← نصف، لو يغطي نص النصف ← ربع.'}));
  return {fig,steps,label:'التمثيل بالقطاعات الدائرية'}}
function tallyQuestion(){
  const th=pick(THEMES);const n=Math.min(4,th.cats.length);const cats=th.cats.slice(0,n);const v=distinctVals(n,1,2,17);const c={title:th.title,col1:th.what,cats,vals:v};const fig=tallyT(c);const a=rnd(0,n-1),b=(a+1+rnd(0,n-2))%n;
  const steps=[titleStep(th.title,ALL_TITLES.filter(t=>t!==th.title)),
   stepChoice('في لوحة الإشارات: كل أربعة خطوط بينهم خط مائل تساوي…',['٥','٤','٦'],0,{any:'إذا شفتي حزمة فيها خط مائل ← هي ٥ ← وأعدّ الباقي واحداً واحداً.'},'الحزمة = ٥'),
   stepNum(`كم عدد «${cats[a]}» (اعدّي الحزم ثم الخطوط المفردة)؟`,v[a],'إذا شفتي حزمة ← أعدّها ٥ ← وأعدّ بعدها الخطوط المفردة ← وأجمعهم.','العدد: '+ar(v[a]),th.unit),
   stepNum(`ما مجموع «${cats[a]}» و«${cats[b]}»؟`,v[a]+v[b],`إذا شفتي «مجموع» ← أجمع العددين ← وأحط ${ar(v[a])} + ${ar(v[b])}.`,`${ar(v[a])} + ${ar(v[b])} = ${ar(v[a]+v[b])}`,th.unit)];
  return {fig,steps,label:'جدول التكرار ولوحة الإشارات'}}
function spinQuestion(){
  const letters=pick([['ي','س','ع','و','د'],['أ','ب','ج','د','هـ','و'],null]);let labels;if(letters)labels=letters;else{const b=shuffle([3,5,7,9,11,13]).slice(0,6);labels=b.map(ar)}
  const n=labels.length;const rep=rnd(0,1);const dupIdx=rnd(0,n-1);const L2=labels.slice();if(rep&&n>=5){L2[(dupIdx+2)%n]=L2[dupIdx]}
  const t=pick(L2);const cnt=L2.filter(x=>x===t).length;const fig=spinC({labels:L2});
  const absent=letters?'ز':ar(16);
  const steps=[stepNum('كم قطاعاً (جزءاً متساوياً) على المؤشر؟',n,'إذا شفتي مؤشراً دوّاراً ← أعدّ كل القطاعات ← وهذا يكون «الكل» اللي تحت الرقم في الاحتمال.','عدد القطاعات = '+ar(n)),
   stepNum(`كم قطاعاً مكتوب عليه «${t}»؟`,cnt,'إذا شفتي سؤال عن حرف أو عدد ← أعدّ كم قطاعاً فيه ذاك الحرف أو العدد ← وهذا يكون «المطلوب».','عدد القطاعات المطلوبة = '+ar(cnt)),
   stepChoice(`ما احتمال أن يقف المؤشر عند «${t}»؟`,[`${ar(cnt)} من ${ar(n)}`,`${ar(n)} من ${ar(cnt)}`,`${ar(cnt)} من ${ar(n+1)}`],0,{any:'إذا شفتي «احتمال» ← أكتب (المطلوب) من (الكل) ← يعني «'+ar(cnt)+' من '+ar(n)+'» وليس العكس.'},'الاحتمال = '+ar(cnt)+' من '+ar(n)),
   stepChoice(`احتمال أن يقف المؤشر عند «${absent}» هو…`,['مستحيل','مؤكد','أكثر احتمالاً'],0,{any:'إذا شفتي حرفاً أو عدداً مو موجود على القرص ← ما راح يقف عليه أبداً ← هذا «مستحيل».'},'الذي ليس على القرص = مستحيل')];
  return {fig,steps,label:'الاحتمال والمؤشر الدوّار'}}
const GEN={bar:()=>barQuestion(false),barh:()=>barQuestion(true),line:lineQuestion,pie:pieQuestion,tally:tallyQuestion,spin:spinQuestion};
let SETS=[
 {id:'tally',title:'٣-١ جدول التكرار ولوحة الإشارات',gens:['tally']},
 {id:'bar',title:'٣-٣ التمثيل بالأعمدة (رأسية وأفقية)',gens:['bar','barh']},
 {id:'line',title:'٣-٤ التمثيل بالخطوط',gens:['line']},
 {id:'pie',title:'٣-٥ التمثيل بالقطاعات الدائرية',gens:['pie']},
 {id:'spin',title:'٣-٦ الاحتمال والمؤشر الدوّار',gens:['spin']},
 {id:'mix',title:'كل الأنواع معاً (تدريب مختلط)',gens:['tally','bar','barh','line','pie','spin']}];
/* ---------- تدفق السؤال ---------- */
let CUR,QI,SI,ROUND,SET,TRIES,PERF;
if(true)SETS=[];
function menu(){$('#bar').innerHTML='';$('#pr').textContent='';$('#mn').style.display='none';$('#stars').textContent='';
 let h=(SETS.length?`<div class="card menu"><div class="big">📊 تدريب على الرسوم (يتغير كل مرة)</div><div class="small" style="text-align:center;margin-bottom:4px">كل جولة رسوم وأرقام جديدة، فتتدرّبين بدون ما تحفظين الجواب</div>`+SETS.map(s=>`<button class="opt" data-s="${s.id}"><b>${s.title}</b> <span class="small">(${ar(ST.done[s.id]||0)} جولة)</span></button>`).join('')+`</div>`:'');
 EXAMS.forEach(g=>{h+=`<div class="card menu" style="border-color:#e03131"><div class="big">📝 ${g.title}</div><div class="small" style="text-align:center;margin-bottom:4px">${g.sub}</div><button class="opt" data-s="exam:${g.id}"><b>ابدئي الأسئلة</b> <span class="small">(${ar(g.items.length)} سؤالاً)</span></button></div>`});
 $('#app').innerHTML=h;document.querySelectorAll('.opt[data-s]').forEach(b=>b.onclick=()=>b.dataset.s.startsWith('exam:')?startExam(b.dataset.s.slice(5)):startSet(b.dataset.s))}
function startSet(id){SET=SETS.find(s=>s.id===id);ROUND=Array.from({length:6},(_,i)=>{const g=SET.gens[i%SET.gens.length];return GEN[g]()});QI=0;PERF=0;$('#mn').style.display='';nextQ()}
function nextQ(){if(QI>=ROUND.length){ST.done[SET.id]=(ST.done[SET.id]||0)+1;save();return endRound()}CUR=ROUND[QI];SI=0;TRIES=0;stepView()}
function barUI(){const k=CUR.steps.length;$('#bar').innerHTML=CUR.steps.map((s,i)=>`<span class="${i<SI?'done':i===SI?'on':''}">خطوة ${ar(i+1)}</span>`).join('');$('#pr').textContent=`رسم ${ar(QI+1)} من ${ar(ROUND.length)}`;$('#stars').textContent='⭐ '+ar(ST.stars)}
function stepView(){barUI();const s=CUR.steps[SI];
 let h=`<div class="card"><div class="small" style="color:#4a2fc0;font-weight:800">📊 ${CUR.label}</div><div class="fig">${CUR.fig}</div></div><div class="card"><div class="q">${L(s.q)}</div>`;
 if(s.kind==='choice')h+=s.opts.map((t,i)=>`<button class="opt" data-i="${i}">${L(t)}</button>`).join('');
 else h+=`<input class="ans" id="in" inputmode="numeric" pattern="[0-9٠-٩]*" autocomplete="off" placeholder="الجواب ${s.unit?'('+s.unit+')':''}"><div style="text-align:center"><button class="go" id="ck">تأكدي ✓</button></div>`;
 h+=`<div id="fb"></div></div>`;$('#app').innerHTML=h;
 if(s.kind==='choice')document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pickOpt(b,s));
 else{$('#ck').onclick=()=>checkNum(s);$('#in').onkeydown=e=>{if(e.key==='Enter')checkNum(s)};setTimeout(()=>{try{$('#in').focus()}catch(e){}},50)}}
function pickOpt(b,s){const i=+b.dataset.i;if(i===s.ci){b.classList.add('ok');document.querySelectorAll('.opt').forEach(x=>x.disabled=true);return stepOk(s)}
 TRIES++;b.classList.add('no');$('#fb').innerHTML=`<div class="coach warn">💡 ${L(s.hints[i]||s.hints.any||'جرّبي خياراً ثانياً.')}</div>`}
function checkNum(s){const v=toEn($('#in').value);if(v==='')return;if(+v===s.ans){$('#ck').disabled=true;$('#in').disabled=true;return stepOk(s)}TRIES++;
 $('#fb').innerHTML=TRIES>=3?`<div class="coach warn">${L(s.after)} ✅ بنعيد النوع هذا بعدين 💪</div><div style="text-align:center"><button class="go" id="nx">أكملي ←</button></div>`:`<div class="coach warn">💡 ${L(s.hint)}</div>`;
 if(TRIES>=3){$('#nx').onclick=()=>{PERF=-1;advance()}}}
function stepOk(s){const last=SI===CUR.steps.length-1;$('#fb').innerHTML=`<div class="coach">✅ ${s.after?L(s.after)+' — ':''}${last?praise():'أحسنتِ!'}</div><div style="text-align:center"><button class="go g" id="nx">${last?'الرسم التالي ←':'الخطوة التالية ←'}</button></div>`;if(last){ST.stars+=TRIES===0?2:1;save()}$('#nx').onclick=advance}
function advance(){SI++;if(SI>=CUR.steps.length){QI++;nextQ()}else{TRIES=0;stepView()}}
function endRound(){$('#bar').innerHTML='';$('#app').innerHTML=`<div class="card fin"><div class="st">🏆</div><div class="big">أنهيتِ الجولة يا نادين!</div><p>${praise()}</p><p>نجومك: <b>${ar(ST.stars)}</b> ⭐</p><button class="go g" id="ag">جولة جديدة (رسوم جديدة) 🎲</button><button class="go gray" onclick="menu()">☰ القائمة</button></div>`;$('#ag').onclick=()=>startSet(SET.id);$('#stars').textContent='⭐ '+ar(ST.stars)}

 const q=EQ[EI];$('#bar').innerHTML='';$('#pr').textContent=`سؤال ${ar(EI+1)} من ${ar(EQ.length)}`;
 let h=`<div class="card"><div class="small" style="color:#4a2fc0;font-weight:800">📝 ${q.lesson||''}</div><div class="q">${L(q.text)}</div>${q.img?`<div class="fig">${q.orig?`<div style="display:flex;gap:8px;align-items:flex-start"><div style="flex:1"><img src="${q.img}"></div><div style="width:30%;font-size:.7rem"><img src="${q.orig}" style="filter:grayscale(1)"><div>الصورة الأصلية في الورقة</div></div></div>`:`<img src="${q.img}">`}</div>`:''}<div class="src">جاء في: ${q.src}</div>`;
 if(q.options&&q.options.length&&q.ci>=0)h+=q.options.map((t,i)=>`<button class="opt" data-i="${i}">${L(t)}</button>`).join('')+'<div id="fb"></div>';
 else h+=`<div class="coach">✍️ اكتبي جوابك في دفترك، وبعدين اضغطي «أعرض الحل».</div><div id="fb"></div><div style="text-align:center"><button class="go" id="sh">أعرض الحل</button></div>`;
 $('#app').innerHTML=h+'</div>';
 const explain=()=>{const e=q.explain||{};return `<div class="coach"><b class="red">① أول شيء:</b> ${L(e.task||'')}<br><b>② ${L(e.think||'')}</b><br>${(e.steps||[]).map(x=>'• '+L(x)).join('<br>')}<br><b>الجواب: ${L(q.answer||e.answer||'')}</b>${e.why?'<br><b>ليش؟</b> '+L(e.why):''}</div><div style="text-align:center"><button class="go g" id="nx">التالي ←</button></div>`};
 if(q.options&&q.options.length&&q.ci>=0)document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(i===q.ci){b.classList.add('ok');document.querySelectorAll('.opt').forEach(x=>x.disabled=true);$('#fb').innerHTML=explain();$('#nx').onclick=()=>{EI++;examQ()}}else{b.classList.add('no');$('#fb').innerHTML=`<div class="coach warn">💡 ليس هذا الخيار. اقرئي السؤال والرسم مرة ثانية بالخطوات، وجرّبي خياراً ثانياً.</div>`}});
 else $('#sh').onclick=()=>{$('#fb').innerHTML=explain();$('#sh').style.display='none';$('#nx').onclick=()=>{EI++;examQ()}}}
function hashOpen(){const m=location.hash.match(/set=([a-z0-9]+)/);if(m){if(m[1].startsWith('exam'))startExam(m[1].slice(4)||EXAMS[0].id);else if(SETS.some(s=>s.id===m[1]))startSet(m[1]);else menu()}else menu()}
