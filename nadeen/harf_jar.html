<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>حروف الجر: صح أم خطأ؟</title>
<style>
@font-face{font-family:'B';font-weight:500;src:url('../shared/fonts/Baloo-Medium.ttf')}
@font-face{font-family:'B';font-weight:800;src:url('../shared/fonts/Baloo-ExtraBold.ttf')}
*{box-sizing:border-box}body{font-family:'B',sans-serif;font-weight:500;margin:0;background:#f3f0ff;color:#222;font-size:19px;line-height:1.7}
.w{max-width:720px;margin:0 auto;padding:12px 14px 60px}h1{font-weight:800;text-align:center;color:#7a5af8;font-size:1.6rem;margin:6px 0}
.card{background:#fff;border:4px solid #7a5af8;border-radius:18px;padding:10px 14px;margin:12px 0}
.tip{background:#eefaf0;border:3px solid #34c25a;border-radius:14px;padding:6px 12px;margin:8px 0;font-size:.95rem}

.o.ok{border-color:#34c25a;background:#dcf7e3}.o.no{border-color:#ff5a5a;background:#ffe3e3}
.go{background:#7a5af8;color:#fff;border:0;border-radius:14px;padding:10px 22px;font:inherit;font-weight:800;cursor:pointer;min-height:48px;margin:6px}

.c{text-align:center}.top a{color:#7a5af8;font-weight:800;text-decoration:none}.ul{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px;color:#7a5af8}
</style></head><body><div class="w">
<div class="top"><a href="./">← موقع نادين</a> <span id="st" style="float:left">⭐ 0</span></div>
<h1>🐴 حروف الجر: صح أم خطأ؟</h1>
<div class="tip">🤔 <b>اسألي نفسك:</b> هل الكلمة من الحروف السبعة (من · إلى · عن · على · في · الباء · اللام)؟ وهل بعدها <b>اسم</b>؟ حروف الجر تدخل على <b>الأسماء فقط</b> (ص٨٦–٨٧).</div>
<div class="card" id="c"></div></div>
<script>
const $=s=>document.querySelector(s);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const TF=[
['حروف الجر تدخل على الأسماء فقط.',true,'صح ✓ (ص٨٦): تدخل على الأسماء فقط ولا تدخل على الأفعال.'],
['حروف الجر تدخل على الأفعال.',false,'خطأ ✗: حروف الجر تدخل على الأسماء فقط.'],
['(على) من حروف الجر.',true,'صح ✓: من الحروف السبعة.'],
['(في) من حروف الجر.',true,'صح ✓: من الحروف السبعة.'],
['(كتبَ) من حروف الجر.',false,'خطأ ✗: كتبَ فعل وليس حرف جر.'],
['الاسم الذي بعد حرف الجر يكون مجروراً.',true,'صح ✓: وعلامته الكسرة.'],
['علامة جر الاسم المجرور الضمة.',false,'خطأ ✗: علامة جره الكسرة.'],
['في جملة (سلمتُ على أخي) كلمة (على) حرف جر.',true,'صح ✓.'],
['في جملة (سلمتُ على أخي) كلمة (أخي) حرف جر.',false,'خطأ ✗: أخي اسم مجرور وليس حرف جر.'],
['عدد حروف الجر في كتابي سبعة.',true,'صح ✓: من · إلى · عن · على · في · الباء · اللام.'],
['(إلى) من حروف الجر.',true,'صح ✓.'],
['(الطالبُ) من حروف الجر.',false,'خطأ ✗: الطالبُ اسم وليس حرف جر.']];
const ID=[['نظرتُ إلى القمةِ',['إلى'],'القمةِ'],['سلمتُ على أخي',['على'],'أخي'],['ذهبتُ من البيتِ',['من'],'البيتِ'],['جلستُ في الغرفةِ',['في'],'الغرفةِ']];
let st=0;try{st=+(localStorage.getItem('nyg_nadeen_jar')||0)}catch(e){}
function stars(){$('#st').textContent='⭐ '+st}
function run(){
 const Q=shuf(TF).slice(0,8),I=shuf(ID).slice(0,2);let i=0,sc=0;
 function show(){
  if(i<Q.length){const q=Q[i];$('#c').innerHTML=`<div>سؤال ${i+1} من ${Q.length}</div><div class="big">${q[0]}</div><div class="c"><button class="o" data-v="1">✓ صح</button><button class="o" data-v="0">✗ خطأ</button></div><div id="fb"></div>`;
   document.querySelectorAll('.o').forEach(b=>b.onclick=()=>{const ok=(b.dataset.v==='1')===q[1];if(ok)sc++;b.classList.add(ok?'ok':'no');$('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'✅ أحسنتِ! '+q[2]:'❌ اخترتِ «'+(b.dataset.v==='1'?'صح':'خطأ')+'». اسألي نفسك: هل هو من الحروف السبعة (من · إلى · عن · على · في · الباء · اللام)؟ وهل بعده اسم؟ وحروف الجر تدخل على الأسماء فقط.<br>✅ <b>الصحيح: '+(q[1]?'صح':'خطأ')+'.</b> '+q[2]}</div><div class="c"><button class="go" id="n">التالي ←</button></div>`;$('#n').onclick=()=>{i++;show()}})}
  else if(i<Q.length+I.length){const q=I[i-Q.length];const ws=q[0].split(' ');
   $('#c').innerHTML=`<div>اضغطي على <b>حرف الجر</b> في الجملة:</div><div class="big">${ws.map((w,k)=>`<button class="o" data-w="${w}">${w}</button>`).join('')}</div><div id="fb"></div>`;
   document.querySelectorAll('.o').forEach(b=>b.onclick=()=>{const ok=q[1].includes(b.dataset.w);if(ok)sc++;b.classList.add(ok?'ok':'no');$('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'✅ ':'❌ '}إعرابها: <b>${q[1][0]}: حرف جر.</b><br><b>${q[2]}: اسم مجرور وعلامة جره الكسرة الظاهرة تحت آخره.</b></div><div class="c"><button class="go" id="n">التالي ←</button></div>`;$('#n').onclick=()=>{i++;show()}})}
  else{const t=Q.length+I.length;try{st+=sc>=t*.8?3:sc>=t*.6?2:1;localStorage.setItem('nyg_nadeen_jar',st)}catch(e){}stars();$('#c').innerHTML=`<div class="big" style="font-size:2rem">${sc} / ${t}</div><div class="tip">${sc>=t*.8?'ما شاء الله! ركّزتِ فوصلتِ بتوفيق الله 🌟':'أحسنتِ! جرّبي مرة ثانية بأسئلة مختلفة.'}</div><div class="c"><button class="go" id="a">🔁 أسئلة جديدة</button></div>`;$('#a').onclick=run}}
 show()}
stars();run();
</script><div style="text-align:center;font:700 14px/1.6 system-ui,Tahoma,sans-serif;color:#555;margin:22px 8px 14px;padding-top:8px;border-top:2px dashed #ccc;direction:rtl">للتواصل والطلبات (واتساب): <a href="https://wa.me/966580908077" style="color:#0b7a4b;text-decoration:none"><span style="direction:ltr;unicode-bidi:isolate;display:inline-block">966580908077</span></a><br>إعداد: عواطف الجهني · جهد شخصي لوجه الله · اللهم تقبّله منا واجعله نافعاً</div></body></html>
