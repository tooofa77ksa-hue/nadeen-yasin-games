<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مهمة اليوم: رياضيات نادين</title>
<style>
@font-face{font-family:'B';font-weight:800;src:url('../shared/fonts/Baloo-ExtraBold.ttf')}
*{box-sizing:border-box}
body{margin:0;background:#fff8e1;font-family:'B',sans-serif;padding:12px;color:#333}
h1{font-size:1.3rem;margin:4px 0;color:#4a2fc0;text-align:center}
.sub{text-align:center;font-size:.85rem;color:#666;margin-bottom:10px}
.day{background:#fff;border:4px solid #ddd;border-radius:18px;padding:10px 12px;margin:10px 0}
.day.today{border-color:#7a5af8;background:#f3f0ff}
.day.done{border-color:#2f9e44;background:#ebfbee}
.day h2{margin:0 0 6px;font-size:1.05rem}
label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:1rem;line-height:1.4;cursor:pointer}
input{width:26px;height:26px;flex:none}
.tag{font-size:.7rem;background:#7a5af8;color:#fff;border-radius:8px;padding:1px 8px;margin-inline-start:6px}
.fin{text-align:center;font-size:1.1rem;margin:12px;color:#2f9e44}
</style></head><body>
<h1>📅 مهمة اليوم</h1>
<div class="sub">١٥ دقيقة كل يوم تكفي. ركّزي وكمّلي ما تقدرين عليه، والتوفيق من الله 🌟</div>
<div id="app"></div>
<script>
const START=new Date(2026,10,18); // ١٨ نوفمبر ٢٠٢٦
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const PLAN=[
 ['جدول التكرار ولوحة الإشارات','الفصل ٣: افتحي «مدرّبة الرسوم» ← جولة «جدول التكرار» (٦ رسوم)','لعبة الضرب: جولة واحدة','الفصل ٤: افتحي مجموعة «٤-١ العبارات والجمل العددية»'],
 ['الأعمدة','الفصل ٣: جولة «الأعمدة» مرتين','الفصل ٤: «٤-٢ تمثيل الجمل العددية وكتابتها»','لعبة الضرب: جولة'],
 ['الخطوط','الفصل ٣: جولة «الخطوط» مرتين','الفصل ٤: «٤-٣ الاستدلال المنطقي» و«٤-٤ اكتشاف قاعدة من جدول»','لعبة الضرب: جولة'],
 ['القطاعات الدائرية','الفصل ٣: جولة «القطاعات الدائرية» مرتين','الفصل ٤: «٤-٥ جداول الدوال: الجمع والطرح»','لعبة الضرب: جولة'],
 ['الاحتمال','الفصل ٣: جولة «الاحتمال والمؤشر الدوّار» مرتين','الفصل ٤: «٤-٦ استقصاء حل المسألة»','لعبة الضرب: جولة'],
 ['مراجعة الفصل ٣','الفصل ٣: جولة «خليط» مرتين','الفصل ٣: أول ١٠ أسئلة من «أسئلة الاختبارات»','لعبة الضرب: جولة'],
 ['مراجعة الفصل ٤','الفصل ٤: «مراجعة الفصل الرابع»','الفصل ٤: افتحي ورقة الفصل الرابع (غير المحلولة) وحلّي صفحتين على الورق','لعبة الضرب: جولة'],
 ['أسئلة الاختبارات ٣','الفصل ٣: من «أسئلة الاختبارات» أسئلة ١١ إلى ٣٠','الفصل ٤: مجموعة مما أخطأتِ فيه سابقاً','لعبة الضرب: جولة'],
 ['أسئلة الاختبارات ٤','الفصل ٣: من «أسئلة الاختبارات» أسئلة ٣١ إلى ٥٥','ورقة الفصل ٣ (غير المحلولة): حلّي ٣ صفحات على الورق','لعبة الضرب: جولة'],
 ['الأسئلة المتكررة','الفصل ٣: أسئلة الاختبارات المتكررة (اللي عليها «تكرر في ٣ نماذج»)','الفصل ٤: الأسئلة المتكررة في ورقة الفصل الرابع','لعبة الضرب: جولة'],
 ['مراجعة أخيرة','الفصل ٣: جولة «خليط» مرة','الفصل ٤: «مراجعة الفصل الرابع» مرة','لعبة الضرب: جولتان'],
 ['يوم الاختبار قريب','مراجعة خفيفة: الورقة المحلولة للفصل ٣ (الأحمر أول خطوة)','اقرئي الورقة المحلولة للفصل ٤','نامي مبكراً، وتوكلي على الله 🤍']];
let S={};try{S=JSON.parse(localStorage.getItem('nyg_nadeen_daily')||'{}')}catch(e){}
const today=Math.max(0,Math.min(PLAN.length-1,Math.floor((new Date()-START)/864e5)));
function render(){let h='';PLAN.forEach((d,i)=>{const dt=new Date(START.getTime()+i*864e5);const all=d.slice(1).every((_,j)=>S[i+'_'+j]);
 h+=`<div class="day ${all?'done':i===today?'today':''}"><h2>اليوم ${AR(i+1)}: ${d[0]} ${i===today?'<span class="tag">اليوم</span>':''}<span style="float:left;font-size:.75rem;color:#888;font-weight:500">${AR(dt.getDate())}/${AR(dt.getMonth()+1)}</span></h2>`+d.slice(1).map((t,j)=>`<label><input type="checkbox" data-k="${i}_${j}" ${S[i+'_'+j]?'checked':''}><span>${t}</span></label>`).join('')+'</div>'});
 const n=PLAN.filter((d,i)=>d.slice(1).every((_,j)=>S[i+'_'+j])).length;
 document.getElementById('app').innerHTML=`<div class="fin">أنجزتِ ${AR(n)} من ${AR(PLAN.length)} أيام 🌟</div>`+h;
 document.querySelectorAll('input').forEach(c=>c.onchange=()=>{S[c.dataset.k]=c.checked;try{localStorage.setItem('nyg_nadeen_daily',JSON.stringify(S))}catch(e){}render()})}
render();
</script></body></html>
