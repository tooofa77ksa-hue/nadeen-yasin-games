function svgWrap(w,h,body){return `<svg viewBox="0 0 ${w} ${h}" width="${w}" xmlns="http://www.w3.org/2000/svg" font-family="B,sans-serif" direction="rtl">${body}</svg>`}
function axisTicks(max,step){const t=[];for(let v=0;v<=max;v+=step)t.push(v);return t}
function barV(c){ // c:{title,x_title,y_title,cats[],vals[],step,max}
  const W=520,H=330,L0=70,R0=20,T0=46,B0=64,pw=W-L0-R0,ph=H-T0-B0;const n=c.cats.length;const bw=Math.min(54,pw/n*0.6);

  return svgWrap(W,H,s)}
function barH(c){
  const W=520,H=70+c.cats.length*46+50,L0=110,R0=24,T0=44,B0=52,pw=W-L0-R0,ph=H-T0-B0;const n=c.cats.length;const bh=Math.min(30,ph/n*0.65);

function lineC(c){
  const W=520,H=320,L0=70,R0=24,T0=46,B0=62,pw=W-L0-R0,ph=H-T0-B0;const n=c.cats.length;

  for(const v of axisTicks(c.max,c.step)){const y=T0+ph-v/c.max*ph;s+=`<line x1="${L0}" x2="${W-R0}" y1="${y}" y2="${y}" stroke="${GRID}"/><text x="${L0-8}" y="${y+5}" text-anchor="end" font-size="14">${ar(v)}</text>`}
  s+=`<line x1="${L0}" x2="${L0}" y1="${T0}" y2="${T0+ph}" stroke="${INK}" stroke-width="2.5"/><line x1="${L0}" x2="${W-R0}" y1="${T0+ph}" y2="${T0+ph}" stroke="${INK}" stroke-width="2.5"/>`;

  s+=`<polyline points="${pts.map(p=>p[0]+','+p[1]).join(' ')}" fill="none" stroke="${FILLS[0]}" stroke-width="3.5"/>`;
  pts.forEach(p=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="${FILLS[0]}" stroke="${INK}" stroke-width="1.5"/><text x="${p[0]}" y="${T0+ph+20}" text-anchor="middle" font-size="14">${esc(p[2])}</text>`});
  s+=`<text x="${W/2}" y="${H-8}" text-anchor="middle" font-size="15" font-weight="800">${esc(c.x_title)}</text><text transform="translate(16 ${T0+ph/2}) rotate(-90)" text-anchor="middle" font-size="15" font-weight="800">${esc(c.y_title)}</text>`;
  return svgWrap(W,H,s)}
function pieC(c){ // c:{title,cats[],fr[] (fractions summing 1)}
  const W=520,H=330,cx=125,cy=185,r=110;let s=`<text x="${W/2}" y="26" text-anchor="middle" font-size="19" font-weight="800">${esc(c.title)}</text>`;let a=-Math.PI/2;
  c.fr.forEach((f,i)=>{const a2=a+f*2*Math.PI;const x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);const large=f>0.5?1:0;
    s+=f>=0.999?`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${FILLS[i]}" stroke="#fff" stroke-width="3"/>`:`<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z" fill="${FILLS[i%6]}" stroke="#fff" stroke-width="3"/>`;a=a2});
  c.cats.forEach((k,i)=>{s+=`<rect x="${W-170}" y="${70+i*34}" width="22" height="22" rx="4" fill="${FILLS[i%6]}"/><text x="${W-178}" y="${88+i*34}" text-anchor="start" font-size="16" fill="${INK}">${esc(k)}</text>`});
  return svgWrap(W,H,s)}
function spinC(c){ // c:{labels[]}
  const W=300,H=300,cx=150,cy=150,r=125,n=c.labels.length;let s='';
  c.labels.forEach((t,i)=>{const a1=-Math.PI/2+i*2*Math.PI/n,a2=a1+2*Math.PI/n;const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    s+=`<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 0 1 ${x2},${y2} Z" fill="${i%2?'#eee':'#fff'}" stroke="${INK}" stroke-width="2.5"/>`;const am=(a1+a2)/2;s+=`<text x="${cx+r*0.62*Math.cos(am)}" y="${cy+r*0.62*Math.sin(am)+9}" text-anchor="middle" font-size="26" font-weight="800">${esc(t)}</text>`});
  s+=`<circle cx="${cx}" cy="${cy}" r="7" fill="${INK}"/><path d="M${cx},${cy} L${cx+8},${cy-r*0.45} L${cx-8},${cy-r*0.45} Z" fill="${INK}"/>`;
  return svgWrap(W,H,s)}
function tallyMarks(n){let s='';const g=Math.floor(n/5),rest=n%5;let x=0;for(let i=0;i<g;i++){for(let k=0;k<4;k++)s+=`<line x1="${x+k*9}" y1="4" x2="${x+k*9}" y2="30" stroke="${INK}" stroke-width="3"/>`;s+=`<line x1="${x-4}" y1="26" x2="${x+34}" y2="8" stroke="${INK}" stroke-width="3"/>`;x+=46}
  for(let k=0;k<rest;k++){s+=`<line x1="${x+k*9}" y1="4" x2="${x+k*9}" y2="30" stroke="${INK}" stroke-width="3"/>`}return `<svg width="${Math.max(x+rest*9+8,20)}" height="34" viewBox="0 0 ${Math.max(x+rest*9+8,20)} 34">${s}</svg>`}
function tallyT(c){let h=`<table style="border-collapse:collapse;margin:auto;font-size:1.1rem"><tr><th colspan="3" style="font-size:1.15rem;padding:6px">${esc(c.title)}</th></tr><tr><th style="border:2px solid #222;padding:4px 14px;background:#eee">${esc(c.col1)}</th><th style="border:2px solid #222;padding:4px 14px;background:#eee">الإشارات</th></tr>`;
  c.cats.forEach((k,i)=>{h+=`<tr><td style="border:2px solid #222;padding:4px 14px;font-weight:800">${esc(k)}</td><td style="border:2px solid #222;padding:4px 14px">${tallyMarks(c.vals[i])}</td></tr>`});return h+'</table>'}
/* ---------- بيانات المواضيع ---------- */
const THEMES=[
 {title:'الفاكهة المفضلة لطالبات الصف الرابع',cats:['التفاح','الموز','البرتقال','العنب','الفراولة'],what:'الفاكهة',unit:'طالبة',x:'الفاكهة',y:'عدد الطالبات'},
 {title:'الكتب التي قرأتها الطالبات في الشهر',cats:['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء'],what:'اليوم',unit:'كتاباً',x:'الأيام',y:'عدد الكتب'},
 {title:'مبيعات المقصف المدرسي',cats:['العصير','الساندويتش','الحليب','التمر','الماء'],what:'الصنف',unit:'قطعة',x:'الأصناف',y:'عدد القطع'},
 {title:'الحيوانات الأليفة عند الطالبات',cats:['القطط','العصافير','الأسماك','الأرانب'],what:'الحيوان',unit:'طالبة',x:'الحيوان',y:'عدد الطالبات'},
 {title:'عدد أهداف منتخب المدرسة في المباريات',cats:['المباراة ١','المباراة ٢','المباراة ٣','المباراة ٤','المباراة ٥'],what:'المباراة',unit:'هدفاً',x:'المباراة',y:'عدد الأهداف'},
 {title:'الرحلات المفضلة لطالبات الصف الرابع',cats:['جدة','الرياض','الخبر','حائل'],what:'المدينة',unit:'طالبة',x:'المدينة',y:'عدد الطالبات'},
 {title:'ألوان السيارات في موقف المدرسة',cats:['أبيض','أسود','أحمر','أزرق','رمادي'],what:'اللون',unit:'سيارة',x:'اللون',y:'عدد السيارات'}];
const LTHEMES=[
 {title:'عدد الطالبات اللاتي ركبن الحافلة',cats:['١٤٣٧','١٤٣٨','١٤٣٩','١٤٤٠','١٤٤١'],what:'العام',unit:'طالبة',x:'السنة',y:'عدد الطالبات'},
 {title:'الزمن المستغرق في حل واجب الرياضيات',cats:['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء'],what:'اليوم',unit:'دقيقة',x:'الأيام',y:'الزمن بالدقائق'},
 {title:'عدد زوار المكتبة في الأسبوع',cats:['الأسبوع ١','الأسبوع ٢','الأسبوع ٣','الأسبوع ٤','الأسبوع ٥'],what:'الأسبوع',unit:'زائرة',x:'الأسابيع',y:'عدد الزائرات'}];
function distinctVals(n,step,lo,hi){const set=new Set();let g=0;while(set.size<n&&g++<500)set.add(rnd(lo,hi)*step);return shuffle([...set])}
function niceMax(maxv,step){return Math.ceil((maxv+step)/step/2)*step*2>=maxv+step?Math.ceil((maxv+step*0.5)/(step*2))*step*2:maxv+step}
/* ---------- المولّدات: كل سؤال = {fig, steps[]} ---------- */
function stepChoice(q,opts,correct,hints,after){ // opts: strings; correct index after shuffle
  const o=opts.map((t,i)=>({t,c:i===correct}));const sh=shuffle(o);return {kind:'choice',q,opts:sh.map(x=>x.t),ci:sh.findIndex(x=>x.c),hints:hints||{},after:after||''}}
function stepNum(q,ans,hint,after,unit){return {kind:'num',q,ans,hint,after:after||'',unit:unit||''}}
const WHY_TITLE='العنوان يكتب فوق الرسم، وهو يقول لنا: الرسم يتكلم عن إيش.';
function titleStep(title,others){return stepChoice('اقرئي العنوان: الرسم يتكلم عن…',[title,...shuffle(others).slice(0,2)],0,{any:'إذا شفتي رسماً ← أول شيء أقرأ العنوان اللي فوقه ← وأحط الجملة اللي تقول عن إيش يتكلم الرسم.'},'عنوان الرسم: '+title)}
const ALL_TITLES=[...THEMES,...LTHEMES].map(t=>t.title);
function barQuestion(horizontal){
  const th=pick(THEMES.concat(LTHEMES.slice(1,2)));const n=th.cats.length;const step=pick([1,2,5,10]);
  const vals=distinctVals(n,step,2,Math.floor(40/ (step>=5?1:1)/step)+3).map(v=>Math.min(v,step*8)).slice(0,n);
  // ensure distinct
  const uniq=[...new Set(vals)];while(uniq.length<n)uniq.push(step*(rnd(1,8)));
  const v=uniq.slice(0,n);const max=Math.ceil(Math.max(...v)/step/2)*step*2+ (Math.max(...v)%(step*2)===0?step*2:0);
  const c={title:th.title,cats:th.cats,vals:v,step:step*2>max?step:step*2,max,x_title:horizontal?th.y:th.x,y_title:horizontal?th.x:th.y};
  if(horizontal){c.x_title=th.y;c.y_title=th.x}

  const fix=(arr,ci)=>({arr,ci});

  if(kind==='max'||kind==='min'){const target=kind==='max'?imax:imin;const opts=shuffle([...Array(n).keys()]).slice(0,4);if(!opts.includes(target))opts[0]=target;const sh=shuffle(opts);
    steps.push({kind:'choice',q:kind==='max'?`أي ${th.what} له أكبر قيمة؟`:`أي ${th.what} له أصغر قيمة؟`,opts:sh.map(i=>th.cats[i]),ci:sh.indexOf(target),hints:{any:kind==='max'?'إذا شفتي كلمة «أكبر» أو «الأكثر» ← أدوّر على العمود الأطول ← وأقرأ اسمه.':'إذا شفتي كلمة «أصغر» أو «الأقل» ← أدوّر على العمود الأقصر ← وأقرأ اسمه.'},after:'الجواب: '+th.cats[target]})}
  if(kind==='diff'){const hi=v[a]>=v[b]?a:b,lo=hi===a?b:a;steps.push(stepNum(`كم يزيد «${th.cats[hi]}» على «${th.cats[lo]}»؟`,v[hi]-v[lo],`إذا شفتي كلمة «يزيد» أو «الفرق» ← أطرح ← وأحط ${ar(v[hi])} − ${ar(v[lo])}.`,`${ar(v[hi])} − ${ar(v[lo])} = ${ar(v[hi]-v[lo])}`,th.unit))}
  if(kind==='sum')steps.push(stepNum(`ما مجموع «${th.cats[a]}» و«${th.cats[b]}»؟`,v[a]+v[b],`إذا شفتي كلمة «مجموع» أو «معاً» ← أجمع ← وأحط ${ar(v[a])} + ${ar(v[b])}.`,`${ar(v[a])} + ${ar(v[b])} = ${ar(v[a]+v[b])}`,th.unit));
  return {fig,steps,label:horizontal?'التمثيل بالأعمدة الأفقية':'التمثيل بالأعمدة'}}
function lineQuestion(){
  const th=pick(LTHEMES);const n=th.cats.length;const step=pick([10,20,50]);let v;do{v=Array.from({length:n},()=>rnd(2,10)*step/2)}while(new Set(v).size<n);
  const max=Math.ceil(Math.max(...v)/step)*step+step;const c={title:th.title,cats:th.cats,vals:v,step,max,x_title:th.x,y_title:th.y};const fig=lineC(c);
  const imax=v.indexOf(Math.max(...v)),imin=v.indexOf(Math.min(...v));const a=rnd(0,n-2);
  const steps=[titleStep(th.title,ALL_TITLES.filter(t=>t!==th.title)),
   stepChoice('النقاط على الخط ترتفع أو تنزل. كيف نقرأ قيمة نقطة؟',['أنظر ارتفاع النقطة وأنزل للأرقام على اليمين','أعدّ النقاط','أقرأ لون الخط'],0,{any:'إذا شفتي نقطة ← أنظر مستواها ← وأمدّ عيني للأرقام عند الجانب ← وأقرأ الرقم.'},''),
   stepNum(`كم قيمة «${th.cats[a]}»؟`,v[a],'إذا شفتي نقطة فوق سنة/يوم ← أنظر مستواها ← وأقرأ الرقم اللي يقابلها على المحور.','قيمة '+th.cats[a]+' = '+ar(v[a]),th.unit)];
  const k=pick(['max','min','diff']);
  if(k==='max'||k==='min'){const t=k==='max'?imax:imin;const opts=shuffle([...Array(n).keys()]).slice(0,4);if(!opts.includes(t))opts[0]=t;const sh=shuffle(opts);steps.push({kind:'choice',q:k==='max'?`في أي ${th.what} كان العدد الأكبر؟`:`في أي ${th.what} كان العدد الأصغر؟`,opts:sh.map(i=>th.cats[i]),ci:sh.indexOf(t),hints:{any:k==='max'?'إذا شفتي «الأكبر» ← أدوّر على أعلى نقطة ← وأنزل منها وأقرأ الاسم اللي تحتها.':'إذا شفتي «الأصغر» ← أدوّر على أوطى نقطة ← وأنزل منها وأقرأ الاسم اللي تحتها.'},after:'الجواب: '+th.cats[t]})}
  else{const b=a+1;const hi=Math.max(v[a],v[b]),lo=Math.min(v[a],v[b]);steps.push(stepNum(`كم الفرق بين «${th.cats[a]}» و«${th.cats[b]}»؟`,hi-lo,`إذا شفتي «الفرق» ← أطرح الأصغر من الأكبر ← وأحط ${ar(hi)} − ${ar(lo)}.`,`${ar(hi)} − ${ar(lo)} = ${ar(hi-lo)}`,th.unit))}
  return {fig,steps,label:'التمثيل بالخطوط'}}
function pieQuestion(){
  const th=pick(THEMES.filter(t=>t.cats.length>=4));const sets=[[0.5,0.25,0.125,0.125],[0.5,0.25,0.25],[0.25,0.25,0.25,0.25],[0.5,0.375,0.125]];
  let fr=pick(sets.filter(s=>s.length<=th.cats.length));const idx=shuffle([...Array(th.cats.length).keys()]).slice(0,fr.length);fr=shuffle(fr);const cats=idx.map(i=>th.cats[i]);
  const fig=pieC({title:th.title,cats,fr});const imax=fr.indexOf(Math.max(...fr));const dup=fr.filter(x=>x===Math.max(...fr)).length>1;
  const nm={0.5:'نصف',0.25:'ربع',0.125:'ثُمن',0.375:'٣ أثمان'};
  const steps=[titleStep(th.title,ALL_TITLES.filter(t=>t!==th.title)),
   stepNum('كم قطاعاً (جزءاً) في الدائرة؟',fr.length,'إذا شفتي دائرة مقسومة ← أعدّ الأجزاء الملوّنة واحداً واحداً ← وأكتب العدد.','عدد القطاعات: '+ar(fr.length)),
   stepChoice('أكبر قطاع يمثل…',['الأكثر','الأقل','المساوي'],0,{any:'إذا شفتي «قطاعات دائرية» ← القطاع الأكبر معناه الأكثر ← والأصغر معناه الأقل.'},'القطاع الأكبر = الأكثر')];
  if(!dup){const opts=cats.slice(0,4);steps.push({kind:'choice',q:`أي ${th.what} هي الأكثر اختياراً؟`,opts,ci:imax,hints:{any:'إذا شفتي «الأكثر» ← أدوّر على أكبر قطاع ← وأقرأ لونه في المفتاح على الجانب ← وأكتب اسمه.'},after:'الجواب: '+cats[imax]})}
  else{const j=fr.findIndex(x=>x===0.125||x===0.25&&fr.length>3);steps.push({kind:'choice',q:`أي ${th.what} هي الأكثر اختياراً؟`,opts:['الأكبر والأصغر متساويان','أصغرها','لا نعرف'],ci:0,hints:{any:'إذا كل القطاعات بنفس الحجم ← يعني كلها متساوية.'},after:'القطاعات متساوية'})}
  const t=fr.findIndex(x=>x===0.5||x===0.25);if(t>=0&&!dup)steps.push(stepChoice(`القطاع الذي يمثل «${cats[t]}» يساوي…`,['نصف الدائرة','ربع الدائرة','ثُمن الدائرة'],fr[t]===0.5?0:1,{any:'إذا شفتي قطاعاً ← أقارنه بالدائرة: لو يغطي نصفها ← نصف، لو يغطي نص النصف ← ربع.'}));
  return {fig,steps,label:'التمثيل بالقطاعات الدائرية'}}
function tallyQuestion(){
  const th=pick(THEMES);const n=Math.min(4,th.cats.length);const cats=th.cats.slice(0,n);const v=distinctVals(n,1,2,17);const c={title:th.title,col1:th.what,cats,vals:v};const fig=tallyT(c);const a=rnd(0,n-1),b=(a+1+rnd(0,n-2))%n;
  const steps=[titleStep(th.title,ALL_TITLES.filter(t=>t!==th.title)),
   stepChoice('في لوحة الإشارات: كل أربعة خطوط بينهم خط مائل تساوي…',['٥','٤','٦'],0,{any:'إذا شفتي حزمة فيها خط مائل ← هي ٥ ← وأعدّ الباقي واحداً واحداً.'},'الحزمة = ٥'),
   stepNum(`كم عدد «${cats[a]}» (اعدّي الحزم ثم الخطوط المفردة)؟`,v[a],'إذا شفتي حزمة ← أعدّها ٥ ← وأعدّ بعدها الخطوط المفردة ← وأجمعهم.','العدد: '+ar(v[a]),th.unit),
   stepNum(`ما مجموع «${cats[a]}» و«${cats[b]}»؟`,v[a]+v[b],`إذا شفتي «مجموع» ← أجمع العددين ← وأحط ${ar(v[a])} + ${ar(v[b])}.`,`${ar(v[a])} + ${ar(v[b])} = ${ar(v[a]+v[b])}`,th.unit)];
  return {fig,steps,label:'جدول التكرار ولوحة الإشارات'}}
function spinQuestion(){
  const letters=pick([['ي','س','ع','و','د'],['أ','ب','ج','د','هـ','و'],null]);let labels;if(letters)labels=letters;else{const b=shuffle([3,5,7,9,11,13]).slice(0,6);labels=b.map(ar)}
  const n=labels.length;const rep=rnd(0,1);const dupIdx=rnd(0,n-1);const L2=labels.slice();if(rep&&n>=5){L2[(dupIdx+2)%n]=L2[dupIdx]}
  const t=pick(L2);const cnt=L2.filter(x=>x===t).length;const fig=spinC({labels:L2});
  const absent=letters?'ز':ar(16);
  const steps=[stepNum('كم قطاعاً (جزءاً متساوياً) على المؤشر؟',n,'إذا شفتي مؤشراً دوّاراً ← أعدّ كل القطاعات ← وهذا يكون «الكل» اللي تحت الرقم في الاحتمال.','عدد القطاعات = '+ar(n)),
   stepNum(`كم قطاعاً مكتوب عليه «${t}»؟`,cnt,'إذا شفتي سؤال عن حرف أو عدد ← أعدّ كم قطاعاً فيه ذاك الحرف أو العدد ← وهذا يكون «المطلوب».','عدد القطاعات المطلوبة = '+ar(cnt)),
   stepChoice(`ما احتمال أن يقف المؤشر عند «${t}»؟`,[`${ar(cnt)} من ${ar(n)}`,`${ar(n)} من ${ar(cnt)}`,`${ar(cnt)} من ${ar(n+1)}`],0,{any:'إذا شفتي «احتمال» ← أكتب (المطلوب) من (الكل) ← يعني «'+ar(cnt)+' من '+ar(n)+'» وليس العكس.'},'الاحتمال = '+ar(cnt)+' من '+ar(n)),
   stepChoice(`احتمال أن يقف المؤشر عند «${absent}» هو…`,['مستحيل','مؤكد','أكثر احتمالاً'],0,{any:'إذا شفتي حرفاً أو عدداً مو موجود على القرص ← ما راح يقف عليه أبداً ← هذا «مستحيل».'},'الذي ليس على القرص = مستحيل')];
  return {fig,steps,label:'الاحتمال والمؤشر الدوّار'}}
const GEN={bar:()=>barQuestion(false),barh:()=>barQuestion(true),line:lineQuestion,pie:pieQuestion,tally:tallyQuestion,spin:spinQuestion};
let SETS=[
 {id:'tally',title:'٣-١ جدول التكرار ولوحة الإشارات',gens:['tally']},
 {id:'bar',title:'٣-٣ التمثيل بالأعمدة (رأسية وأفقية)',gens:['bar','barh']},
 {id:'line',title:'٣-٤ التمثيل بالخطوط',gens:['line']},
 {id:'pie',title:'٣-٥ التمثيل بالقطاعات الدائرية',gens:['pie']},
 {id:'spin',title:'٣-٦ الاحتمال والمؤشر الدوّار',gens:['spin']},
 {id:'mix',title:'كل الأنواع معاً (تدريب مختلط)',gens:['tally','bar','barh','line','pie','spin']}];
/* ---------- تدفق السؤال ---------- */
let CUR,QI,SI,ROUND,SET,TRIES,PERF;
if(__NOSETS__)SETS=[];
function menu(){$('#bar').innerHTML='';$('#pr').textContent='';$('#mn').style.display='none';$('#stars').textContent='';
 let h=(SETS.length?`<div class="card menu"><div class="big">📊 تدريب على الرسوم (يتغير كل مرة)</div><div class="small" style="text-align:center;margin-bottom:4px">كل جولة رسوم وأرقام جديدة، فتتدرّبين بدون ما تحفظين الجواب</div>`+SETS.map(s=>`<button class="opt" data-s="${s.id}"><b>${s.title}</b> <span class="small">(${ar(ST.done[s.id]||0)} جولة)</span></button>`).join('')+`</div>`:'');
 EXAMS.forEach(g=>{h+=`<div class="card menu" style="border-color:#e03131"><div class="big">📝 ${g.title}</div><div class="small" style="text-align:center;margin-bottom:4px">${g.sub}</div><button class="opt" data-s="exam:${g.id}"><b>ابدئي الأسئلة</b> <span class="small">(${ar(g.items.length)} سؤالاً)</span></button></div>`});
 $('#app').innerHTML=h;document.querySelectorAll('.opt[data-s]').forEach(b=>b.onclick=()=>b.dataset.s.startsWith('exam:')?startExam(b.dataset.s.slice(5)):startSet(b.dataset.s))}
function startSet(id){SET=SETS.find(s=>s.id===id);ROUND=Array.from({length:6},(_,i)=>{const g=SET.gens[i%SET.gens.length];return GEN[g]()});QI=0;PERF=0;$('#mn').style.display='';nextQ()}
function nextQ(){if(QI>=ROUND.length){ST.done[SET.id]=(ST.done[SET.id]||0)+1;save();return endRound()}CUR=ROUND[QI];SI=0;TRIES=0;stepView()}
function barUI(){const k=CUR.steps.length;$('#bar').innerHTML=CUR.steps.map((s,i)=>`<span class="${i<SI?'done':i===SI?'on':''}">خطوة ${ar(i+1)}</span>`).join('');$('#pr').textContent=`رسم ${ar(QI+1)} من ${ar(ROUND.length)}`;$('#stars').textContent='⭐ '+ar(ST.stars)}
function stepView(){barUI();const s=CUR.steps[SI];
 let h=`<div class="card"><div class="small" style="color:#4a2fc0;font-weight:800">📊 ${CUR.label}</div><div class="fig">${CUR.fig}</div></div><div class="card"><div class="q">${L(s.q)}</div>`;
 if(s.kind==='choice')h+=s.opts.map((t,i)=>`<button class="opt" data-i="${i}">${L(t)}</button>`).join('');
 else h+=`<input class="ans" id="in" inputmode="numeric" pattern="[0-9٠-٩]*" autocomplete="off" placeholder="الجواب ${s.unit?'('+s.unit+')':''}"><div style="text-align:center"><button class="go" id="ck">تأكدي ✓</button></div>`;
 h+=`<div id="fb"></div></div>`;$('#app').innerHTML=h;
 if(s.kind==='choice')document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pickOpt(b,s));
 else{$('#ck').onclick=()=>checkNum(s);$('#in').onkeydown=e=>{if(e.key==='Enter')checkNum(s)};setTimeout(()=>{try{$('#in').focus()}catch(e){}},50)}}
function pickOpt(b,s){const i=+b.dataset.i;if(i===s.ci){b.classList.add('ok');document.querySelectorAll('.opt').forEach(x=>x.disabled=true);return stepOk(s)}
 TRIES++;b.classList.add('no');$('#fb').innerHTML=`<div class="coach warn">💡 ${L(s.hints[i]||s.hints.any||'جرّبي خياراً ثانياً.')}</div>`}
function checkNum(s){const v=toEn($('#in').value);if(v==='')return;if(+v===s.ans){$('#ck').disabled=true;$('#in').disabled=true;return stepOk(s)}TRIES++;
 $('#fb').innerHTML=TRIES>=3?`<div class="coach warn">${L(s.after)} ✅ بنعيد النوع هذا بعدين 💪</div><div style="text-align:center"><button class="go" id="nx">أكملي ←</button></div>`:`<div class="coach warn">💡 ${L(s.hint)}</div>`;
 if(TRIES>=3){$('#nx').onclick=()=>{PERF=-1;advance()}}}
function stepOk(s){const last=SI===CUR.steps.length-1;$('#fb').innerHTML=`<div class="coach">✅ ${s.after?L(s.after)+' — ':''}${last?praise():'أحسنتِ!'}</div><div style="text-align:center"><button class="go g" id="nx">${last?'الرسم التالي ←':'الخطوة التالية ←'}</button></div>`;if(last){ST.stars+=TRIES===0?2:1;save()}$('#nx').onclick=advance}
function advance(){SI++;if(SI>=CUR.steps.length){QI++;nextQ()}else{TRIES=0;stepView()}}
function endRound(){$('#bar').innerHTML='';$('#app').innerHTML=`<div class="card fin"><div class="st">🏆</div><div class="big">أنهيتِ الجولة يا نادين!</div><p>${praise()}</p><p>نجومك: <b>${ar(ST.stars)}</b> ⭐</p><button class="go g" id="ag">جولة جديدة (رسوم جديدة) 🎲</button><button class="go gray" onclick="menu()">☰ القائمة</button></div>`;$('#ag').onclick=()=>startSet(SET.id);$('#stars').textContent='⭐ '+ar(ST.stars)}
/* ---------- أسئلة الاختبارات (نصاً) ---------- */
let EQ,EI;
function startExam(id){EQ=EXAMS.find(g=>g.id===id).items.slice();EI=0;$('#mn').style.display='';examQ()}
function examQ(){if(EI>=EQ.length){$('#app').innerHTML=`<div class="card fin"><div class="st">🏆</div><div class="big">أنهيتِ أسئلة الاختبارات!</div><p>${praise()}</p><button class="go gray" onclick="menu()">☰ القائمة</button></div>`;return}
 const q=EQ[EI];$('#bar').innerHTML='';$('#pr').textContent=`سؤال ${ar(EI+1)} من ${ar(EQ.length)}`;
 let h=`<div class="card"><div class="small" style="color:#4a2fc0;font-weight:800">📝 ${q.lesson||''}</div><div class="q">${L(q.text)}</div>${q.img?`<div class="fig">${q.orig?`<div style="display:flex;gap:8px;align-items:flex-start"><div style="flex:1"><img src="${q.img}"></div><div style="width:30%;font-size:.7rem"><img src="${q.orig}" style="filter:grayscale(1)"><div>الصورة الأصلية في الورقة</div></div></div>`:`<img src="${q.img}">`}</div>`:''}<div class="src">جاء في: ${q.src}</div>`;
 if(q.options&&q.options.length&&q.ci>=0)h+=q.options.map((t,i)=>`<button class="opt" data-i="${i}">${L(t)}</button>`).join('')+'<div id="fb"></div>';
 else h+=`<div class="coach">✍️ اكتبي جوابك في دفترك، وبعدين اضغطي «أعرض الحل».</div><div id="fb"></div><div style="text-align:center"><button class="go" id="sh">أعرض الحل</button></div>`;
 $('#app').innerHTML=h+'</div>';
 const explain=()=>{const e=q.explain||{};return `<div class="coach"><b class="red">① أول شيء:</b> ${L(e.task||'')}<br><b>② ${L(e.think||'')}</b><br>${(e.steps||[]).map(x=>'• '+L(x)).join('<br>')}<br><b>الجواب: ${L(q.answer||e.answer||'')}</b>${e.why?'<br><b>ليش؟</b> '+L(e.why):''}</div><div style="text-align:center"><button class="go g" id="nx">التالي ←</button></div>`};
 if(q.options&&q.options.length&&q.ci>=0)document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(i===q.ci){b.classList.add('ok');document.querySelectorAll('.opt').forEach(x=>x.disabled=true);$('#fb').innerHTML=explain();$('#nx').onclick=()=>{EI++;examQ()}}else{b.classList.add('no');$('#fb').innerHTML=`<div class="coach warn">💡 ليس هذا الخيار. اقرئي السؤال والرسم مرة ثانية بالخطوات، وجرّبي خياراً ثانياً.</div>`}});
 else $('#sh').onclick=()=>{$('#fb').innerHTML=explain();$('#sh').style.display='none';$('#nx').onclick=()=>{EI++;examQ()}}}
function hashOpen(){const m=location.hash.match(/set=([a-z0-9]+)/);if(m){if(m[1].startsWith('exam'))startExam(m[1].slice(4)||EXAMS[0].id);else if(SETS.some(s=>s.id===m[1]))startSet(m[1]);else menu()}else menu()}
hashOpen();
</script></body></html>
