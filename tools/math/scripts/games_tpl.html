<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ألعاب الاختبارات المركزية</title>
<style>
@font-face{font-family:'B';font-weight:800;src:url('../shared/fonts/Baloo-ExtraBold.ttf')}
@font-face{font-family:'B';font-weight:500;src:url('../shared/fonts/Baloo-Medium.ttf')}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--p:#6741d9;--g:#2f9e44;--r:#e03131;--y:#f59f00;--b:#1c7ed6}
body{margin:0;min-height:100vh;background:linear-gradient(#fff8e1,#fff0f6);font-family:'B',sans-serif;font-weight:500;color:#222;padding:10px 10px 30px;line-height:1.6}
.wrap{max-width:760px;margin:auto}
h1{font-weight:800;font-size:1.5rem;margin:6px 0 0;text-align:center;color:var(--p)}
.sub{text-align:center;font-size:.9rem;color:#666;margin-bottom:8px}
.card{background:#fff;border:4px solid #e5dbff;border-radius:22px;padding:12px 14px;margin:10px 0;box-shadow:0 3px 0 #e5dbff}
.btn{font:inherit;font-weight:800;font-size:1.05rem;border:4px solid var(--p);background:var(--p);color:#fff;border-radius:18px;padding:10px 18px;margin:4px;cursor:pointer;min-height:50px}
.btn.o{background:#fff;color:var(--p)}.btn.g{background:var(--g);border-color:var(--g)}.btn.y{background:var(--y);border-color:var(--y);color:#222}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.chap{display:block;width:100%;text-align:right;font:inherit;font-weight:800;border:4px solid #d0bfff;background:#fff;border-radius:18px;padding:10px 14px;cursor:pointer}
.chap small{display:block;font-weight:500;color:#777}
.lv{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;margin:4px;border-radius:50%;border:4px solid #d0bfff;background:#fff;font:inherit;font-weight:800;cursor:pointer;position:relative}
.lv.done{background:#d3f9d8;border-color:var(--g)}.lv.gold{border-color:var(--y);background:#fff9db}.lv.gold.done{background:#ffe066}
.lv i{position:absolute;top:-8px;right:-4px;font-size:.9rem;font-style:normal}
h2{font-size:1.05rem;color:var(--p);margin:10px 0 2px}
.badge{display:inline-block;background:var(--r);color:#fff;border-radius:10px;padding:0 10px;font-weight:800;font-size:.85rem}
.gold-b{background:linear-gradient(90deg,#f59f00,#ffd43b);color:#4a2b00;border-radius:12px;padding:2px 12px;font-weight:800;display:inline-block;animation:glow 1.6s infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 #ffd43b}to{box-shadow:0 0 14px #ffd43b}}
.q{font-size:1.2rem;font-weight:800;margin:6px 0}
.src{background:#fff3bf;border:2px solid var(--y);border-radius:10px;padding:2px 10px;font-size:.8rem;color:#7a4b00;margin:4px 0}
.fig{text-align:center;margin:6px 0;animation:pop .5s}.fig img{max-width:100%;max-height:300px;border-radius:10px}
.fig2{display:flex;gap:8px;align-items:flex-start}.fig2 .rd{flex:1;text-align:center}.fig2 .rd img{max-width:100%;max-height:300px}.fig2 .or{width:28%;font-size:.7rem;text-align:center;color:#666}.fig2 .or img{max-width:100%;filter:grayscale(1)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.stage{background:#e7f5ff;border:3px solid var(--b);border-radius:16px;padding:8px 12px;margin:8px 0;font-weight:800;color:#0b5394}
.opt{display:block;width:100%;text-align:right;font:inherit;font-size:1.05rem;border:4px solid #dee2e6;background:#fff;border-radius:16px;padding:10px 14px;margin:6px 0;cursor:pointer;min-height:50px}
.opt.ok{border-color:var(--g);background:#ebfbee;animation:pop .4s}.opt.no{border-color:var(--r);background:#fff5f5}
.coach{background:#fff3bf;border:3px solid var(--y);border-radius:16px;padding:8px 12px;margin:8px 0}
.good{background:#ebfbee;border:3px solid var(--g);border-radius:16px;padding:8px 12px;margin:8px 0}
.red{color:var(--r);font-weight:800}
input.in{font:inherit;font-size:1.3rem;width:100%;border:4px solid var(--p);border-radius:14px;padding:8px 12px;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.stars{font-weight:800;color:#e67700}
.cup{font-size:5rem;text-align:center;animation:bounce 1s infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-14px)}}
.foot{margin-top:18px;text-align:center;color:#8a8a8a;font-size:.72rem;line-height:1.7}.foot span{font-size:.65rem}
.small{font-size:.8rem;color:#777}
.pl{display:flex;gap:8px}.pl input{flex:1;font:inherit;border:3px solid #d0bfff;border-radius:12px;padding:8px}
.sc{display:flex;gap:8px;margin:6px 0}.sc div{flex:1;border:4px solid #d0bfff;border-radius:16px;padding:6px;text-align:center;font-weight:800}.sc .on{border-color:var(--g);background:#ebfbee}
@media(min-width:1000px){body{font-size:22px}.wrap{max-width:1300px}h1{font-size:2.3rem}.q{font-size:1.9rem}.opt{font-size:1.5rem;min-height:72px;padding:14px 22px}.btn{font-size:1.4rem;min-height:66px;padding:12px 28px}.stage{font-size:1.45rem}.card{padding:18px 24px}.lv{width:72px;height:72px;font-size:1.5rem}.fig img{max-height:420px}.fig2 .rd img{max-height:420px}.src{font-size:1.1rem}.coach,.good{font-size:1.35rem}.tk{font-size:1.7rem!important}input.in{font-size:2rem}}
@media(min-width:1600px){body{font-size:26px}.wrap{max-width:1600px}}
.tk{display:inline-block;margin:3px 2px;padding:2px 10px;border-radius:12px;border:3px solid transparent;cursor:pointer;font-size:1.25rem;font-weight:800}.tk.on{background:#a5d8ff;border-color:#1c7ed6}.tk.ok{background:#b2f2bb;border-color:#2f9e44}.tk.bad{background:#ffc9c9;border-color:#e03131}
</style></head><body><div class="wrap">
<h1>🎮 ألعاب الاختبارات المركزية</h1>
<div class="sub">رياضيات · الصف الرابع الابتدائي · كل سؤال مرحلة: تفكّرين وتحلّلين وتجاوبين</div>
<div id="app"></div>
<div class="foot">إعداد: عواطف الجهني ✨ اللهم بارك لي في أولادي ووالديّ وإخواني ووفّقهم<br><span>جهد شخصي لوجه الله، ولا يُعتمد عليه وحده</span></div>
</div>
<script>
const DATA=__DATA__;
const CH={1:'القيمة المنزلية',2:'الجمع والطرح',3:'تنظيم البيانات وعرضها',4:'الأنماط والجبر',5:'الضرب في عدد من رقم واحد',6:'الضرب في عدد من رقمين'};
const SEC=[['tf','صح وخطأ'],['mcq','اختيار من متعدد'],['word','مسائل لفظية'],['other','جداول ورسوم وأسئلة أخرى']];
const $=s=>document.querySelector(s);
const AR='٠١٢٣٤٥٦٧٨٩',ar=n=>String(n).replace(/\d/g,d=>AR[d]);
const toEn=s=>String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.').replace(/[^\d.]/g,'');
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const L=s=>esc(s).replace(/([+−×÷=<>△□○])/g,'‎$1‎').replace(/(\d)-(?=\d)/g,'$1‎-‎');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const PRAISE=['أحسنتِ! لأنك فكّرتِ قبل أن تجيبي ✨','ركّزتِ فوصلتِ 🌟','اجتهدتِ والتوفيق من الله 🤍','هكذا يحلّ من يفهم لا من يحفظ 💡','ممتاز! سألتِ نفسك فوصلتِ للجواب 👏'];
const pr=()=>PRAISE[Math.floor(Math.random()*PRAISE.length)];
let ST={stars:0,done:{}};try{ST=Object.assign(ST,JSON.parse(localStorage.getItem('markaz_math_v1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('markaz_math_v1',JSON.stringify(ST))}catch(e){}};
const task=it=>String((it.ex&&it.ex.task)||'').replace(/^المطلوب\s*:?\s*/,'').trim();
let NAV=[];
function home(){NAV=[];
 const gold=Object.values(DATA).flat().filter(i=>i.n>=2);
 let h=`<div class="card"><div class="top"><b>اختاري اللعب</b><span class="stars">⭐ ${ar(ST.stars)}</span></div><div class="small">كل فصل فيه مراحل. السؤال الذهبي 🔁 جاء أكثر من مرة في الاختبارات، فاهتمي به.</div></div>`;
 h+='<div class="grid">'+Object.keys(DATA).map(c=>{const it=DATA[c];const d=it.filter(i=>ST.done[i.id]).length;return `<button class="chap" onclick="chapter(${c})">📘 الفصل ${ar(c)}: ${CH[c]}<small>${ar(it.length)} مرحلة · أنجزتِ ${ar(d)} · ${ar(it.filter(i=>i.n>=2).length)} ذهبية</small></button>`}).join('')+'</div>';
 h+=`<div class="card"><button class="btn y" onclick="goldAll()">🌟 كل الأسئلة الذهبية (${ar(gold.length)})</button><button class="btn g" onclick="contestSetup()">👭 مسابقة لطالبتين</button></div>`;
 $('#app').innerHTML=h}
function chapter(c){const it=DATA[c];
 let h=`<div class="top"><button class="btn o" onclick="home()">→ الرئيسية</button><span class="stars">⭐ ${ar(ST.stars)}</span></div><div class="card"><h2 style="margin:0">الفصل ${ar(c)}: ${CH[c]}</h2><div class="small">اضغطي أي مرحلة. 🌟 الذهبية = تكررت في الاختبارات.</div></div>`;
 const gold=it.filter(i=>i.n>=2);
 if(gold.length)h+=`<div class="card"><h2>🌟 الأسئلة الذهبية (تكررت)</h2>`+gold.map(i=>lvBtn(i,it)).join('')+'</div>';
 SEC.forEach(([k,t])=>{const part=it.filter(i=>i.k===k&&i.n<2);if(part.length)h+=`<div class="card"><h2>${t}</h2>`+part.map(i=>lvBtn(i,it)).join('')+'</div>'});
 $('#app').innerHTML=h}
function lvBtn(i,it){const n=it.indexOf(i)+1;return `<button class="lv ${i.n>=2?'gold':''} ${ST.done[i.id]?'done':''}" onclick='play(${JSON.stringify(i.id)})'>${ar(n)}${i.n>=2?'<i>🌟</i>':''}${ST.done[i.id]?'<i style="right:auto;left:-4px">✅</i>':''}</button>`}
function find(id){for(const c in DATA){const i=DATA[c].find(x=>x.id===id);if(i)return [i,+c]}}
let CUR,CC,TRIES,MODE='solo',CONT=null,PEND=null;
function goldAll(){const g=Object.entries(DATA).flatMap(([c,a])=>a.filter(i=>i.n>=2));
 $('#app').innerHTML=`<div class="top"><button class="btn o" onclick="home()">→ الرئيسية</button></div><div class="card"><h2>🌟 الأسئلة الذهبية</h2>`+g.map((i,k)=>`<button class="lv gold ${ST.done[i.id]?'done':''}" onclick='play(${JSON.stringify(i.id)})'>${ar(k+1)}</button>`).join('')+'</div>'}
function figHtml(i){if(!i.img)return '';
 const rd=i.html?`<div class="mount" data-fid="${esc(i.id)}"></div><div style="text-align:center"><button class="btn o" style="min-height:40px;padding:2px 14px;font-size:.9rem" onclick="replayFig()">▶ شوفي الرسم يتحرك</button></div>`:`<img src="${i.img}" alt="">`;
 return `<div class="fig">${i.orig?`<div class="fig2"><div class="rd">${rd}</div><div class="or"><img src="${i.orig}" alt="">الصورة الأصلية في الورقة</div></div>`:rd}</div>`}
function mountOne(m){const it=find(m.dataset.fid)[0];const sh=m.shadowRoot||m.attachShadow({mode:'open'});sh.innerHTML='<style>:host{display:block;direction:rtl;text-align:center}svg{max-width:100%;height:auto}table{margin:auto}</style>'+it.html;m.dataset.done='1';animateFig(sh)}
function replayFig(){document.querySelectorAll('.mount').forEach(mountOne)}
new MutationObserver(()=>document.querySelectorAll('.mount:not([data-done])').forEach(mountOne)).observe(document.body,{childList:true,subtree:true});
function animateFig(sh){const A=(el,kf,opt)=>{try{return el.animate(kf,Object.assign({fill:'backwards'},opt))}catch(e){}};
 sh.querySelectorAll('svg').forEach(svg=>{
  const circles=[...svg.querySelectorAll('circle')];const big=circles.find(c=>+c.getAttribute('r')>=100);
  const polys=[...svg.querySelectorAll('polygon')];
  const sw=+(svg.getAttribute('width')||(svg.viewBox&&svg.viewBox.baseVal&&svg.viewBox.baseVal.width)||500);
  const rects=[...svg.querySelectorAll('rect')].filter(r=>{const w=+r.getAttribute('width'),h=+r.getAttribute('height');return w>0&&h>0&&w<sw*0.9&&!(r.getAttribute('fill')==='none'&&!r.getAttribute('stroke'))});
  if(rects.length&&!big){const horiz=new Set(rects.map(r=>Math.round(+r.getAttribute('x')))).size===1;
   rects.forEach((r,k)=>{r.style.transformBox='fill-box';r.style.transformOrigin=horiz?'left':'bottom';A(r,[{transform:horiz?'scaleX(0)':'scaleY(0)'},{transform:'none'}],{duration:700,delay:300+k*250,easing:'ease-out'})})}
  svg.querySelectorAll('polyline').forEach(p=>{const len=p.getTotalLength?p.getTotalLength():300;p.style.strokeDasharray=len;A(p,[{strokeDashoffset:len},{strokeDashoffset:0}],{duration:1400,delay:300,easing:'ease-in-out'})});
  const cx=big?+big.getAttribute('cx'):sw/2,cy=big?+big.getAttribute('cy'):sw/2;
  [...svg.querySelectorAll('path')].filter(p=>p.getAttribute('fill')&&p.getAttribute('fill')!=='none').forEach((p,k)=>{p.style.transformOrigin=cx+'px '+cy+'px';A(p,[{opacity:0,transform:'scale(.3)'},{opacity:1,transform:'none'}],{duration:600,delay:300+k*400,easing:'ease-out'})});
  if(big&&polys.length){polys.forEach(pg=>{pg.style.transformOrigin=cx+'px '+cy+'px';A(pg,[{transform:'rotate(0deg)'},{transform:'rotate(1080deg)'}],{duration:2600,delay:300,easing:'cubic-bezier(.2,.8,.2,1)'})})}
  circles.filter(c=>c!==big&&+c.getAttribute('r')<12).forEach((c,k)=>{c.style.transformBox='fill-box';c.style.transformOrigin='center';A(c,[{opacity:0,transform:'scale(0)'},{opacity:1,transform:'none'}],{duration:350,delay:1500+k*150})});
  svg.querySelectorAll('text').forEach((tx,k)=>A(tx,[{opacity:0},{opacity:1}],{duration:400,delay:k*60}))});
 sh.querySelectorAll('table tr').forEach((tr,k)=>A(tr,[{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:400,delay:200+k*250}))}
function head(i,c){return `<div class="top"><button class="btn o" onclick="${MODE==='cont'?'contestAbort()':`chapter(${c})`}">→ رجوع</button><span class="stars">⭐ ${ar(ST.stars)}</span></div><div class="card">${i.n>=2?`<span class="gold-b">🌟 سؤال ذهبي: <span style="background:none">🔁 تكرر ${ar(i.n)} مرات</span></span><br>`:''}<div class="q">${L(i.q)}</div>${figHtml(i)}<div class="src">جاء في: ${esc(i.src)}</div><div class="src" style="background:#e7f5ff;border-color:#1c7ed6;color:#0b5394">📖 في كتابك: ${esc(i.bk)}</div>${i.sim?`<div class="src" style="background:#f3f0ff;border-color:#b197fc;color:#5f3dc4">ونفس الفكرة بأرقام أخرى جاءت في: ${esc(i.sim)}</div>`:''}</div>`}
function play(id){const [i,c]=find(id);CUR=i;CC=c;TRIES=0;stageTask(i,c)}
function swapTask(t){const P=[['أكبر','أصغر'],['الأكبر','الأصغر'],['الأكثر','الأقل'],['أكثر','أقل'],['مجموع','الفرق'],['الجمع','الطرح'],['أطول','أقصر'],['الأطول','الأقصر'],['أعلى','أدنى'],['الأعلى','الأدنى'],['يزيد','ينقص'],['من الأصغر إلى الأكبر','من الأكبر إلى الأصغر'],['مؤكد','مستحيل']];for(const [a,b] of P){if(t.includes(a))return t.replace(a,b);if(t.includes(b))return t.replace(b,a)}return null}
function distract(i,t){const same=Object.values(DATA).flat().filter(x=>x.id!==i.id&&task(x)&&task(x)!==t);
 const near=shuffle(same.filter(x=>x.k===i.k&&x.lesson===i.lesson)).concat(shuffle(same.filter(x=>x.k===i.k)),shuffle(same));
 const out=[];const sw=swapTask(t);if(sw&&sw!==t)out.push(sw);for(const x of near){const y=task(x);if(!out.includes(y))out.push(y);if(out.length>=2)break}return out.slice(0,2)}
function afterTask(){const i=CUR;if(i.op&&MODE!=='cont')stageGiven();else stageAnswer()}
function stageGiven(){const i=CUR,c=CC;const words=i.q.split(/\s+/).filter(Boolean);const isNum=w=>/[0-9٠-٩]/.test(w);const sel=new Set();let tr=0;
 const draw=()=>{$('#app').innerHTML=head(i,c)+`<div class="card"><div class="stage">🔵 المرحلة ٢: المعطيات. اضغطي على <b>الأعداد</b> التي أعطاك إياها السؤال (وسيظهر لونها أزرق).</div><div class="q" style="line-height:2.4">`+words.map((w,k)=>`<span class="tk ${sel.has(k)?'on':''}" data-k="${k}">${L(w)}</span>`).join(' ')+`</div><div style="text-align:center"><button class="btn" id="ck">تأكدي ✓</button></div><div id="fb"></div></div>`;
  document.querySelectorAll('.tk').forEach(s=>s.onclick=()=>{const k=+s.dataset.k;if(sel.has(k))sel.delete(k);else sel.add(k);draw()});
  $('#ck').onclick=()=>{const need=words.map((w,k)=>isNum(w)?k:-1).filter(k=>k>=0);const miss=need.filter(k=>!sel.has(k));const extra=[...sel].filter(k=>!isNum(words[k]));
   if(!miss.length&&!extra.length){document.querySelectorAll('.tk').forEach(s=>{if(sel.has(+s.dataset.k))s.classList.add('ok')});$('#fb').innerHTML=`<div class="good">أحسنتِ! ✅ المعطيات: ${need.map(k=>L(words[k])).join('، ')}<br>المطلوب أولاً ثم المعطيات، هكذا نحلّل المسألة. <button class="btn g" id="g3">المرحلة ٣ ←</button></div>`;$('#g3').onclick=()=>stageOp(0)}
   else{tr++;draw();const tx=miss.length?`💡 اسألي نفسك: هل بقي عدد في السؤال لم ألوّنه؟ (ناقص ${miss.length})`:`💡 لوّنتِ كلمة ليست عدداً. المعطيات هي الأعداد وما تدل عليه.`;$('#fb').innerHTML=`<div class="coach">${tx}${tr>=3?'<br>تلميح: عدد الأعداد في السؤال = '+need.length:''}</div>`;if(extra.length)document.querySelectorAll('.tk').forEach(s=>{if(extra.includes(+s.dataset.k))s.classList.add('bad')})}}};draw()}
const OPN={'+':'➕ جمع','−':'➖ طرح','×':'✖ ضرب','÷':'➗ قسمة'};
const OPW={'+':'جمع: نضمّ الأشياء معاً، أو نسأل عن «الكل» أو «المجموع».','−':'طرح: شيء نقص أو بقي أو أُعطي، أو نسأل «كم يزيد» أو «الفرق».','×':'ضرب: نفس العدد يتكرر مرات (مثل «كل يوم»، «في كل صف»).','÷':'قسمة: نوزّع بالتساوي، أو نسأل «كم مرة يتسع» عدد في عدد.'};
function stageOp(k){const i=CUR,c=CC,want=i.op[k];let tr=0;
 $('#app').innerHTML=head(i,c)+`<div class="card"><div class="stage">⚙️ المرحلة ٣: أي عملية نستعمل ${i.op.length>1?(k?'ثانياً':'أولاً'):''}؟ دوّري على الكلمة المفتاحية في السؤال${i.kw?': «'+esc(i.kw)+'»':''}</div><div class="grid">`+['+','−','×','÷'].map(o=>`<button class="opt" data-o="${o}" style="text-align:center">${OPN[o]}</button>`).join('')+'</div><div id="fb"></div></div>';
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const o=b.dataset.o;if(o===want){b.classList.add('ok');document.querySelectorAll('.opt').forEach(x=>x.disabled=true);$('#fb').innerHTML=`<div class="good">أحسنتِ! ✅ ${esc(OPW[want])} <button class="btn g" id="go2">${k+1<i.op.length?'العملية الثانية ←':'المرحلة ٤ ←'}</button></div>`;$('#go2').onclick=()=>k+1<i.op.length?stageOp(k+1):stageAnswer()}else{tr++;b.classList.add('no');$('#fb').innerHTML=tr<2?`<div class="coach">💡 اسألي نفسك: ماذا تقول الكلمة المفتاحية${i.kw?' «'+esc(i.kw)+'»':''}؟ هل نضمّ؟ أم ينقص؟ أم يتكرر؟ أم نوزّع؟</div>`:`<div class="coach">💡 تلميح قوي: ${esc(OPW[want])}</div>`}})}
function stageTask(i,c){
 const t=task(i);if(!t||MODE==='cont'){return afterTask()}
 const opts=shuffle([t,...distract(i,t)]);
 $('#app').innerHTML=head(i,c)+`<div class="card"><div class="stage">🔎 المرحلة ١: ركّزي. اقرئي السؤال مرتين، ثم اسألي نفسك: ماذا يُطلب مني؟</div>`+opts.map((o,k)=>`<button class="opt" data-k="${k}">${L(o)}</button>`).join('')+'<div id="fb"></div></div>';
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const p=opts[+b.dataset.k];if(p===t){b.classList.add('ok');$('#fb').innerHTML=`<div class="good">أحسنتِ! عرفتِ المطلوب أولاً، وهذه أهم خطوة ✅ <button class="btn g" id="go">المرحلة ٢ ←</button></div>`;document.querySelectorAll('.opt').forEach(x=>x.disabled=true);$('#go').onclick=()=>afterTask()}else{b.classList.add('no');$('#fb').innerHTML=`<div class="coach">💡 اقرئي السؤال مرة ثانية ببطء. اسألي نفسك: ما الذي يسأل عنه في آخر السؤال؟ ثم اختاري.</div>`}})}
function stageAnswer(){const i=CUR,c=CC;let h=head(i,c)+'<div class="card"><div class="stage">🧠 المرحلة '+((i.op&&MODE!=='cont')?'٤':'٢')+': فكّري وحلّلي، ثم أجيبي.</div>';
 if(i.kind==='mcq'){h+=i.o.map((o,k)=>`<button class="opt" data-k="${k}">${L(o)}</button>`).join('')}
 else if(i.kind==='tf'){h+=`<button class="opt" data-k="1">✔ صح</button><button class="opt" data-k="0">✘ خطأ</button>`}
 else if(i.kind==='num'){h+=`<input class="in" id="in" inputmode="decimal" placeholder="اكتبي الجواب" autocomplete="off"><div style="text-align:center"><button class="btn" id="ck">تأكدي ✓</button></div>`}
 else{h+=`<div class="coach">✍️ اكتبي حلك في دفترك أولاً، وفكّري خطوة خطوة. ثم اضغطي «أعرض الحل».</div><div style="text-align:center"><button class="btn" id="sh">أعرض الحل خطوة خطوة</button></div>`}
 $('#app').innerHTML=h+'<div id="fb"></div></div>';
 if(i.kind==='mcq'||i.kind==='tf'){document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;const ok=i.kind==='mcq'?k===i.ans:(k===1)===i.ans;check(ok,b)})}
 else if(i.kind==='num'){const f=()=>{const v=parseFloat(toEn($('#in').value));if(isNaN(v))return;check(Math.abs(v-i.ans)<1e-9,null)};$('#ck').onclick=f;$('#in').onkeydown=e=>{if(e.key==='Enter')f()}}
 else{$('#sh').onclick=()=>reveal(0)}}
function check(ok,b){const i=CUR;if(ok){if(b)b.classList.add('ok');document.querySelectorAll('.opt').forEach(x=>x.disabled=true);if($('#ck')){$('#ck').disabled=true;$('#in').disabled=true}
  const st=TRIES===0?2:1;if(MODE==='cont')return contestRight(st);
  if(!ST.done[i.id]){ST.stars+=st;ST.done[i.id]=st;save()}
  explain(true)}
 else{TRIES++;if(b)b.classList.add('no');if(MODE==='cont')return contestWrong();
  const ex=i.ex||{};
  if(TRIES===1)$('#fb').innerHTML=`<div class="coach">💡 <b>اسألي نفسك:</b> ${L(ex.think||'ما المطلوب؟ وماذا عندي؟ ثم أي خطوة؟')}<br>جرّبي مرة ثانية.</div>`;
  else if(TRIES===2)$('#fb').innerHTML=`<div class="coach">💡 <b>خطوات تساعدك:</b><br>${(ex.steps||[]).slice(0,2).map(s=>'• '+L(s)).join('<br>')}<br>جرّبي مرة ثالثة.</div>`;
  else{explain(false)}}}
function bigFig(i){return i.big?`<div class="fig"><img src="${i.big}" alt=""><div class="small">الصورة كما هي في الورقة</div></div>`:''}
function explain(win){const i=CUR,ex=i.ex||{};
 $('#fb').innerHTML=`<div class="${win?'good':'coach'}">${win?'🎉 '+pr():'لا بأس! سنفهمها معاً، وبعدها تعيدينها وحدك 💪'}</div>${bigFig(i)}<div class="good"><div class="red">① المطلوب: ${L(task(i))}</div>${ex.think?`<div><b>② ${L(ex.think)}</b></div>`:''}${(ex.steps||[]).map(s=>`<div>• ${L(s)}</div>`).join('')}<div style="background:var(--g);color:#fff;border-radius:10px;padding:2px 10px;display:inline-block;margin:4px 0;font-weight:800">${L(ex.answer||i.fa)}</div>${ex.why?`<div style="color:#1c7ed6"><b>ليش؟</b> ${L(ex.why)}</div>`:''}${ex.tip?`<div style="color:#c2410c">💡 ${L(ex.tip)}</div>`:''}</div><div style="text-align:center"><button class="btn g" id="nx">المرحلة التالية ←</button></div>`;
 $('#nx').onclick=()=>nextLevel()}
function nextLevel(){const it=DATA[CC];const k=it.findIndex(x=>x.id===CUR.id);const nx=it[k+1];if(nx)play(nx.id);else chapter(CC)}
function reveal(k){const i=CUR,ex=i.ex||{};const st=[ex.task?'① المطلوب: '+task(i):'',ex.think?'② '+ex.think:'',...(ex.steps||[]).map(s=>'• '+s)].filter(Boolean);
 const shown=st.slice(0,k+1);
 $('#fb').innerHTML=`${k===0?bigFig(i):''}<div class="good">${shown.map(s=>`<div>${L(s)}</div>`).join('')}</div>`+(k+1<st.length?`<div style="text-align:center"><button class="btn" id="mr">الخطوة التالية ←</button></div>`:`<div class="good"><div style="background:var(--g);color:#fff;border-radius:10px;padding:2px 10px;display:inline-block;font-weight:800">${L(ex.answer||i.fa)}</div>${ex.why?`<div style="color:#1c7ed6"><b>ليش؟</b> ${L(ex.why)}</div>`:''}${ex.tip?`<div style="color:#c2410c">💡 ${L(ex.tip)}</div>`:''}</div><div class="stage">هل طابق حلك؟</div><div style="text-align:center"><button class="btn g" id="y">نعم ✅</button><button class="btn o" id="n">أحتاج أعيدها 🔁</button></div>`);
 if(k+1<st.length)$('#mr').onclick=()=>reveal(k+1);else{$('#y').onclick=()=>{if(!ST.done[i.id]){ST.stars+=2;ST.done[i.id]=2;save()}nextLevel()};$('#n').onclick=()=>{nextLevel()}}}
/* مسابقة طالبتين */
function contestSetup(){$('#app').innerHTML=`<div class="top"><button class="btn o" onclick="home()">→ الرئيسية</button></div><div class="card"><h2>👭 مسابقة لطالبتين (جهاز واحد)</h2><div class="small">تتناوبان: كل واحدة تجيب سؤالاً. الإجابة من أول مرة نقطتان، ومن الثانية نقطة. والفائزة تأخذ الكأس 🏆</div><div class="pl"><input id="p1" placeholder="اسم الأولى"><input id="p2" placeholder="اسم الثانية"></div><div class="small" style="margin-top:6px">اختاري الفصل:</div><div class="grid">`+Object.keys(DATA).map(c=>`<button class="chap" onclick="contestStart(${c})">الفصل ${ar(c)}: ${CH[c]}</button>`).join('')+`<button class="chap" onclick="contestStart(0)">كل الفصول</button></div></div>`}
function contestStart(c){const n1=($('#p1').value||'الأولى').trim(),n2=($('#p2').value||'الثانية').trim();
 const pool=(c?DATA[c]:Object.values(DATA).flat()).filter(i=>['mcq','tf','num'].includes(i.kind));
 CONT={names:[n1,n2],sc:[0,0],q:shuffle(pool).slice(0,10),k:0};MODE='cont';contestQ()}
function contestAbort(){MODE='solo';CONT=null;home()}
function contestQ(){if(CONT.k>=CONT.q.length)return contestEnd();CUR=CONT.q[CONT.k];CC=0;TRIES=0;const p=CONT.k%2;
 const board=`<div class="sc">${CONT.names.map((n,x)=>`<div class="${x===p?'on':''}">${esc(n)}<br>${ar(CONT.sc[x])} ⭐</div>`).join('')}</div>`;
 stageAnswerCont(board,p)}
function stageAnswerCont(board,p){const i=CUR;let h=`<div class="top"><button class="btn o" onclick="contestAbort()">→ إنهاء</button><span class="stars">سؤال ${ar(CONT.k+1)} من ${ar(CONT.q.length)}</span></div>${board}<div class="card"><div class="stage">دور: ${esc(CONT.names[p])} — فكّري وحلّلي ثم أجيبي</div><div class="q">${L(i.q)}</div>${figHtml(i)}`;
 if(i.kind==='mcq')h+=i.o.map((o,k)=>`<button class="opt" data-k="${k}">${L(o)}</button>`).join('');
 else if(i.kind==='tf')h+=`<button class="opt" data-k="1">✔ صح</button><button class="opt" data-k="0">✘ خطأ</button>`;
 else h+=`<input class="in" id="in" inputmode="decimal" placeholder="اكتبي الجواب" autocomplete="off"><div style="text-align:center"><button class="btn" id="ck">تأكدي ✓</button></div>`;
 $('#app').innerHTML=h+'<div id="fb"></div></div>';
 if(i.kind==='num'){const f=()=>{const v=parseFloat(toEn($('#in').value));if(isNaN(v))return;check(Math.abs(v-i.ans)<1e-9,null)};$('#ck').onclick=f}
 else document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;check(i.kind==='mcq'?k===i.ans:(k===1)===i.ans,b)})}
function contestRight(st){CONT.sc[CONT.k%2]+=st;contestNext(true)}
function contestWrong(){if(TRIES>=2){contestNext(false)}else{$('#fb').innerHTML=`<div class="coach">لا بأس، جرّبي مرة ثانية (تأخذين نقطة).</div>`}}
function contestNext(ok){const i=CUR;$('#fb').innerHTML=`<div class="${ok?'good':'coach'}">${ok?'🎉 '+pr():'الجواب الصحيح: '+L((i.ex&&i.ex.answer)||i.fa)}</div><div style="text-align:center"><button class="btn g" id="cn">التالي ←</button></div>`;document.querySelectorAll('.opt').forEach(x=>x.disabled=true);$('#cn').onclick=()=>{CONT.k++;contestQ()}}
function contestEnd(){const [a,b]=CONT.sc,n=CONT.names;const win=a===b?null:(a>b?0:1);
 $('#app').innerHTML=`<div class="card" style="text-align:center"><div class="cup">🏆</div><h2>${win===null?'تعادلتما! الكأس لكما معاً 🤝':'الكأس لـ '+esc(n[win])+' 🎉'}</h2><div class="sc">${n.map((x,k)=>`<div class="${k===win?'on':''}">${esc(x)}<br>${ar(CONT.sc[k])} ⭐</div>`).join('')}</div><p>أحسنتما! الجميع فائز لأنكما اجتهدتما 🤍</p><button class="btn g" onclick="contestSetup()">مسابقة جديدة</button><button class="btn o" onclick="contestAbort()">الرئيسية</button></div>`;MODE='solo'}
home();
</script></body></html>
