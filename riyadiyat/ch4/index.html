function render(){nav();const d=D[cur];let h='';
 h+='<div class="hero" style="background:linear-gradient(135deg,#69db7c,#38d9a9);box-shadow:0 5px 0 #20c997"><h1 style="font-size:22px">'+(d.id=='mix'?'🔄 مراجعة مخلوطة':'الدرس '+d.id.replace('4-','٤-')+' · '+d.title)+'</h1></div>';
 if(d.rule.length){h+='<div class="card"><h2>📖 من كتابكِ</h2>'+d.rule.map(r=>'<div class="rule">'+ltr(r.replace(/</g,'&lt;'))+'</div>').join('')+'<div class="src">📍 مكانه في كتابكِ: الفصل ٤ · درس '+d.id.replace('4-','٤-')+' · <b>ص '+ltr(d.pages.replace('ص',''))+'</b></div></div>'}
 if(d.how.length){h+='<div class="card"><h2>🧠 كيف نحلّل السؤال؟</h2><ol class="how">'+d.how.map(s=>'<li>'+s+'</li>').join('')+'</ol></div>'}
 if(['4-2','4-3','4-6'].includes(d.id)){h+=READ}
 h+='<div class="prog" id="prog">لفتح النجمة ⭐ أجيبي صح عن '+Math.ceil(d.items.length*NEED)+' من '+d.items.length+' بتأنٍّ، ولا يهم الوقت 🌷</div><h2 style="color:#5f3dc4;margin:14px 4px 0">✏️ نتدرّب</h2><div id="qs"></div>';
 if(d.id!='mix'){h+='<div class="card self"><h2>🤔 كيف أعرف أني فهمت؟</h2><ul><li>أستطيع أن أقول بكلماتي: «المطلوب هو…».</li><li>أعرف <b>لماذا</b> اخترتُ هذه العملية.</li><li>تحقّقتُ أن الجواب منطقي.</li></ul></div>'}
 h+='<div style="text-align:center;margin:10px"><button class="btn" onclick="go('+(cur+1<D.length?cur+1:0)+')">'+(cur+1<D.length?'الدرس التالي ←':'من البداية')+'</button></div>';
 document.getElementById('app').innerHTML=h;build()}
let score=0,answered=0;
function build(){const d=D[cur];score=0;answered=0;const box=document.getElementById('qs');box.innerHTML='';
 d.items.forEach((it,i)=>{const c=document.createElement('div');c.className='card';
  let h='<div class="src">'+it.src+' · سؤال '+(i+1)+' من '+d.items.length+'</div><div class="q">'+ltr(it.q)+'</div>'+table(it.table);
  if(it.kind=='mcq'){it.opts.forEach((o,k)=>{h+='<button class="opt" data-k="'+k+'">'+L[k]+') '+ltr(o)+'</button>'})}
  else if(it.kind=='open'){h+='<div class="src">اكتبي الجواب على ورقة أولاً ثم اكشفي 📝</div><button class="btn" data-rev="1">اكشفي الإجابة</button>'}
  else{h+='<button class="opt" data-k="1">✅ صح</button><button class="opt" data-k="0">❌ خطأ</button>'}
  h+='<div class="fb"></div>';c.innerHTML=h;box.appendChild(c);
  c.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(d,it,c,+b.dataset.k));
  const rv=c.querySelector('[data-rev]');if(rv)rv.onclick=()=>{rv.style.display='none';const fb=c.querySelector('.fb');fb.className='fb show good';fb.innerHTML='✅ <b>الإجابة:</b> '+ltr(it.ans)+'<br><b>لماذا؟</b> '+ltr(it.why)+'<div style="margin-top:8px"><button class="btn" data-m="1">كتبتُها صح ✅</button> <button class="btn" data-m="0">سأعيدها 🔁</button></div>';
   fb.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{if(c.dataset.done)return;c.dataset.done=1;if(b.dataset.m=='1')score++;answered++;fb.querySelector('div').innerHTML=b.dataset.m=='1'?'🌟 أحسنتِ!':'لا بأس، نعيدها لاحقاً 🌷';check(d)})}})}
function nm(it,k){return it.kind=='mcq'?(L[k]+') '+it.opts[k]):(k?'صح':'خطأ')}
function answer(d,it,c,k){if(c.dataset.done)return;const right=it.kind=='mcq'?it.ans:(it.ans?1:0);const fb=c.querySelector('.fb');const btns=c.querySelectorAll('.opt');
 if(k===right){c.dataset.done=1;btns.forEach(b=>{if(+b.dataset.k===right)b.classList.add('ok')});
  fb.className='fb show good';fb.innerHTML='🌟 أحسنتِ! <b>لماذا؟</b> '+ltr(it.why);if(!c.dataset.missed)score++;answered++;check(d)}
 else{c.dataset.missed=1;btns.forEach(b=>{if(+b.dataset.k===k)b.classList.add('bad')});
  fb.className='fb show wrong';fb.innerHTML='اخترتِ: <b>'+ltr(nm(it,k))+'</b><br>🤔 <b>اسألي نفسك:</b> '+d.ask+'<br><b>لماذا؟</b> '+ltr(it.why)+'<br>✅ <b>الصحيح:</b> '+ltr(nm(it,right))+'<br><small>جرّبي مرة ثانية وخذي وقتكِ 🌷</small>'}}
function check(d){const need=Math.ceil(d.items.length*NEED);const p=document.getElementById('prog');
 if(answered>=d.items.length){if(score>=need){setStar(d.id,1);p.innerHTML='⭐ ما شاء الله! أجبتِ '+score+' من '+d.items.length+' صح. ركّزتِ فوصلتِ 🌷';p.style.background='#ebfbee'}else{p.innerHTML='أجبتِ '+score+' من '+d.items.length+'. لا بأس، نعيد الدرس بهدوء ونحاول مرة ثانية 🌷'}nav()}
 else{p.innerHTML='أجبتِ '+answered+' من '+d.items.length+' · صحيحة من أول مرة: '+score}}
render();
</script></body></html>
