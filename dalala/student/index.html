<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>لوحة الأسئلة · لغتي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Noto+Naskh+Arabic:wght@500;700&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Tajawal','Geeza Pro','Segoe UI',Tahoma,Arial,sans-serif;font-size:18px;line-height:1.7;color:#1f2a5c;background-color:#c9a368;background-image:repeating-linear-gradient(0deg,#5b3a1233 0 1.5px,transparent 1.5px 5px),repeating-linear-gradient(90deg,#5b3a1233 0 1.5px,transparent 1.5px 5px)}
#app{max-width:820px;margin:0 auto;padding:12px 14px 40px}
h1,h2{font-family:'Lalezar','Tajawal',sans-serif;font-weight:400;margin:.2em 0}
.top{background:#2a3c86;color:#fff;border-radius:0 0 22px 22px;padding:10px 14px;display:table;width:100%;box-shadow:0 5px 0 #1b2a63}
.top .t{display:table-cell;vertical-align:middle}.top .m{display:table-cell;vertical-align:middle;text-align:left;width:60px}
.top h1{font-size:1.5rem;margin:0}.top small{opacity:.95;font-weight:700}
.snd{border:0;background:#fff;border-radius:50%;width:44px;height:44px;font-size:1.3rem;cursor:pointer}
.card{background:#fff;border-radius:24px;padding:16px;margin:14px 0;box-shadow:0 7px 0 #1b2a63;border:4px dashed #c9a368}
.dots{text-align:center;margin:6px 0 2px}.dots i{display:inline-block;width:14px;height:14px;border-radius:50%;background:#e3dccb;margin:0 3px;border:2px solid #1f2a5c}.dots i.on{background:#34c25a}.dots i.no{background:#ff6b4a}.dots i.cur{background:#4f8fd6}
.q{font-family:'Noto Naskh Arabic','Tajawal',serif;font-weight:700;font-size:1.45rem;line-height:2.1;text-align:center;margin:8px 0 12px}
.pic{display:block;margin:0 auto 6px;width:180px;height:180px;object-fit:contain}
.opts{display:block}
.opt{display:block;width:100%;text-align:right;font-family:'Noto Naskh Arabic','Tajawal',serif;font-weight:700;font-size:1.25rem;line-height:1.8;color:#1f2a5c;background:#fff6df;border:4px solid #1f2a5c;border-radius:18px;padding:10px 16px;margin:10px 0;min-height:58px;cursor:pointer;box-shadow:0 5px 0 #1f2a5c}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #1f2a5c}
.opt.ok{background:#bff0cc;border-color:#1f9d4a}.opt.no{background:#ffd0c6;border-color:#e0483a}.opt.dim{opacity:.45}
.fb{margin-top:10px;padding:10px 14px;border-radius:16px;background:#fff6d6;border:3px dashed #1f2a5c;font-weight:700}
.btn{display:inline-block;font:800 1.15rem 'Tajawal',sans-serif;color:#fff;background:#4f8fd6;border:0;border-radius:99px;padding:12px 28px;min-height:50px;cursor:pointer;box-shadow:0 5px 0 #1b2a63;margin:6px}
.center{text-align:center}.big{font-family:'Lalezar',sans-serif;font-size:2.6rem;line-height:1.3}
.stars{font-size:2.4rem}
.shake{animation:shk .35s}@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pp .35s}@keyframes pp{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
select,input.nm{font:700 1.1rem 'Tajawal',sans-serif;border:3px solid #1f2a5c;border-radius:14px;padding:10px 12px;width:100%;margin:6px 0;background:#fff;color:#1f2a5c}
.sent{font-size:.9rem;opacity:.8}
@media (max-width:480px){body{font-size:16px}.q{font-size:1.25rem}.opt{font-size:1.1rem}}
</style></head><body><div id="app"></div><noscript>يلزم تشغيل جافاسكربت لفتح الأسئلة.</noscript>
<script>
var DATA=[{"q":"مَا مَعْنَى كَلِمَةِ «دَنَا»؟","o":["ابْتَعَدَ","اقْتَرَبَ","نَامَ","رَكَضَ"],"a":1,"w":"دَنَا: اقْتَرَبَ."},{"q":"مَا مَعْنَى كَلِمَةِ «يَشْمَئِزُّ»؟","o":["يَفْرَحُ وَيَضْحَكُ","يَنْفُرُ وَيَكْرَهُ","يَنَامُ كَثِيرًا","يَرْكُضُ بِسُرْعَةٍ"],"a":1,"w":"يَشْمَئِزُّ: يَنْفُرُ وَيَكْرَهُ."},{"q":"مَا مَعْنَى كَلِمَةِ «أَتَجَوَّلُ»؟","o":["أَتَنَقَّلُ مِنْ مَكَانٍ إِلَى آخَرَ","أَجْلِسُ فِي مَكَانِي","أَنَامُ مُبَكِّرًا","أَكْتُبُ الدَّرْسَ"],"a":0,"w":"أَتَجَوَّلُ: أَتَنَقَّلُ مِنْ مَكَانٍ إِلَى آخَرَ."},{"q":"مَا مَعْنَى «التَّآخِي»؟","o":["الْخِصَامُ","التَّفَاهُمُ وَالْمَحَبَّةُ","الْحُزْنُ","السَّفَرُ"],"a":1,"w":"التَّآخِي: التَّفَاهُمُ وَالْمَحَبَّةُ."},{"q":"مَا مَعْنَى «النَّضَارَةُ»؟","o":["الْحُسْنُ وَالْإِشْرَاقُ","الْجَفَافُ","التَّعَبُ","الْغُبَارُ"],"a":0,"w":"النَّضَارَةُ: الْحُسْنُ وَالْإِشْرَاقُ."},{"q":"مَا مَعْنَى «شَاحِبٌ»؟","o":["لَوْنُهُ جَمِيلٌ زَاهٍ","مُتَغَيِّرُ اللَّوْنِ ذَابِلٌ","كَبِيرُ الْحَجْمِ","سَرِيعُ الْحَرَكَةِ"],"a":1,"w":"شَاحِبٌ: مُتَغَيِّرُ اللَّوْنِ ذَابِلٌ."},{"q":"مَا مَعْنَى «إِيمَاءَةٌ»؟","o":["صَوْتٌ عَالٍ","حَرَكَةٌ وَإِشَارَةٌ","كَلَامٌ كَثِيرٌ","سُكُوتٌ طَوِيلٌ"],"a":1,"w":"إِيمَاءَةٌ: حَرَكَةٌ وَإِشَارَةٌ."},{"q":"مَا مَعْنَى «مَلَامِحُ» الْوَجْهِ؟","o":["عَلَامَاتُ الْوَجْهِ","أَلْوَانُ الْمَلَابِسِ","أَصْوَاتُ الْأَطْفَالِ","أَسْمَاءُ النَّاسِ"],"a":0,"w":"مَلَامِحُ: عَلَامَاتُ الْوَجْهِ."},{"q":"مَا مَعْنَى «اسْتِنْزَافٌ»؟","o":["اسْتِهْلَاكُ الشَّيْءِ","حِفْظُ الشَّيْءِ","بَيْعُ الشَّيْءِ","تَلْوِينُ الشَّيْءِ"],"a":0,"w":"اسْتِنْزَافٌ: اسْتِهْلَاكُ الشَّيْءِ."},{"q":"مَا مَعْنَى «التَّصَدِّي» لِلْمُشْكِلَةِ؟","o":["الْهُرُوبُ مِنْهَا","الْمُوَاجَهَةُ","نِسْيَانُهَا","الْكِتَابَةُ عَنْهَا"],"a":1,"w":"التَّصَدِّي: الْمُوَاجَهَةُ."},{"q":"مَا مَعْنَى «التَّصَحُّرُ»؟","o":["تَحَوُّلُ الْأَرَاضِي الْخَصْبَةِ إِلَى أَرَاضٍ جَرْدَاءَ","أَكْلُ السَّحُورِ فِي رَمَضَانَ","زِرَاعَةُ الْأَشْجَارِ","نُزُولُ الْمَطَرِ"],"a":0,"w":"التَّصَحُّرُ: تَحَوُّلُ الْأَرَاضِي الْخَصْبَةِ إِلَى أَرَاضٍ جَرْدَاءَ. وَلَيْسَ لَهُ عَلَاقَةٌ بِالتَّسَحُّرِ."},{"q":"مَا مَعْنَى «الْعَدْوَى»؟","o":["انْتِقَالُ الدَّاءِ مِنَ الْمَرِيضِ إِلَى السَّلِيمِ","غِذَاءٌ صِحِّيٌّ","نَوْعٌ مِنَ الْفَوَاكِهِ","مَكَانٌ لِلنَّوْمِ"],"a":0,"w":"الْعَدْوَى: انْتِقَالُ الدَّاءِ مِنَ الْمَرِيضِ إِلَى السَّلِيمِ."},{"q":"مَا مَعْنَى «الْقُمَامَةُ»؟","o":["مَا يُجْمَعُ مِنْ أَوْسَاخٍ وَمُخَلَّفَاتٍ","نَبَاتٌ جَمِيلٌ","مَاءٌ نَقِيٌّ","طَعَامٌ لَذِيذٌ"],"a":0,"w":"الْقُمَامَةُ: مَا يُجْمَعُ فِي الْبُيُوتِ وَالطُّرُقَاتِ مِنْ أَوْسَاخٍ وَمُخَلَّفَاتٍ."},{"q":"مَا مَعْنَى «يَحُكُّ»؟","o":["يَدْلُكُ وَيُحَرِّكُ","يَقْرَأُ وَيَكْتُبُ","يَأْكُلُ وَيَشْرَبُ","يَنْتَظِرُ وَيَسْكُتُ"],"a":0,"w":"يَحُكُّ: يَدْلُكُ وَيُحَرِّكُ."},{"q":"مَا مَعْنَى «يَنْعُهُ» (الثَّمَرُ)؟","o":["نَاضِجٌ، أَوْ نَضَاجَتُهُ","مُرٌّ وَيَابِسٌ","صَغِيرٌ جِدًّا","قَدِيمٌ"],"a":0,"w":"يَنْعُهُ: نَاضِجٌ، أَوْ نَضَاجَتُهُ."},{"q":"مَا ضِدُّ كَلِمَةِ «الضَّوْضَاءُ»؟","o":["الصُّرَاخُ","الْهُدُوءُ","الْغُبَارُ","الْمَطَرُ"],"a":1,"w":"ضِدُّ الضَّوْضَاءِ: الْهُدُوءُ."},{"q":"مَا ضِدُّ كَلِمَةِ «بِسُرْعَةٍ»؟","o":["بِبُطْءٍ","بِقُوَّةٍ","بِصَوْتٍ","بِجَمَالٍ"],"a":0,"w":"ضِدُّ بِسُرْعَةٍ: بِبُطْءٍ."},{"q":"مَا ضِدُّ كَلِمَةِ «سَعَادَةٌ»؟","o":["فَرَحٌ","شَقَاءٌ","نَجَاحٌ","ضَحِكٌ"],"a":1,"w":"ضِدُّ سَعَادَةٍ: شَقَاءٌ."},{"q":"مَا ضِدُّ كَلِمَةِ «انْتَهَى»؟","o":["بَدَأَ","جَلَسَ","وَصَلَ","نَامَ"],"a":0,"w":"ضِدُّ انْتَهَى: بَدَأَ."},{"q":"مَا ضِدُّ كَلِمَةِ «تَظْهَرُ»؟","o":["تَلْمَعُ","تَخْتَبِئُ","تَكْبُرُ","تَضْحَكُ"],"a":1,"w":"ضِدُّ تَظْهَرُ: تَخْتَبِئُ."},{"q":"مَا ضِدُّ كَلِمَةِ «مَحَاسِنُ»؟","o":["مَسَاوِئُ","مَنَافِعُ","مَجَالِسُ","مَدَارِسُ"],"a":0,"w":"ضِدُّ مَحَاسِنَ: مَسَاوِئُ."},{"q":"مَا مُفْرَدُ «الْحُقُولُ»؟","o":["الْحَقْلُ","الْحَقِيقَةُ","الْحَاقِلُ","الْحُقُوقُ"],"a":0,"w":"مُفْرَدُ الْحُقُولِ: الْحَقْلُ."},{"q":"مَا مُفْرَدُ «الْأَشْجَارُ»؟","o":["الشَّجَرَةُ","الْأَشْجَعُ","الشَّاجِرُ","الشِّجَارُ"],"a":0,"w":"مُفْرَدُ الْأَشْجَارِ: الشَّجَرَةُ."},{"q":"مَا مُفْرَدُ «الْآبَارُ»؟","o":["الْبِئْرُ","الْبَابُ","الْبَارِدُ","الْأَبُ"],"a":0,"w":"مُفْرَدُ الْآبَارِ: الْبِئْرُ."},{"q":"مَا مُفْرَدُ «الْأَدْوِيَةُ»؟","o":["الدَّوَاءُ","الدَّارُ","الدُّوَارُ","الدَّائِرَةُ"],"a":0,"w":"مُفْرَدُ الْأَدْوِيَةِ: الدَّوَاءُ."},{"q":"مَا مُفْرَدُ «الزُّرَّاعُ»؟","o":["الزَّارِعُ","الزِّرَاعَةُ","الْمَزْرَعَةُ","الزَّرْعُ"],"a":0,"w":"مُفْرَدُ الزُّرَّاعِ: الزَّارِعُ."},{"q":"مَا مُفْرَدُ «الْعُطُورُ»؟","o":["الْعِطْرُ","الْعَطَشُ","الْعَاطِرُ","الْعُطْلَةُ"],"a":0,"w":"مُفْرَدُ الْعُطُورِ: الْعِطْرُ."},{"q":"مَنِ الَّذِي انْطَلَقَ صَبَاحًا مَعَ حَفِيدَيْهِ؟","o":["الْأَبُ","الْجَدُّ","الْعَمُّ","الْمُعَلِّمُ"],"a":1,"w":"«انْطَلَقَ الْجَدُّ… مَعَ حَفِيدَيْهِ»."},{"q":"مَا اسْمَا الْحَفِيدَيْنِ؟","o":["سَارَةُ وَمُحَمَّدٌ","فَوَّازٌ وَنُورَةُ","خَالِدٌ وَرِيمُ","سَعْدٌ وَهِنْدٌ"],"a":1,"w":"فَوَّازٌ وَنُورَةُ."},{"q":"لِمَاذَا أَوْقَفَ الْجَدُّ السَّيَّارَةَ عَلَى جَانِبِ الطَّرِيقِ؟","o":["لِأَنَّ السَّيَّارَةَ تَعَطَّلَتْ","لِأَنَّهُ شَعَرَ بِحَاجَةِ حَفِيدَيْهِ إِلَى الرَّاحَةِ","لِيَشْتَرِيَ طَعَامًا","لِيَتَّصِلَ بِأَحَدٍ"],"a":1,"w":"بَعْدَ مَسِيرَةِ سَاعَةٍ مُتَوَاصِلَةٍ شَعَرَ بِحَاجَتِهِمَا إِلَى الرَّاحَةِ."},{"q":"مَاذَا تَحْمِي النَّبَاتَاتُ بِأَشْجَارِهَا وَغِطَائِهَا الْأَخْضَرِ؟","o":["الْأَرْضَ مِنَ التَّصَحُّرِ وَانْجِرَافِ التُّرْبَةِ","الْبُيُوتَ مِنَ الْمَطَرِ","السَّيَّارَاتِ مِنَ الْغُبَارِ","الْمَدِينَةَ مِنَ الضَّوْضَاءِ"],"a":0,"w":"«تَحْمِي الْأَرْضَ مِنَ التَّصَحُّرِ، وَانْجِرَافِ التُّرْبَةِ»."},{"q":"أَيُّ هَذِهِ الْعَوَامِلِ يُسْهِمُ فِي التَّصَحُّرِ؟","o":["كَثْرَةُ الْأَمْطَارِ","قِلَّةُ الْأَمْطَارِ","تَشْجِيرُ الْمَسَاحَاتِ","حَفْرُ الْآبَارِ"],"a":1,"w":"قِلَّةُ الْأَمْطَارِ سَبَبٌ، وَالْبَاقِي عِلَاجٌ أَوْ لَا يُسَبِّبُهُ."},{"q":"كَمْ كِيلُو مِتْرٍ مُرَبَّعٍ مِنَ الْأَرَاضِي الزِّرَاعِيَّةِ يَفْقِدُ الْعَالَمُ سَنَوِيًّا؟","o":["مِائَةً","سَبْعَمِائَةٍ","أَلْفًا","سَبْعِينَ"],"a":1,"w":"يَفْقِدُ الْعَالَمُ سَنَوِيًّا سَبْعَمِائَةِ كِيلُو مِتْرٍ مُرَبَّعٍ."},{"q":"أَيُّ هَذِهِ الْوَسَائِلِ عِلَاجٌ لِمُشْكِلَةِ التَّصَحُّرِ؟","o":["تَجْرِيفُ التُّرْبَةِ","رَمْيُ السَّجَائِرِ عَلَى الْحَشَائِشِ","اسْتِخْدَامُ الْأَحْزِمَةِ الْخَضْرَاءِ حَوْلَ الْمُدُنِ","زَحْفُ الْكُثْبَانِ الرَّمْلِيَّةِ"],"a":2,"w":"الْأَحْزِمَةُ الْخَضْرَاءُ تَصُدُّ الرِّيَاحَ عَنِ الْمُدُنِ وَالْقُرَى."},{"q":"مَا الْعَلَاقَةُ بَيْنَ «التَّصَحُّرِ» وَ«التَّسَحُّرِ»؟","o":["كِلَاهُمَا مِنْ أَسْبَابِ الْمَطَرِ","لَا عَلَاقَةَ بَيْنَهُمَا، فَالتَّسَحُّرُ طَعَامُ آخِرِ اللَّيْلِ فِي رَمَضَانَ","هُمَا الشَّيْءُ نَفْسُهُ","التَّسَحُّرُ يُسَبِّبُ التَّصَحُّرَ"],"a":1,"w":"نُورَةُ سَأَلَتْ هَذَا السُّؤَالَ، وَالتَّصَحُّرُ: تَحَوُّلُ الْأَرَاضِي إِلَى مَا يُشْبِهُ الصَّحْرَاءَ."},{"q":"مِنْ أَيِّ سُورَةٍ الْآيَةُ ٩٩ الَّتِي تَدَبَّرْنَاهَا فِي الْمَدْخَلِ؟","o":["الْأَنْعَامِ","النُّورِ","الرَّحْمَنِ","الْفَاتِحَةِ"],"a":0,"w":"الْحَاشِيَةُ: سُورَةُ الْأَنْعَامِ الْآيَةُ رَقْمُ ٩٩."},{"q":"مَا النِّعْمَةُ الَّتِي لَا تَحْيَا الْكَائِنَاتُ بِدُونِهَا؟","o":["الذَّهَبُ","الْمِلْحُ","الْعَصِيرُ","الْمَاءُ"],"a":3,"w":"أَنْزَلَ اللهُ مِنَ السَّمَاءِ مَاءً فَخَرَجَ بِهِ النَّبَاتُ."},{"q":"مَا مَعْنَى «يَنْعِهِ»؟","o":["لَوْنِهِ","نُضْجِهِ","رَائِحَتِهِ","حَجْمِهِ"],"a":1,"w":"«يَنْعِهِ» أَيْ: نُضْجِهِ."},{"q":"مَا مَعْنَى «خَضِرًا»؟","o":["مَاءً عَذْبًا","حَجَرًا صُلْبًا","زَرْعًا وَشَجَرًا أَخْضَرَ","تُرَابًا نَاعِمًا"],"a":2,"w":"«خَضِرًا» أَيْ: زَرْعًا وَشَجَرًا أَخْضَرَ."},{"q":"«قِنْوَانٌ» جَمْعُ:","o":["قَنَاةٍ","قِنَاعٍ","قِنْوٍ","قَانُونٍ"],"a":2,"w":"قِنْوَانٌ جَمْعُ قِنْوٍ، وَهُوَ عِذْقُ النَّخْلَةِ الْمُحْتَوِي عَلَى التَّمْرِ."},{"q":"«مُتَرَاكِبًا» تَعْنِي:","o":["مُتَفَرِّقًا","صَغِيرًا","مُرًّا","بَعْضُهُ فَوْقَ بَعْضٍ"],"a":3,"w":"مِثْلُ سَنَابِلِ الْقَمْحِ وَالشَّعِيرِ."},{"q":"«مُشْتَبِهًا وَغَيْرَ مُتَشَابِهٍ» أَيْ:","o":["تَتَشَابَهُ فِي وَرَقِهِ وَيَخْتَلِفُ فِي ثَمَرِهِ","يَتَشَابَهُ فِي كُلِّ شَيْءٍ","يَخْتَلِفُ فِي كُلِّ شَيْءٍ","لَا يُثْمِرُ"],"a":0,"w":"هَذَا شَرْحُ الْكِتَابِ لَهَا."},{"q":"«آيَاتٌ» فِي الْآيَةِ مَعْنَاهَا:","o":["حُرُوفٌ","دَلَالَاتٌ عَلَى كَمَالِ قُدْرَةِ اللهِ","أَوْرَاقٌ","أَرْقَامٌ"],"a":1,"w":"شَرْحُ الْكِتَابِ: دَلَالَاتٌ عَلَى كَمَالِ قُدْرَةِ اللهِ."},{"q":"مُثَنَّى «قَلَمٌ»:","o":["أَقْلَامٌ","قَلَمَانِ","قَلِيلٌ","قَلَمَاتٌ"],"a":1,"w":"قَلَمٌ ← قَلَمَانِ ← أَقْلَامٌ."},{"q":"جَمْعُ «قَلَمٍ»:","o":["قَلَمَانِ","قَلَمٌ","قَلَمَةٌ","أَقْلَامٌ"],"a":3,"w":"جَمْعُ قَلَمٍ: أَقْلَامٌ."},{"q":"مُفْرَدُ «بَابَانِ»:","o":["أَبْوَابٌ","بَابَةٌ","بَابٌ","بَيْتٌ"],"a":2,"w":"بَابَانِ تَدُلُّ عَلَى اثْنَيْنِ، وَمُفْرَدُهَا بَابٌ."},{"q":"مُفْرَدُ «أَمْرَاضٌ»:","o":["مَرَضٌ","مَرِيضٌ","مَرْضَى","أَمْرَاضَانِ"],"a":0,"w":"أَمْرَاضٌ جَمْعٌ، وَمُفْرَدُهَا مَرَضٌ."},{"q":"الِاسْمُ الَّذِي يَدُلُّ عَلَى اثْنَيْنِ يُسَمَّى:","o":["مُفْرَدًا","جَمْعًا","فِعْلًا","مُثَنًّى"],"a":3,"w":"الْمُثَنَّى يَدُلُّ عَلَى اثْنَيْنِ."},{"q":"الِاسْمُ الَّذِي يَدُلُّ عَلَى ثَلَاثَةٍ فَأَكْثَرَ يُسَمَّى:","o":["جَمْعًا","مُفْرَدًا","مُثَنًّى","حَرْفًا"],"a":0,"w":"الْجَمْعُ يَدُلُّ عَلَى ثَلَاثَةٍ فَأَكْثَرَ."},{"q":"أَيُّ الْكَلِمَاتِ الْآتِيَةِ مُثَنًّى؟","o":["أَمْرَاضٌ","بَابَانِ","زَهْرَةٌ","أَقْلَامٌ"],"a":1,"w":"بَابَانِ تَدُلُّ عَلَى اثْنَيْنِ."},{"q":"النَّادِلُ فِي الْحِوَارِ هُوَ:","o":["عَامِلُ النَّظَافَةِ","الْمُحَاسِبُ","مُقَدِّمُ الطَّعَامِ","صَاحِبُ الْمَطْعَمِ"],"a":2,"w":"النَّادِلُ مَنْ يُقَدِّمُ الطَّعَامَ فِي الْمَطْعَمِ."},{"q":"مَنْ رَبَّى مَاجِدًا عَلَى حِفْظِ النِّعْمَةِ؟","o":["مُعَلِّمُهُ","أُخْتُهُ","صَدِيقُهُ","أَبُوهُ"],"a":3,"w":"رَبَّاهُ أَبُوهُ عَلَى ذَلِكَ."},{"q":"لِمَاذَا يَأْخُذُ مَاجِدٌ الطَّعَامَ النَّظِيفَ بَعْدَ الْوَجْبَةِ؟","o":["لِيَتَصَدَّقَ بِهِ عَلَى مَنْ يَحْتَاجُهُ","لِيَبِيعَهُ","لِيَرْمِيَهُ","لِيَأْكُلَهُ وَحْدَهُ"],"a":0,"w":"هَذَا مِنْ شُكْرِ اللهِ عَلَى نِعَمِهِ."},{"q":"مَا مَصِيرُ بَقَايَا الطَّعَامِ عِنْدَ مَاجِدٍ؟","o":["تُحْرَقُ","تُوضَعُ فِي مَكَانٍ مُنَاسِبٍ لِتَأْكُلَهَا الْبَهَائِمُ","تُدْفَنُ","تُرْمَى فِي النَّهْرِ"],"a":1,"w":"نَصُّ الْحِوَارِ فِي ص٢٦."},{"q":"مَا الَّذِي يُحَقِّقُهُ مَاجِدٌ بِتَصَرُّفِهِ كَمَا قَالَ فِي الْحِوَارِ؟","o":["الْفَوْزُ بِجَائِزَةٍ","تَوْفِيرُ الْمَالِ فَقَطْ","شُكْرُ اللهِ عَلَى نِعَمِهِ وَالْحِفَاظُ عَلَى نَظَافَةِ الْبِيئَةِ","إِرْضَاءُ النَّادِلِ"],"a":2,"w":"قَالَ: «وَبِهَذَا نَكُونُ قَدْ شَكَرْنَا اللهَ عَلَى نِعَمِهِ، وَحَافَظْنَا عَلَى نَظَافَةِ بِيئَتِنَا»."},{"q":"الْكَلِمَةُ الْمُخْتَلِفَةُ: تُفَّاحَةٌ، كُمَّثْرَى، خُبْزٌ، تِينٌ:","o":["تُفَّاحَةٌ","خُبْزٌ","كُمَّثْرَى","تِينٌ"],"a":1,"w":"الْبَاقِي فَوَاكِهُ."},{"q":"الْكَلِمَةُ الْمُخْتَلِفَةُ: مُبِيدَاتٌ، عَوَادِمُ السَّيَّارَاتِ، نَبَاتَاتٌ، نُفَايَاتٌ:","o":["مُبِيدَاتٌ","نُفَايَاتٌ","عَوَادِمُ السَّيَّارَاتِ","نَبَاتَاتٌ"],"a":3,"w":"الْبَاقِي مُلَوِّثَاتٌ لِلْبِيئَةِ."},{"q":"الْكَلِمَةُ الْمُخْتَلِفَةُ: مَشْرُوبَاتٌ غَازِيَّةٌ، عَصِيرٌ طَازَجٌ، خَضْرَاوَاتٌ، سَمَكٌ:","o":["عَصِيرٌ طَازَجٌ","خَضْرَاوَاتٌ","مَشْرُوبَاتٌ غَازِيَّةٌ","سَمَكٌ"],"a":2,"w":"الْبَاقِي أَغْذِيَةٌ صِحِّيَّةٌ."},{"q":"أَوَّلُ جُمْلَةٍ فِي تَرْتِيبِ فِقْرَةِ «بُسْتَانِ الْعَمِّ» هِيَ:","o":["ذَهَبْتُ مَعَ أَبِي فِي فَصْلِ الْخَرِيفِ لِمُشَاهَدَةِ بُسْتَانِ عَمِّي","فَقَالَ: إِنَّهَا شَجَرَةُ التِّينِ","لَيْسَ لَهَا أَوْرَاقٌ","فَسَأَلْتُ أَبِي عَنْهَا"],"a":0,"w":"الْقِصَّةُ تَبْدَأُ بِالذَّهَابِ مَعَ الْأَبِ."},{"q":"فِي فِقْرَةِ الْبُسْتَانِ، مَا اسْمُ الشَّجَرَةِ الَّتِي لَيْسَ لَهَا أَوْرَاقٌ؟","o":["شَجَرَةُ الزَّيْتُونِ","شَجَرَةُ التِّينِ","شَجَرَةُ النَّخْلِ","شَجَرَةُ الرُّمَّانِ"],"a":1,"w":"فَقَالَ: إِنَّهَا شَجَرَةُ التِّينِ."},{"q":"كَمْ لَوْحَةً فِي مَشْرُوعِ الْوَحْدَةِ؟","o":["ثَلَاثٌ","خَمْسٌ","أَرْبَعٌ","اثْنَتَانِ"],"a":2,"w":"اللَّوْحَاتُ الْأُولَى وَالثَّانِيَةُ وَالثَّالِثَةُ وَالرَّابِعَةُ."},{"q":"اللَّوْحَةُ الرَّابِعَةُ فِي الْمَشْرُوعِ عَنْ:","o":["بِيئَةٍ وَطَنِيَّةٍ","بِيئَةِ صَفِّي","بِيئَةٍ مَنْزِلِيَّةٍ","بِيئَةٍ مَدْرَسِيَّةٍ"],"a":0,"w":"الرَّابِعَةُ عَنْ بِيئَةٍ وَطَنِيَّةٍ."},{"q":"مَاذَا يَفْعَلُ قَائِدُ الْمَجْمُوعَةِ بِالْأَفْكَارِ؟","o":["يُمَزِّقُهَا","يَحْتَفِظُ بِهَا لِنَفْسِهِ","يَجْمَعُهَا وَيَفْرِزُهَا وَيَسْتَبْعِدُ الْمُكَرَّرَ وَيُرَتِّبُ الْمُتَبَقِّيَ","يُنَفِّذُ أَوَّلَهَا فَقَطْ"],"a":2,"w":"نَصُّ الْمَشْرُوعِ فِي ص٣٠."},{"q":"مَا مَعْنَى أَنْ يُقِرَّ الطَّالِبُ فِي الْمُعَاهَدَةِ أَنْ يَكُونَ «صَدِيقًا وَفِيًّا لِلْبِيئَةِ»؟","o":["يَبْتَعِدُ عَنْهَا","يُقَدِّرُ ثَرَوَاتِهَا وَيَعْتَنِي بِمُمْتَلَكَاتِهَا دَاخِلَ الْمَدْرَسَةِ وَخَارِجَهَا","يَسْتَخْدِمُهَا وَقْتَمَا شَاءَ","يَتْرُكُهَا لِلْآخَرِينَ"],"a":1,"w":"نَصُّ الْمُعَاهَدَةِ فِي ص٣١."},{"q":"أَيُّ الْهَمْزَتَيْنِ تُنْطَقُ فِي أَوَّلِ الْكَلَامِ وَفِي وَسَطِهِ؟","o":["هَمْزَةُ الْوَصْلِ","كِلْتَاهُمَا","هَمْزَةُ الْقَطْعِ","لَا وَاحِدَةَ مِنْهُمَا"],"a":2,"w":"هَمْزَةُ الْقَطْعِ تُنْطَقُ فِي أَوَّلِ الْكَلَامِ وَفِي وَسَطِهِ."},{"q":"تُرْسَمُ هَمْزَةُ الْوَصْلِ:","o":["أَلِفًا فَوْقَهَا هَمْزَةٌ","أَلِفًا تَحْتَهَا هَمْزَةٌ","يَاءً","أَلِفًا بِلَا هَمْزَةٍ"],"a":3,"w":"هَمْزَةُ الْوَصْلِ أَلِفٌ بِلَا هَمْزَةٍ (ا)."},{"q":"تُكْتَبُ هَمْزَةُ الْقَطْعِ الْمَكْسُورَةُ:","o":["إ","ا","أ","ئ"],"a":0,"w":"الْمَكْسُورَةُ تُكْتَبُ (إِ) أَيْ أَلِفًا تَحْتَهَا هَمْزَةٌ."},{"q":"أَيُّ الْكَلِمَاتِ الْآتِيَةِ فِيهَا هَمْزَةُ قَطْعٍ؟","o":["الْكِتَابُ","إِلَى","اِنْطَلَقَ","اِسْمٌ"],"a":1,"w":"إِلَى حَرْفٌ هَمْزَتُهُ قَطْعٌ. وَالْبَاقِي هَمْزَتُهُ وَصْلٌ."},{"q":"أَيُّ الْكَلِمَاتِ الْآتِيَةِ فِيهَا هَمْزَةُ وَصْلٍ؟","o":["أَحْسَنْتَ","أَنَّ","أَسْرَعَ","اِبْتَسَمَ"],"a":3,"w":"نَقُولُ: وَابْتَسَمَ، فَتَخْتَفِي الْهَمْزَةُ."},{"q":"عِنْدَمَا أُدْخِلُ الْوَاوَ عَلَى كَلِمَةٍ وَتَظْهَرُ هَمْزَتُهَا فِي النُّطْقِ فَهِيَ:","o":["وَصْلٌ","لَا هَمْزَةَ فِيهَا","قَطْعٌ","مُتَطَرِّفَةٌ"],"a":2,"w":"ظُهُورُ الْهَمْزَةِ بَعْدَ الْوَاوِ عَلَامَةُ هَمْزَةِ الْقَطْعِ."},{"q":"هَمْزَةُ (الْ) التَّعْرِيفِ فِي «الْعَرَقُ» هِيَ:","o":["وَصْلٌ","قَطْعٌ","مُتَطَرِّفَةٌ","لَا هَمْزَةَ فِيهَا"],"a":0,"w":"هَمْزَةُ الْوَصْلِ تُوجَدُ فِي (الْ) التَّعْرِيفِ."},{"q":"الْهَمْزَةُ فِي أَوَّلِ الْكَلِمَةِ كَمْ نَوْعًا؟","o":["نَوْعٌ وَاحِدٌ","نَوْعَانِ","ثَلَاثَةُ أَنْوَاعٍ","أَرْبَعَةُ أَنْوَاعٍ"],"a":1,"w":"نَوْعَانِ: هَمْزَةُ وَصْلٍ وَهَمْزَةُ قَطْعٍ."},{"q":"أَقُولُ «وَاصْطَحَبَ». مَاذَا حَدَثَ لِهَمْزَةِ «اِصْطَحَبَ» ؟","o":["ظَهَرَتْ، فَهِيَ قَطْعٌ","اخْتَفَتْ، فَهِيَ قَطْعٌ","اخْتَفَتْ، فَهِيَ وَصْلٌ","ظَهَرَتْ، فَهِيَ وَصْلٌ"],"a":2,"w":"إِذَا اخْتَفَتِ الْهَمْزَةُ فِي النُّطْقِ فَهِيَ وَصْلٌ."},{"q":"أَقُولُ «وَأَخَذَ». مَاذَا حَدَثَ لِلْهَمْزَةِ؟","o":["اخْتَفَتْ","ظَهَرَتْ","صَارَتْ وَصْلًا","تَحَوَّلَتْ إِلَى يَاءٍ"],"a":1,"w":"هَمْزَةُ أَخَذَ تَظْهَرُ، فَهِيَ قَطْعٌ."},{"q":"أَيُّ الْكَلِمَاتِ الْآتِيَةِ هَمْزَتُهَا وَصْلٌ؟","o":["اِنْطَلَقَ","أُكْرِمُ","أَنَا","أُخْتٌ"],"a":0,"w":"اِنْطَلَقَ فِعْلٌ خُمَاسِيٌّ، وَهَمْزَتُهُ وَصْلٌ. وَالْبَاقِي هَمْزَتُهُ قَطْعٌ."},{"q":"الْمَاضِي مِنَ الْفِعْلِ «يَنْتَظِرُ» هُوَ «اِنْتَظَرَ». مَا نَوْعُ هَمْزَتِهِ؟","o":["قَطْعٌ","مُتَطَرِّفَةٌ","لَا هَمْزَةَ فِيهَا","وَصْلٌ"],"a":3,"w":"اِنْتَظَرَ خَمْسَةُ حُرُوفٍ، وَهَمْزَتُهُ وَصْلٌ."},{"q":"الْمَاضِي مِنَ الْفِعْلِ «يَأْخُذُ» هُوَ «أَخَذَ». كَمْ عَدَدُ حُرُوفِهِ؟","o":["اثْنَانِ","أَرْبَعَةٌ","ثَلَاثَةٌ","خَمْسَةٌ"],"a":2,"w":"أَخَذَ ثَلَاثَةُ حُرُوفٍ، وَهَمْزَتُهُ قَطْعٌ."},{"q":"الْمَاضِي مِنَ الْفِعْلِ «يَسْتَذْكِرُ» هُوَ «اِسْتَذْكَرَ». كَمْ عَدَدُ حُرُوفِهِ؟","o":["أَرْبَعَةٌ","خَمْسَةٌ","ثَلَاثَةٌ","سِتَّةٌ"],"a":3,"w":"اِسْتَذْكَرَ سِتَّةُ حُرُوفٍ، وَهَمْزَتُهُ وَصْلٌ."},{"q":"الْمَاضِي مِنَ الْفِعْلِ «يُعْطِي» هُوَ «أَعْطَى». مَا نَوْعُ هَمْزَتِهِ؟","o":["قَطْعٌ","وَصْلٌ","مُتَطَرِّفَةٌ","لَا هَمْزَةَ فِيهَا"],"a":0,"w":"أَعْطَى أَرْبَعَةُ حُرُوفٍ، وَهَمْزَتُهُ قَطْعٌ."},{"q":"أَيُّ الْحُرُوفِ الْآتِيَةِ هَمْزَتُهُ وَصْلٌ؟","o":["إِنَّ","الْ","أَلَا","أَمْ"],"a":1,"w":"(الْ) التَّعْرِيفِ هِيَ الْحَرْفُ الْوَحِيدُ الَّذِي هَمْزَتُهُ وَصْلٌ."},{"q":"كَيْفَ أَكْتُبُ الْهَمْزَةَ فِي «أُخْتٌ» ؟","o":["ا","أُ","إِ","ء"],"a":1,"w":"مَضْمُومَةٌ قَطْعٌ فَتُكْتَبُ (أُ)."},{"q":"أَيُّ الْمَجْمُوعَاتِ الْآتِيَةِ كُلُّهَا هَمْزَةُ وَصْلٍ؟","o":["أَسْرَعَ، اِبْتَسَمَ، أَلَا","إِلَى، اِنْطَلَقَ، الْعَرَقُ","اِنْطَلَقَ، اِبْتَسَمَ، اِسْتَقْبَلَ","أَنْ، الْجَدُّ، اِسْمٌ"],"a":2,"w":"الْكَلِمَاتُ الثَّلَاثُ تَخْتَفِي هَمْزَتُهَا بَعْدَ الْوَاوِ."},{"q":"أَيُّ الْمَجْمُوعَاتِ الْآتِيَةِ كُلُّهَا هَمْزَةُ قَطْعٍ؟","o":["إِلَى، الْجَدُّ، أَنْ","أَلَا، اِبْتَسَمَ، أَنْ","أَنْ، السَّحَابُ، أَسْرَعَ","إِلَى، أَلَا، أَنْ"],"a":3,"w":"الْكَلِمَاتُ الثَّلَاثُ تَظْهَرُ هَمْزَتُهَا بَعْدَ الْوَاوِ."},{"q":"أَيُّ الْأَسْمَاءِ الْآتِيَةِ هَمْزَتُهُ وَصْلٌ؟","o":["اِبْنٌ","آدَمُ","أَحْمَدُ","إِبْرَاهِيمُ"],"a":0,"w":"اِبْنٌ مِنَ الْأَسْمَاءِ الَّتِي هَمْزَتُهَا وَصْلٌ. وَالْبَاقِي هَمْزَتُهَا قَطْعٌ."},{"q":"أَيُّ الْكَلِمَاتِ الْآتِيَةِ هَمْزَتُهَا قَطْعٌ؟","o":["اُكْتُبْ","أَكْتُبُ","اِفْتَحْ","اِنْطَلَقَ"],"a":1,"w":"الْفِعْلُ الْمُضَارِعُ الْمَبْدُوءُ بِهَمْزَةٍ هَمْزَتُهُ قَطْعٌ. أَمَّا اُكْتُبْ فَهُوَ أَمْرٌ ثُلَاثِيٌّ هَمْزَتُهُ وَصْلٌ."},{"q":"أَيُّ الْأَفْعَالِ الْآتِيَةِ هَمْزَتُهُ قَطْعٌ؟","o":["أَرْسَلَ","اِسْتَخْرَجَ","اِفْتَحْ","اِنْطَلَقَ"],"a":0,"w":"أَرْسَلَ فِعْلٌ رُبَاعِيٌّ، وَهَمْزَتُهُ قَطْعٌ."},{"q":"مَاذَا تَتَّفِقُ فِيهِ الْهَمْزَتَانِ؟","o":["فِي شَكْلِ الْكِتَابَةِ","فِي النُّطْقِ عِنْدَ الْوَصْلِ","فِي أَنَّهُمَا دَائِمًا فِي أَوَّلِ الْكَلِمَةِ","فِي أَنَّهُمَا فِي آخِرِ الْكَلِمَةِ"],"a":2,"w":"تَتَّفِقَانِ فِي أَنَّهُمَا تَكُونَانِ دَائِمًا فِي أَوَّلِ الْكَلِمَةِ."},{"q":"كَيْفَ أَكْتُبُ الْهَمْزَةَ فِي «أَنَّ» (حَرْفٌ)؟","o":["ا","إِ","ء","أَ"],"a":3,"w":"هَمْزَةُ قَطْعٍ مَفْتُوحَةٌ، فَتُكْتَبُ (أَ)."},{"q":"فِي جُمْلَةِ «اِنْطَلَقَ الْجَدُّ»، كَيْفَ أُمَيِّزُ نَوْعَ هَمْزَةِ «اِنْطَلَقَ» ؟","o":["أَعُدُّ حُرُوفَ الْجُمْلَةِ","أَنْظُرُ إِلَى آخِرِ الْكَلِمَةِ","أَكْتُبُهَا بِالْهَمْزَةِ دَائِمًا","أُدْخِلُ الْوَاوَ وَأُلَاحِظُ: هَلْ تَظْهَرُ الْهَمْزَةُ؟"],"a":3,"w":"نَقُولُ: وَانْطَلَقَ، فَتَخْتَفِي الْهَمْزَةُ، فَهِيَ وَصْلٌ."},{"q":"مَا مَوْقِعُ الْهَمْزَةِ الْمُتَطَرِّفَةِ فِي الْكَلِمَةِ؟","o":["آخِرُهَا","أَوَّلُهَا","وَسَطُهَا","لَا مَوْقِعَ لَهَا"],"a":0,"w":"سُمِّيَتْ مُتَطَرِّفَةً لِأَنَّهَا فِي طَرَفِ الْكَلِمَةِ أَيْ نِهَايَتِهَا."},{"q":"تُكْتَبُ الْهَمْزَةُ الْمُتَطَرِّفَةُ عَلَى الْأَلِفِ إِذَا كَانَ الْحَرْفُ قَبْلَهَا:","o":["مَضْمُومًا","مَكْسُورًا","مَفْتُوحًا","سَاكِنًا"],"a":2,"w":"الْفَتْحَةُ يُنَاسِبُهَا الْأَلِفُ."},{"q":"تُكْتَبُ الْهَمْزَةُ الْمُتَطَرِّفَةُ عَلَى الْوَاوِ إِذَا كَانَ الْحَرْفُ قَبْلَهَا:","o":["مَفْتُوحًا","مَضْمُومًا","مَكْسُورًا","سَاكِنًا"],"a":1,"w":"الضَّمَّةُ يُنَاسِبُهَا الْوَاوُ."},{"q":"تُكْتَبُ الْهَمْزَةُ الْمُتَطَرِّفَةُ عَلَى الْيَاءِ إِذَا كَانَ الْحَرْفُ قَبْلَهَا:","o":["مَفْتُوحًا","مَضْمُومًا","سَاكِنًا","مَكْسُورًا"],"a":3,"w":"الْكَسْرَةُ يُنَاسِبُهَا الْيَاءُ."},{"q":"تُكْتَبُ الْهَمْزَةُ الْمُتَطَرِّفَةُ عَلَى السَّطْرِ إِذَا كَانَ الْحَرْفُ قَبْلَهَا:","o":["مَفْتُوحًا","مَضْمُومًا","مَكْسُورًا","سَاكِنًا"],"a":3,"w":"السُّكُونُ لَيْسَ لَهُ حَرْفٌ يُنَاسِبُهُ."},{"q":"«مَبْدَأٌ» تُكْتَبُ هَمْزَتُهَا عَلَى:","o":["الْأَلِفِ","الْوَاوِ","الْيَاءِ","السَّطْرِ"],"a":0,"w":"الدَّالُ مَفْتُوحَةٌ."},{"q":"«سَمَاءٌ» تُكْتَبُ هَمْزَتُهَا عَلَى:","o":["الْأَلِفِ","السَّطْرِ","الْوَاوِ","الْيَاءِ"],"a":1,"w":"قَبْلَ الْهَمْزَةِ أَلِفٌ سَاكِنَةٌ."},{"q":"هَدَفُ الدَّرْسِ هُوَ رَسْمُ الْكَلِمَاتِ الَّتِي تَنْتَهِي بِـ:","o":["هَمْزَةِ وَصْلٍ","تَاءٍ مَرْبُوطَةٍ","هَمْزَةٍ","أَلِفٍ لَيِّنَةٍ"],"a":2,"w":"هَدَفُ الدَّرْسِ رَسْمُ الْكَلِمَاتِ الَّتِي تَنْتَهِي بِهَمْزَةٍ رَسْمًا صَحِيحًا."},{"q":"«شَاطِئٌ» تُكْتَبُ هَمْزَتُهَا عَلَى:","o":["الْيَاءِ","الْأَلِفِ","الْوَاوِ","السَّطْرِ"],"a":0,"w":"الطَّاءُ مَكْسُورَةٌ."},{"q":"«لُؤْلُؤٌ» تُكْتَبُ هَمْزَتُهَا الْأَخِيرَةُ عَلَى:","o":["الْأَلِفِ","الْوَاوِ","الْيَاءِ","السَّطْرِ"],"a":1,"w":"اللَّامُ مَضْمُومَةٌ."},{"q":"«دِفْءٌ» تُكْتَبُ هَمْزَتُهَا عَلَى السَّطْرِ لِأَنَّ الْحَرْفَ قَبْلَهَا:","o":["مَفْتُوحٌ","مَضْمُومٌ","مَكْسُورٌ","سَاكِنٌ"],"a":3,"w":"الْفَاءُ سَاكِنَةٌ."},{"q":"«يَجْرُؤُ» تُكْتَبُ هَمْزَتُهَا عَلَى الْوَاوِ لِأَنَّ الرَّاءَ:","o":["مَفْتُوحَةٌ","مَكْسُورَةٌ","مَضْمُومَةٌ","سَاكِنَةٌ"],"a":2,"w":"الرَّاءُ مَضْمُومَةٌ وَالضَّمَّةُ يُنَاسِبُهَا الْوَاوُ."},{"q":"«يَلْتَجِئُ» تُكْتَبُ هَمْزَتُهَا عَلَى الْيَاءِ لِأَنَّ الْجِيمَ:","o":["مَفْتُوحَةٌ","مَضْمُومَةٌ","مَكْسُورَةٌ","سَاكِنَةٌ"],"a":2,"w":"الْجِيمُ مَكْسُورَةٌ وَالْكَسْرَةُ يُنَاسِبُهَا الْيَاءُ."},{"q":"أَيُّ كَلِمَةٍ كُتِبَتْ هَمْزَتُهَا عَلَى الْأَلِفِ؟","o":["لُؤْلُؤٌ","هَانِئٌ","ضَوْءٌ","سَبَأٌ"],"a":3,"w":"الْبَاءُ فِي سَبَأٌ مَفْتُوحَةٌ."},{"q":"أَيُّ كَلِمَةٍ كُتِبَتْ هَمْزَتُهَا عَلَى الْوَاوِ؟","o":["سَبَأٌ","بُؤْبُؤٌ","هُدُوءٌ","دِفْءٌ"],"a":1,"w":"الْبَاءُ فِي بُؤْبُؤٌ مَضْمُومَةٌ. أَمَّا هُدُوءٌ فَقَبْلَ الْهَمْزَةِ وَاوٌ سَاكِنَةٌ."},{"q":"أَيُّ كَلِمَةٍ كُتِبَتْ هَمْزَتُهَا عَلَى الْيَاءِ؟","o":["مُفَاجِئٌ","مَاءٌ","مَسَاءٌ","ضَوْءٌ"],"a":0,"w":"الْجِيمُ فِي مُفَاجِئٌ مَكْسُورَةٌ."},{"q":"أَيُّ الْكَلِمَاتِ الْآتِيَةِ تُكْتَبُ هَمْزَتُهَا عَلَى السَّطْرِ؟","o":["صَدَأٌ","غِذَاءٌ","امْرُؤٌ","ظَامِئٌ"],"a":1,"w":"قَبْلَ الْهَمْزَةِ أَلِفٌ سَاكِنَةٌ (مَدٌّ)."},{"q":"أَيُّ الْكِتَابَاتِ الْآتِيَةِ صَحِيحَةٌ؟","o":["يُخْطِيءُ","يُخْطِأُ","يُخْطِؤُ","يُخْطِئُ"],"a":3,"w":"الصَّحِيحُ: يُخْطِئُ بِيَاءٍ وَاحِدَةٍ."},{"q":"كَيْفَ أَعْرِفُ عَلَى أَيِّ حَرْفٍ أَكْتُبُ الْهَمْزَةَ الْمُتَطَرِّفَةَ؟","o":["أَنْظُرُ إِلَى حَرَكَةِ الْهَمْزَةِ نَفْسِهَا","أَنْظُرُ إِلَى أَوَّلِ الْكَلِمَةِ","أَنْظُرُ إِلَى حَرَكَةِ الْحَرْفِ الَّذِي قَبْلَهَا","أَكْتُبُهَا عَلَى الْأَلِفِ دَائِمًا"],"a":2,"w":"نَنْظُرُ إِلَى حَرَكَةِ الْحَرْفِ قَبْلَهَا فَقَطْ، وَلَا نَنْظُرُ إِلَى حَرَكَةِ الْهَمْزَةِ نَفْسِهَا."},{"q":"«جَرِيءٌ» : قَبْلَ الْهَمْزَةِ يَاءٌ سَاكِنَةٌ (مَدٌّ). عَلَى أَيِّ شَيْءٍ تُكْتَبُ الْهَمْزَةُ؟","o":["السَّطْرِ","الْأَلِفِ","الْوَاوِ","الْيَاءِ"],"a":0,"w":"الْمَدُّ بِالْيَاءِ سَاكِنٌ، فَتُكْتَبُ الْهَمْزَةُ بَعْدَهُ عَلَى السَّطْرِ."},{"q":"أَيُّ مَجْمُوعَةٍ كُلُّ كَلِمَاتِهَا هَمْزَتُهَا عَلَى السَّطْرِ؟","o":["مَاءٌ، لُؤْلُؤٌ، شَاطِئٌ","سَبَأٌ، دِفْءٌ، مَاءٌ","ضَوْءٌ، هَانِئٌ، مَسَاءٌ","مَاءٌ، سَمَاءٌ، هُدُوءٌ"],"a":3,"w":"قَبْلَ الْهَمْزَةِ فِي الْكَلِمَاتِ الثَّلَاثِ مَدٌّ سَاكِنٌ."},{"q":"أَيُّ مَجْمُوعَةٍ سُبِقَتْ هَمْزَاتُهَا بِالْكَسْرِ؟","o":["شَاطِئٌ، مُفَاجِئٌ، هَانِئٌ","لُؤْلُؤٌ، امْرُؤٌ، بُؤْبُؤٌ","سَبَأٌ، مَبْدَأٌ، صَدَأٌ","مَاءٌ، سَمَاءٌ، ضَوْءٌ"],"a":0,"w":"الْحَرْفُ قَبْلَ الْهَمْزَةِ فِي الْكَلِمَاتِ الثَّلَاثِ مَكْسُورٌ، فَتُكْتَبُ عَلَى الْيَاءِ."},{"q":"أَيُّ مَجْمُوعَةٍ سُبِقَتْ هَمْزَاتُهَا بِالضَّمِّ؟","o":["شَاطِئٌ، هَانِئٌ، ظَامِئٌ","لُؤْلُؤٌ، امْرُؤٌ، بُؤْبُؤ ","خَبَرٌ مَرْفُوعٌ وَعَلَامَةُ رَفْعِهِ الضَّمَّةُ الظَّاهِرَةُ عَلَى آخِرِهِ","فِعْلٌ مَاضٍ"],"a":2,"w":"نَشِيطٌ خَبَرٌ، وَالخَبَرُ مَرْفُوعٌ بِالضَّمَّةِ."},{"q":"فِي إِعْرَابِ: البِيئَةُ ثَرْوَةٌ، (البِيئَةُ) تُعْرَبُ:","o":["مُبْتَدَأً مَرْفُوعًا وَعَلَامَةُ رَفْعِهِ الضَّمَّةُ الظَّاهِرَةُ عَلَى آخِرِهِ","خَبَرًا مَرْفُوعًا","مُبْتَدَأً مَنْصُوبًا","خَبَرًا مَجْرُورًا"],"a":0,"w":"البِيئَةُ هِيَ الاسْمُ الأَوَّلُ فَهِيَ مُبْتَدَأٌ."},{"q":"فِي: اللَّهُ غَفُورٌ، يُعْرَبُ (اللَّهُ):","o":["خَبَرًا مَرْفُوعًا","لَفْظَ الجَلَالَةِ مَنْصُوبًا","حَرْفَ جَرٍّ","لَفْظَ الجَلَالَةِ مُبْتَدَأً مَرْفُوعًا وَعَلَامَةُ رَفْعِهِ الضَّمَّةُ الظَّاهِرَةُ عَلَى آخِرِهِ"],"a":3,"w":"اللَّهُ الاسْمُ الَّذِي بَدَأَتْ بِهِ الجُمْلَةُ."},{"q":"أَيُّ العِبَارَاتِ الآتِيَةِ صَحِيحَةٌ؟","o":["الخَبَرُ هُوَ الاسْمُ الَّذِي تَبْدَأُ بِهِ الجُمْلَةُ","المُبْتَدَأُ وَالخَبَرُ مَرْفُوعَانِ دَائِمًا","المُبْتَدَأُ يُخْبِرُ عَنِ الخَبَرِ","الجُمْلَةُ الاسْمِيَّةُ تَبْدَأُ بِفِعْلٍ"],"a":1,"w":"المُبْتَدَأُ وَالخَبَرُ مَرْفُوعَانِ دَائِمًا وَعَلَامَةُ رَفْعِهِمَا هُنَا الضَّمَّةُ."},{"q":"أُرَتِّبُ الإِعْرَابَ الصَّحِيحَ لِكَلِمَةٍ فِي الجُمْلَةِ الاسْمِيَّةِ:","o":["حَالَةٌ ثُمَّ مَوْقِعٌ ثُمَّ عَلَامَةٌ","عَلَامَةٌ ثُمَّ مَوْقِعٌ","مَوْقِعٌ ثُمَّ عَلَامَةٌ فَقَطْ","مَوْقِعٌ إِعْرَابِيٌّ ثُمَّ حَالَةٌ ثُمَّ عَلَامَةٌ"],"a":3,"w":"مُبْتَدَأٌ (المَوْقِعُ) ثُمَّ مَرْفُوعٌ (الحَالَةُ) ثُمَّ الضَّمَّةُ (العَلَامَةُ)."},{"q":"قَالَ طَالِبٌ: «الأَشْجَارُ مُورِقَةٌ»، فَمَنِ الخَبَرُ؟","o":["مُورِقَةٌ","الأَشْجَارُ","الاثْنَانِ مَعًا","لَا يُوجَدُ"],"a":0,"w":"مُورِقَةٌ تُتِمُّ المَعْنَى فَهِيَ الخَبَرُ."},{"q":"أَيُّ هَذِهِ الْكَلِمَاتِ حَرْفُ جَرٍّ؟","o":["كِتَابٌ","يَقْرَأُ","إِلَى","جَمِيلَةٌ"],"a":2,"w":"إِلَى مِنْ حُرُوفِ الْجَرِّ."},{"q":"حُرُوفُ الْجَرِّ تَجُرُّ ...","o":["الْفِعْلُ الْوَاقِعُ بَعْدَهَا","الْحَرْفُ الْوَاقِعُ قَبْلَهَا","الْجُمْلَةُ كُلُّهَا","الِاسْمُ الْوَاقِعُ بَعْدَهَا"],"a":3,"w":"هِيَ تَجُرُّ الِاسْمَ الْوَاقِعَ بَعْدَهَا."},{"q":"مَاذَا يُسَمَّى الِاسْمُ الَّذِي يَقَعُ بَعْدَ حَرْفِ الْجَرِّ؟","o":["الِاسْمُ الْمَجْرُورُ","الْفَاعِلُ","الْمُبْتَدَأُ","الْخَبَرُ"],"a":0,"w":"يُسَمَّى الِاسْمَ الْمَجْرُورَ."},{"q":"مَا عَلَامَةُ جَرِّ الِاسْمِ الْمَجْرُورِ بِحَرْفِ الْجَرِّ؟","o":["الضَّمَّةُ","الْكَسْرَةُ","الْفَتْحَةُ","السُّكُونُ"],"a":1,"w":"الْكَسْرَةُ."},{"q":"أَيُّ هَذِهِ الْحُرُوفِ مِنْ حُرُوفِ الْجَرِّ؟","o":["سَوْفَ","هَلْ","لَنْ","عَنْ"],"a":3,"w":"عَنْ حَرْفُ جَرٍّ."},{"q":"مَا حَرْفُ الْجَرِّ فِي «أَذْهَبُ إِلَى مَدْرَسَتِي»؟","o":["أَذْهَبُ","مَدْرَسَتِي","إِلَى","لَا يُوجَدُ"],"a":2,"w":"حَرْفُ الْجَرِّ إِلَى."},{"q":"أَيْنَ تَظْهَرُ كَسْرَةُ الِاسْمِ الْمَجْرُورِ؟","o":["فَوْقَ آخِرِهِ","تَحْتَ آخِرِهِ","فِي أَوَّلِهِ","لَا تَظْهَرُ"],"a":1,"w":"الْكَسْرَةُ الظَّاهِرَةُ تَحْتَ آخِرِهِ."},{"q":"أَيُّ مَجْمُوعَةٍ كُلُّهَا حُرُوفُ جَرٍّ؟","o":["مِنْ، سَوْفَ، عَنْ","إِلَى، يَكْتُبُ، فِي","مِنْ، إِلَى، عَنْ","عَلَى، قَلَمٌ، بِ"],"a":2,"w":"الْأُخْرَى فِيهَا أَسْمَاءٌ أَوْ أَفْعَالٌ أَوْ سَوْفَ."},{"q":"مَا الِاسْمُ الْمَجْرُورُ فِي «النَّظَافَةُ مِنَ الْإِيمَانِ»؟","o":["الْإِيمَانِ","النَّظَافَةُ","مِنَ","لَا يُوجَدُ"],"a":0,"w":"الِاسْمُ بَعْدَ «مِنْ» هُوَ الْإِيمَانِ."},{"q":"مَا حَرْفُ الْجَرِّ فِي «لَأَنْ يَغْدُوَ أَحَدُكُمْ فَيَحْتَطِبَ عَلَى ظَهْرِهِ»؟","o":["أَنْ","عَلَى","فَـ","أَحَدُكُمْ"],"a":1,"w":"حَرْفُ الْجَرِّ هُوَ «عَلَى»."},{"q":"كَيْفَ نُعْرِبُ «بِ»؟","o":["اسْمٌ مَجْرُورٌ","حَرْفُ جَرٍّ","فِعْلٌ","فَاعِلٌ"],"a":1,"w":"الْبَاءُ حَرْفُ جَرٍّ."},{"q":"كَيْفَ نُعْرِبُ «الْعَمَلِ»؟","o":["حَرْفُ جَرٍّ","فِعْلٌ","اسْمٌ مَجْرُورٌ","مُبْتَدَأٌ"],"a":2,"w":"الْعَمَلِ اسْمٌ مَجْرُورٌ بِالْبَاءِ."},{"q":"مَا عَلَامَةُ جَرِّ «سُؤَالِ» فِي «مِنْ سُؤَالِ النَّاسِ»؟","o":["الْكَسْرَةُ الظَّاهِرَةُ تَحْتَ آخِرِهِ","الضَّمَّةُ الظَّاهِرَةُ","الْفَتْحَةُ الظَّاهِرَةُ","السُّكُونُ"],"a":0,"w":"اسْمٌ مَجْرُورٌ بِـ«مِنْ» عَلَامَتُهُ الْكَسْرَةُ."},{"q":"مَا عَلَامَةُ الرَّفْعِ الْأَصْلِيَّةُ؟","o":["الْكَسْرَةُ","الْفَتْحَةُ","السُّكُونُ","الضَّمَّةُ"],"a":3,"w":"الضَّمَّةُ عَلَامَةُ الرَّفْعِ الْأَصْلِيَّةُ."},{"q":"أَيُّ حَرْفِ جَرٍّ يُنَاسِبُ «يُوصِينَا دِينُنَا ... إِتْقَانِ الْعَمَلِ»؟","o":["عَنْ","بِ","مِنْ","إِلَى"],"a":1,"w":"يُوصِينَا دِينُنَا بِإِتْقَانِ الْعَمَلِ."},{"q":"مَاذَا تَجُرُّ حُرُوفُ الْجَرِّ: أَسْمَاءً أَمْ أَفْعَالًا؟","o":["أَفْعَالًا","حُرُوفًا","جُمَلًا","أَسْمَاءً"],"a":3,"w":"الْكَلِمَاتُ الَّتِي تَجُرُّهَا حُرُوفُ الْجَرِّ أَسْمَاءٌ."},{"q":"فِي «سَلَّمْتُ عَلَى أَخِي» مَا الِاسْمُ الْمَجْرُورُ؟","o":["أَخِي","سَلَّمْتُ","عَلَى","التَّاءُ"],"a":0,"w":"جَاءَ بَعْدَ «عَلَى»."},{"q":"مَا الْإِعْرَابُ الصَّحِيحُ لِكَلِمَةِ «الْمَدْرَسَةِ» فِي «يَذْهَبُ أَحْمَدُ إِلَى الْمَدْرَسَةِ»؟","o":["فَاعِلٌ مَرْفُوعٌ بِالضَّمَّةِ","حَرْفُ جَرٍّ وَعَلَامَتُهُ الْكَسْرَةُ","اسْمٌ مَجْرُورٌ بِـ«إِلَى» وَعَلَامَةُ جَرِّهِ الْكَسْرَةُ الظَّاهِرَةُ تَحْتَ آخِرِهِ","مُبْتَدَأٌ مَرْفُوعٌ"],"a":2,"w":"هُوَ اسْمٌ مَجْرُورٌ بِـ«إِلَى»."},{"q":"أَيُّ عَلَامَةٍ تَدُلُّ عَلَى أَنَّ الْكَلِمَةَ اسْمٌ؟","o":["السِّينُ","حُرُوفُ الْجَرِّ","سَوْفَ","تَاءُ التَّأْنِيثِ السَّاكِنَةُ"],"a":1,"w":"حُرُوفُ الْجَرِّ عَلَامَةٌ لِلِاسْمِ، وَالْبَاقِي عَلَامَاتُ الْفِعْلِ."},{"q":"إِذَا أَرَدْنَا جَمْعَ «الْجَبَلِ» جَمْعَ تَكْسِيرٍ فِي «قِمَّةِ الْجَبَلِ» فَنَقُولُ:","o":["قِمَّةِ الْجَبَلَيْنِ","قِمَّةِ الْجَبَلَاتِ","قِمَّةِ الْجَبَلِ","قِمَّةِ الْجِبَالِ"],"a":3,"w":"الْجِبَالُ جَمْعُ تَكْسِيرٍ، وَهِيَ مَجْرُورَةٌ بِالْكَسْرَةِ."},{"q":"أَيُّ جُمْلَةٍ فِيهَا اسْمٌ مَجْرُورٌ جَاءَ بَعْدَ «عَلَى»؟","o":["تُحَافِظُ الْمُسْلِمَةُ عَلَى حِجَابِهَا","اخْتَفَى الطَّائِرُ عَنِ الْأَنْظَارِ","يَعْتَزُّ الْمُسْلِمُ بِدِينِهِ","الصَّلَاةُ رُكْنٌ مِنْ أَرْكَانِ الْإِسْلَامِ"],"a":0,"w":"«حِجَابِهَا» بَعْدَ «عَلَى»."},{"q":"الفِعْلُ يَدُلُّ عَلى:","o":["اسمٍ","مَعْنًى فِي غَيْرِه","مَكانٍ فَقَطْ","حَدَثٍ مُقْتَرِنٍ بِزَمَنٍ"],"a":3,"w":"الْفِعْلُ حَدَثٌ مُقْتَرِنٌ بِزَمَنٍ."},{"q":"كَمْ نَوْعًا لِلْفِعْلِ؟","o":["اثْنانِ","ثَلاثَةٌ","أَرْبَعَةٌ","خَمْسَةٌ"],"a":1,"w":"مَاضٍ وَمُضَارِعٌ وَأَمْرٌ."},{"q":"الجُمْلَةُ الفِعْلِيَّةُ هِيَ الَّتي تَبْدَأُ بِـ:","o":["اسمٍ","حَرْفٍ","فِعْلٍ","ضَمِيرٍ"],"a":2,"w":"تَبْدَأُ بِفِعْلٍ."},{"q":"حَرَكَةُ آخِرِ الفِعْلِ الْمَاضِي هُنَا:","o":["الفَتْحَةُ","الضَّمَّةُ","السُّكُونُ","الكَسْرَةُ"],"a":0,"w":"الْمَاضِي يَنْتَهِي بِالْفَتْحَةِ."},{"q":"حَرَكَةُ آخِرِ الفِعْلِ الْمُضَارِعِ هُنَا:","o":["الفَتْحَةُ","السُّكُونُ","الكَسْرَةُ","الضَّمَّةُ"],"a":3,"w":"الْمُضَارِعُ يَنْتَهِي بِالضَّمَّةِ."},{"q":"عَلامَةُ آخِرِ فِعْلِ الأَمْرِ هُنَا:","o":["الفَتْحَةُ","السُّكُونُ","الضَّمَّةُ","التَّنْوِينُ"],"a":1,"w":"الْأَمْرُ يَنْتَهِي بِالسُّكُونِ."},{"q":"أَيُّ كَلِمَةٍ فِعْلٌ مَاضٍ؟","o":["يَتَنَفَّسُ","اُشْكُرْ","تَبَسَّمَ","سَنَصِلُ"],"a":2,"w":"تَبَسَّمَ: حَدَثَ فِي الْمَاضِي."},{"q":"مِنَ الْأَفْعَالِ الْآتِيَةِ، أَيُّهَا فِعْلٌ مَاضٍ؟","o":["يَبْتَهِجُ","اعْلَمْ","انْتَصَرَ","نَصُومُ"],"a":2,"w":"انْتَصَرَ حَدَثَ فِي الْمَاضِي وَآخِرُهُ فَتْحَةٌ، أَمَّا الْبَاقِي فَمُضَارِعٌ وَأَمْرٌ."},{"q":"أَيُّ كَلِمَةٍ فِعْلُ أَمْرٍ؟","o":["اُتْرُكْ","انْطَلَقَ","يَتَنَفَّسُ","سَنَصِلُ"],"a":0,"w":"اُتْرُكْ: طَلَبٌ، وَآخِرُهُ سُكُونٌ."},{"q":"الفِعْلُ الْمُضَارِعُ يَدُلُّ عَلى الزَّمَنِ:","o":["الْحَاضِرِ أَوِ الْمُسْتَقْبَلِ","الْمَاضِي فَقَطْ","الْمُسْتَقْبَلِ فَقَطْ","لَا زَمَنَ لَهُ"],"a":0,"w":"الْمُضَارِعُ لِلْحَاضِرِ أَوِ الْمُسْتَقْبَلِ."},{"q":"عَلامَةُ الفِعْلِ الْمُضَارِعِ:","o":["تَاءُ الْفَاعِلِ","دُخُولُ السِّينِ أَوْ سَوْفَ","يَاءُ الْمُخَاطَبَةِ","التَّنْوِينُ"],"a":1,"w":"تَدْخُلُ السِّينُ أَوْ سَوْفَ عَلَى الْمُضَارِعِ."},{"q":"عَلَامَةُ الْفِعْلِ الْمَاضِي:","o":["دُخُولُ السِّينِ","يَاءُ الْمُخَاطَبَةِ","دُخُولُ (الْ)","قَبُولُ تَاءِ التَّأْنِيثِ السَّاكِنَةِ"],"a":3,"w":"الْمَاضِي يَقْبَلُ تَاءَ التَّأْنِيثِ السَّاكِنَةَ وَتَاءَ الْفَاعِلِ."},{"q":"عَلامَةُ فِعْلِ الأَمْرِ:","o":["دُخُولُ سَوْفَ","تَاءُ الْفَاعِلِ","قَبُولُ يَاءِ الْمُخَاطَبَةِ","التَّنْوِينُ"],"a":2,"w":"اكْتُبِي: اتَّصَلَتْ بِهِ يَاءُ الْمُخَاطَبَةِ."},{"q":"أَحْرُفُ الْمُضَارَعَةِ تَجْمَعُها كَلِمَةُ:","o":["سَوْفَ","كَتَبْتُ","نَأَيْتُ","اكْتُبِي"],"a":2,"w":"الْهَمْزَةُ وَالتَّاءُ وَالْيَاءُ وَالنُّونُ فِي (نَأَيْتُ)."},{"q":"أَيُّ فِعْلٍ مُضارِعٌ؟","o":["كَتَبَ","اكْتُبْ","كَتَبْتُ","يَكْتُبُ"],"a":3,"w":"يَبْدَأُ بِالْيَاءِ وَآخِرُهُ ضَمَّةٌ."},{"q":"سَنَصِلُ فِعْلٌ:","o":["مُضَارِعٌ لِلْمُسْتَقْبَلِ","ماضٍ","أَمْرٌ","حَرْفٌ"],"a":0,"w":"دَلَّتِ السِّينُ عَلَى الْمُسْتَقْبَلِ."},{"q":"عَلَامَاتُ الِاسْمِ:","o":["تَاءُ الْفَاعِلِ","التَّنْوِينُ وَدُخُولُ (ال) وَالْجَرُّ","السِّينُ وَسَوْفَ","يَاءُ الْمُخَاطَبَةِ"],"a":1,"w":"هَذِهِ عَلَامَاتُ الِاسْمِ."},{"q":"إِعْرابُ (زارَ) فِي «زارَ فَوّازٌ الضَّواحِيَ»:","o":["فِعْلٌ مُضَارِعٌ مَرْفُوعٌ","فِعْلُ أَمْرٍ مَبْنِيٌّ عَلَى السُّكُونِ","اسْمٌ مَرْفُوعٌ","فِعْلٌ مَاضٍ مَبْنِيٌّ عَلَى الْفَتْحِ"],"a":3,"w":"مَاضٍ مَبْنِيٌّ عَلَى الْفَتْحِ."},{"q":"إِعْرابُ (تَرْفَعُ):","o":["فِعْلٌ مَاضٍ","فِعْلٌ مُضَارِعٌ مَرْفُوعٌ وَعَلَامَةُ رَفْعِهِ الضَّمَّةُ الظَّاهِرَةُ","فِعْلُ أَمْرٍ","اسمٌ"],"a":1,"w":"مُضَارِعٌ مَرْفُوعٌ بِالضَّمَّةِ."},{"q":"إِعْرابُ (اُشْكُرْ):","o":["فِعْلُ أَمْرٍ مَبْنِيٌّ عَلَى السُّكُونِ","فِعْلٌ مَاضٍ","فِعْلٌ مُضَارِعٌ مَرْفُوعٌ","فِعْلٌ مَبْنِيٌّ عَلَى الْفَتْحِ"],"a":0,"w":"أَمْرٌ مَبْنِيٌّ عَلَى السُّكُونِ."},{"q":"فِي الْكَلِمَاتِ: احْفَظْ، نُدَافِعُ، فَكَّرَ، رَايَةٌ. التَّرْتِيبُ: الْمُضَارِعُ أَوَّلًا، الْأَمْرُ بَيْنَ الْمُضَارِعِ وَالْمَاضِي، وَالِاسْمُ أَخِيرًا:","o":["احْفَظْ، نُدافِعُ، رايَةٌ، فَكَّرَ","رايَةٌ، نُدافِعُ، فَكَّرَ، احْفَظْ","نُدافِعُ، احْفَظْ، فَكَّرَ، رايَةٌ","فَكَّرَ، رايَةٌ، احْفَظْ، نُدافِعُ"],"a":2,"w":"مُضَارِعٌ ثُمَّ أَمْرٌ ثُمَّ مَاضٍ ثُمَّ اسْمٌ."},{"q":"الفِعْلُ المُخْتَلِفُ بَيْنَ: سَأَفْتَحُ، نَدِمَ، نَشْكُرُ، يَتَسابَقُ:","o":["سَأَفْتَحُ","نَدِمَ","نَشْكُرُ","يَتَسابَقُ"],"a":1,"w":"نَدِمَ مَاضٍ، وَالْبَقِيَّةُ مُضَارِعَةٌ."},{"q":"لِمَاذَا (يَتَنَفَّسُ) مُضارِعٌ؟","o":["لِأَنَّهُ يَحْصُلُ الْآنَ وَآخِرُهُ ضَمَّةٌ","لِأَنَّهُ يَنْتَهِي بِفَتْحَةٍ","لِأَنَّهُ يَطْلُبُ عَمَلًا","لِأَنَّهُ اسْمٌ"],"a":0,"w":"التَّنَفُّسُ يَحْصُلُ الْآنَ وَآخِرُهُ ضَمَّةٌ."},{"q":"مَا الْفَرْقُ بينَ (نَصِلُ) و(سَنَصِلُ)؟","o":["سَنَصِلُ ماضٍ","نَصِلُ أَمْرٌ","سَنَصِلُ لِلْمُسْتَقْبَلِ بِالسِّينِ","لَا فَرْقَ"],"a":2,"w":"السِّينُ تَدُلُّ عَلَى الْمُسْتَقْبَلِ."},{"q":"مَا الرُّكْنَانِ الرَّئِيسَانِ لِلْجُمْلَةِ الْفِعْلِيَّةِ؟","o":["الْمُبْتَدَأُ وَالْخَبَرُ","الْحَرْفُ وَالِاسْمُ","الْفَاعِلُ وَالْخَبَرُ","الْفِعْلُ وَالْفَاعِلُ"],"a":3,"w":"الْجُمْلَةُ الْفِعْلِيَّةُ رُكْنَاهَا: الْفِعْلُ وَالْفَاعِلُ."},{"q":"الْفَاعِلُ اسْمٌ يَدُلُّ عَلَى …","o":["الْحَدَثِ","مَنْ قَامَ بِالْفِعْلِ","الزَّمَنِ","الْمَكَانِ"],"a":1,"w":"الْفَاعِلُ هُوَ مَنْ قَامَ بِالْفِعْلِ."},{"q":"مَاذَا نُسَمِّي مَنْ قَامَ بِالْفِعْلِ؟","o":["الْخَبَرَ","الْمُبْتَدَأَ","الْفَاعِلَ","حَرْفَ الْجَرِّ"],"a":2,"w":"مَنْ قَامَ بِالْفِعْلِ يُسَمَّى الْفَاعِلَ."},{"q":"الْفَاعِلُ دَائِمًا …","o":["مَرْفُوعٌ","مَنْصُوبٌ","مَجْرُورٌ","مَبْنِيٌّ"],"a":0,"w":"الْفَاعِلُ مَرْفُوعٌ دَائِمًا."},{"q":"مَا الْعَلَامَةُ الَّتِي تَظْهَرُ عَلَى آخِرِ الْفَاعِلِ الْمُفْرَدِ؟","o":["الْفَتْحَةُ","الضَّمَّةُ","الْكَسْرَةُ","السُّكُونُ"],"a":1,"w":"عَلَامَةُ رَفْعِ الْفَاعِلِ هُنَا الضَّمَّةُ."},{"q":"أَيْنَ يَأْتِي الْفَاعِلُ فِي الْجُمْلَةِ الْفِعْلِيَّةِ؟","o":["قَبْلَ الْفِعْلِ","فِي آخِرِ الْجُمْلَةِ دَائِمًا","لَا مَكَانَ لَهُ","بَعْدَ الْفِعْلِ"],"a":3,"w":"الْفَاعِلُ يَأْتِي بَعْدَ الْفِعْلِ."},{"q":"بِأَيِّ كَلِمَةٍ نَسْأَلُ لِنَعْرِفَ الْفَاعِلَ؟","o":["مَاذَا؟","أَيْنَ؟","مَنْ؟","مَتَى؟"],"a":2,"w":"نَسْأَلُ بِكَلِمَةِ «مَنْ؟» بَعْدَ الْفِعْلِ."},{"q":"هَلْ يُمْكِنُ أَنْ يَحْدُثَ فِعْلٌ بِدُونِ فَاعِلٍ؟","o":["لَا، لِكُلِّ فِعْلٍ فَاعِلٌ","نَعَمْ دَائِمًا","نَعَمْ أَحْيَانًا","لَا أَعْرِفُ"],"a":0,"w":"لِكُلِّ فِعْلٍ فَاعِلٌ."},{"q":"فِي «وَصَلَ مِشْعَلٌ إِلَى الْمَكَانِ الْمُحَدَّدِ» مَا الْفِعْلُ؟","o":["مِشْعَلٌ","الْمَكَانِ","إِلَى","وَصَلَ"],"a":3,"w":"وَصَلَ هُوَ الْكَلِمَةُ الَّتِي تَدُلُّ عَلَى الْحَدَثِ."},{"q":"أَبْرَزُ عَلَامَةٍ لِلتَّأْنِيثِ فِي آخِرِ الِاسْمِ هِيَ …","o":["التَّاءُ الْمَرْبُوطَةُ","الْأَلِفُ","الْوَاوُ","النُّونُ"],"a":0,"w":"التَّاءُ الْمَرْبُوطَةُ عَلَامَةُ التَّأْنِيثِ."},{"q":"مَا الْفَاعِلُ فِي: زَارَ فَوَّازٌ الضَّوَاحِيَ الْقَرِيبَةَ؟","o":["الضَّوَاحِيَ","فَوَّازٌ","الْقَرِيبَةَ","زَارَ"],"a":1,"w":"مَنْ زَارَ؟ فَوَّازٌ."},{"q":"مَا الْفَاعِلُ فِي: يَتَعَاوَنُ النَّاسُ فِي الْحِفَاظِ عَلَى بِيئَتِهِمْ؟","o":["بِيئَتِهِمْ","يَتَعَاوَنُ","النَّاسُ","الْحِفَاظِ"],"a":2,"w":"مَنْ يَتَعَاوَنُ؟ النَّاسُ."},{"q":"مَا الْفَاعِلُ فِي: تَصُدُّ الْأَشْجَارُ الرِّيَاحَ؟","o":["الرِّيَاحَ","تَصُدُّ","الْأَشْجَارُ","لَا فَاعِلَ"],"a":2,"w":"مَنْ يَصُدُّ؟ الْأَشْجَارُ."},{"q":"مَا الْفَاعِلُ فِي: كَتَبَ الطَّالِبُ دَرْسَهُ؟","o":["الطَّالِبُ","دَرْسَهُ","كَتَبَ","الْكِتَابَةُ"],"a":0,"w":"مَنْ قَامَ بِالْكِتَابَةِ؟ الطَّالِبُ."},{"q":"أَيُّ كَلِمَةٍ فِعْلٌ فِي: خَرَجَ التِّلْمِيذُ إِلَى السَّاحَةِ؟","o":["التِّلْمِيذُ","خَرَجَ","السَّاحَةِ","إِلَى"],"a":1,"w":"خَرَجَ يَدُلُّ عَلَى الْحَدَثِ، وَهُوَ فِعْلٌ مَاضٍ."},{"q":"مَا إِعْرَابُ «خَرَجَ»؟","o":["فَاعِلٌ مَرْفُوعٌ","حَرْفُ جَرٍّ","اسْمٌ مَجْرُورٌ","فِعْلٌ مَاضٍ مَبْنِيٌّ عَلَى الْفَتْحِ"],"a":3,"w":"خَرَجَ فِعْلٌ مَاضٍ مَبْنِيٌّ عَلَى الْفَتْحِ."},{"q":"مَا إِعْرَابُ «الْأُسْرَةُ» فِي: عَادَتِ الْأُسْرَةُ إِلَى الْمَنْزِلِ؟","o":["فِعْلٌ مَاضٍ","فَاعِلٌ مَرْفُوعٌ","حَرْفُ جَرٍّ","اسْمٌ مَجْرُورٌ"],"a":1,"w":"الْأُسْرَةُ هِيَ مَنْ عَادَ، فَهِيَ فَاعِلٌ مَرْفُوعٌ."},{"q":"الْمُبْتَدَأُ هُوَ …","o":["الْفِعْلُ الَّذِي يَدُلُّ عَلَى الْحَدَثِ","مَنْ قَامَ بِالْحَدَثِ","الِاسْمُ الَّذِي نَبْدَأُ بِهِ الْجُمْلَةَ الِاسْمِيَّةَ","الْمُكَمِّلُ لِمَعْنَى الْخَبَرِ"],"a":2,"w":"الْمُبْتَدَأُ هُوَ الِاسْمُ الَّذِي نَبْدَأُ بِهِ الْجُمْلَةَ الِاسْمِيَّةَ."},{"q":"الْخَبَرُ هُوَ …","o":["الْمُكَمِّلُ لِمَعْنَى الْمُبْتَدَأِ","مَنْ قَامَ بِالْفِعْلِ","الْفِعْلُ","حَرْفٌ مِنْ حُرُوفِ الْجَرِّ"],"a":0,"w":"الْخَبَرُ يُكَمِّلُ مَعْنَى الْمُبْتَدَأِ."},{"q":"أَيُّ كَلِمَةٍ مِنَ الْآتِيَةِ مُؤَنَّثَةٌ؟","o":["الدِّيكُ","الْجَمَلُ","الطَّالِبُ","الشَّاةُ"],"a":3,"w":"الشَّاةُ فِي آخِرِهَا تَاءٌ مَرْبُوطَةٌ."},{"q":"نُشِيرُ لِلِاسْمِ الْمُؤَنَّثِ بِاسْمِ الْإِشَارَةِ …","o":["هَذَا","هَذِهِ","ذَلِكَ","هَؤُلَاءِ"],"a":1,"w":"نَقُولُ: هَذِهِ الدَّجَاجَةُ."},{"q":"مَا الْفَاعِلُ فِي: أَشْرَقَتْ شَمْسُ الرَّبِيعِ؟","o":["شَمْس لُ بِهِ؟","o":["اسْمٌ مَنْصُوبٌ وَقَعَ عَلَيْهِ فِعْلُ الْفَاعِلِ","اسْمٌ مَرْفُوعٌ يَقُومُ بِالْفِعْلِ","حَرْفُ جَرٍّ","فِعْلٌ مَاضٍ"],"a":0,"w":"الْمَفْعُولُ بِهِ اسْمٌ مَنْصُوبٌ يَدُلُّ عَلَى مَنْ وَقَعَ عَلَيْهِ فِعْلُ الْفَاعِلِ."},{"q":"بِأَيِّ كَلِمَةٍ نَسْأَلُ عَنِ الْمَفْعُولِ بِهِ؟","o":["أَيْنَ؟","مَتَى؟","مَاذَا؟","كَيْفَ؟"],"a":2,"w":"نَسْأَلُ عَنْهُ بِكَلِمَةِ «مَاذَا؟»."},{"q":"مَا عَلَامَةُ نَصْبِ الْمَفْعُولِ بِهِ فِي هَذَا الدَّرْسِ؟","o":["الضَّمَّةُ","الْكَسْرَةُ","السُّكُونُ","الْفَتْحَةُ"],"a":3,"w":"عَلَامَةُ نَصْبِهِ هُنَا الْفَتْحَةُ الظَّاهِرَةُ عَلَى آخِرِهِ."},{"q":"فِي «يَشْرَحُ الْمُعَلِّمُ الدَّرْسَ» الْمَفْعُولُ بِهِ هُوَ:","o":["يَشْرَحُ","الدَّرْسَ","الْمُعَلِّمُ","لَا يُوجَدُ"],"a":1,"w":"مَاذَا يَشْرَحُ الْمُعَلِّمُ؟ الدَّرْسَ."},{"q":"فِي «قَالَ الرَّجُلُ الصِّدْقَ» الْفَاعِلُ هُوَ:","o":["قَالَ","الصِّدْقَ","لَا يُوجَدُ","الرَّجُلُ"],"a":3,"w":"الرَّجُلُ هُوَ مَنْ قَامَ بِالْقَوْلِ، وَآخِرُهُ ضَمَّةٌ."},{"q":"الْجُمْلَةُ الَّتِي تَبْدَأُ بِفِعْلٍ تُسَمَّى:","o":["جُمْلَةٌ اسْمِيَّةٌ","جُمْلَةٌ فِعْلِيَّةٌ","شِبْهُ جُمْلَةٍ","جُمْلَةٌ شَرْطِيَّةٌ"],"a":1,"w":"الْجُمْلَةُ الَّتِي تَبْدَأُ بِفِعْلٍ هِيَ الْجُمْلَةُ الْفِعْلِيَّةُ."},{"q":"حَرَكَةُ آخِرِ الْمَفْعُولِ بِهِ:","o":["الضَّمَّةُ","الْكَسْرَةُ","الْفَتْحَةُ","السُّكُونُ"],"a":2,"w":"حَرَكَةُ الْحَرْفِ الْأَخِيرِ فِي الْمَفْعُولِ بِهِ هِيَ الْفَتْحَةُ."},{"q":"الْفِعْلُ يَدُلُّ عَلَى:","o":["الْحَدَثِ","الْمَكَانِ","الزَّمَانِ فَقَطْ","الصِّفَةِ"],"a":0,"w":"الْفِعْلُ يَدُلُّ عَلَى الْحَدَثِ، وَالْفَاعِلُ يَدُلُّ عَلَى مَنْ قَامَ بِالْحَدَثِ."},{"q":"فِي «كَتَبَ أَحْمَدُ الدَّرْسَ» مَاذَا كَتَبَ أَحْمَدُ؟","o":["كَتَبَ","أَحْمَدُ","الدَّرْسَ","أَحْمَدُ وَالدَّرْسُ"],"a":2,"w":"الدَّرْسَ هُوَ الْمَفْعُولُ بِهِ."},{"q":"«زَرَعَ خَالِدٌ زُهُورًا فِي حَدِيقَتِهِمْ». الْمَفْعُولُ بِهِ:","o":["خَالِدٌ","فِي","حَدِيقَتِهِمْ","زُهُورًا"],"a":3,"w":"مَاذَا زَرَعَ خَالِدٌ؟ زُهُورًا."},{"q":"إِعْرَابُ «الدَّرْسَ» فِي «كَتَبَ أَحْمَدُ الدَّرْسَ»:","o":["مَفْعُولٌ بِهِ مَنْصُوبٌ وَعَلَامَةُ نَصْبِهِ الْفَتْحَةُ الظَّاهِرَةُ عَلَى آخِرِهِ","فَاعِلٌ مَرْفُوعٌ وَعَلَامَةُ رَفْعِهِ الضَّمَّةُ","فِعْلٌ مَاضٍ مَبْنِيٌّ عَلَى الْفَتْحِ","خَبَرٌ مَرْفُوعٌ"],"a":0,"w":"الدَّرْسُ وَقَعَ عَلَيْهِ فِعْلُ الْكِتَابَةِ، وَآخِرُهُ فَتْحَةٌ."},{"q":"إِعْرَابُ «أَحْمَدُ» فِي «كَتَبَ أَحْمَدُ الدَّرْسَ»:","o":["مَفْعُولٌ بِهِ مَنْصُوبٌ","فَاعِلٌ مَرْفُوعٌ وَعَلَامَةُ رَفْعِهِ الضَّمَّةُ الظَّاهِرَةُ عَلَى آخِرِهِ","فِعْلٌ مَاضٍ","مُبْتَدَأٌ مَرْفُوعٌ"],"a":1,"w":"أَحْمَدُ هُوَ مَنْ قَامَ بِالْكِتَابَةِ، فَهُوَ فَاعِلٌ مَرْفُوعٌ."},{"q":"إِعْرَابُ «كَتَبَ» فِي «كَتَبَ أَحْمَدُ الدَّرْسَ»:","o":["فَاعِلٌ مَرْفُوعٌ","فِعْلٌ مَاضٍ مَبْنِيٌّ عَلَى الْفَتْحِ","مَفْعُولٌ بِهِ مَنْصُوبٌ","حَرْفُ جَرٍّ"],"a":1,"w":"كَتَبَ فِعْلٌ مَاضٍ، وَآخِرُهُ فَتْحَةٌ."},{"q":"أَيُّ جُمْلَةٍ فِيهَا مَفْعُولٌ بِهِ؟","o":["ذَهَبَ الطَّالِبُ.","نَامَ الطِّفْلُ.","يَقْرَأُ التِّلْمِيذُ قِصَّةً.","سَعَى الْوَلَدُ."],"a":2,"w":"«قِصَّةً» وَقَعَ عَلَيْهَا فِعْلُ الْقِرَاءَةِ، أَمَّا الْأَفْعَالُ فِي الْبَاقِي فَلَازِمَةٌ."},{"q":"الْفِعْلُ اللَّازِمُ هُوَ الْفِعْلُ الَّذِي:","o":["يَكْتَفِي بِالْفَاعِلِ وَلَا يَحْتَاجُ إِلَى مَفْعُولٍ بِهِ","يَحْتَاجُ إِلَى مَفْعُولٍ بِهِ","لَا فَاعِلَ لَهُ","يَبْدَأُ بِحَرْفٍ"],"a":0,"w":"اللَّازِمُ يَلْزَمُ الْفَاعِلَ وَيَكْتَفِي بِهِ."},{"q":"الْفِعْلُ الْمُتَعَدِّي هُوَ الْفِعْلُ الَّذِي:","o":["يَكْتَفِي بِالْفَاعِلِ","لَا يَقْبَلُ الْفَاعِلَ","يَدُلُّ عَلَى مَكَانٍ","يَتَعَدَّى الْفَاعِلَ وَيَحْتَاجُ إِلَى مَفْعُولٍ بِهِ"],"a":3,"w":"الْمُتَعَدِّي يَتَعَدَّى الْفَاعِلَ إِلَى مَفْعُولٍ بِهِ يُكَمِّلُ الْمَعْنَى."},{"q":"أَيُّ فِعْلٍ مُتَعَدٍّ؟","o":["ذَهَبَ","سَأَلَ","نَامَ","سَعَى"],"a":1,"w":"نَقُولُ سَأَلَهُ، أَمَّا الْبَاقِي فَلَا نَقُولُ: ذَهَبَهُ وَنَامَهُ وَسَعَاهُ."},{"q":"أَيُّ فِعْلٍ لَازِمٌ؟","o":["بَعَثَ","نَسَقَ","نَامَ","سَأَلَ"],"a":2,"w":"لَا نَقُولُ «نَامَهُ»، فَهُوَ لَازِمٌ."},{"q":"كَيْفَ نَعْرِفُ أَنَّ الْفِعْلَ مُتَعَدٍّ بِطَرِيقَةٍ سَرِيعَةٍ؟","o":["نُضِيفُ هَاءَ الْغَائِبِ آخِرَهُ، فَإِنْ قَبِلَهَا فَهُوَ مُتَعَدٍّ","نَحْذِفُ أَوَّلَ حَرْفٍ مِنْهُ","نَجْعَلُهُ مُضَارِعًا","نُضِيفُ «الْ» أَوَّلَهُ"],"a":0,"w":"إِنْ قَبِلَ الْفِعْلُ ضَمِيرَ الْغَائِبِ «ـهُ» فَهُوَ مُتَعَدٍّ، وَإِنْ لَمْ يَقْبَلْهُ فَهُوَ لَازِمٌ."},{"q":"لِمَاذَا لَمْ تَسْتَطِعِ الطَّالِبَةُ فِي الْحِوَارِ أَنْ تَأْتِيَ بِمَفْعُولٍ بِهِ فِي الْجُمْلَتَيْنِ؟","o":["لِأَنَّهَا لَا تَعْرِفُ الْفَاعِلَ","لِأَنَّ الْجُمْلَتَيْنِ اسْمِيَّتَانِ","لِأَنَّ الْفِعْلَ مُضَارِعٌ","لِأَنَّ الْفِعْلَ فِيهِمَا لَازِمٌ"],"a":3,"w":"الْفِعْلُ اللَّازِمُ يَكْتَفِي بِالْفَاعِلِ، فَلَا يَحْتَاجُ إِلَى مَفْعُولٍ بِهِ."},{"q":"«أَعَانَ الْمُسْلِمُ الْفَقِيرَ». كَلِمَةُ «الْفَقِيرَ» إِعْرَابُهَا:","o":["فَاعِلٌ مَرْفُوعٌ وَعَلَامَةُ رَفْعِهِ الضَّمَّةُ","خَبَرٌ مَرْفُوعٌ","مَفْعُولٌ بِهِ مَنْصُوبٌ وَعَلَامَةُ نَصْبِهِ الْفَتْحَةُ الظَّاهِرَةُ عَلَى آخِرِهِ","اسْمٌ مَجْرُورٌ"],"a":2,"w":"الْفَقِيرُ وَقَعَ عَلَيْهِ فِعْلُ الْإِعَانَةِ، وَآخِرُهُ فَتْحَةٌ."},{"q":"«يَشْرَبُ الْعَدَّاءُ الْمَاءَ». إِعْرَابُ «الْعَدَّاءُ»:","o":["مَفْعُولٌ بِهِ مَنْصُوبٌ","فَاعِلٌ مَرْفُوعٌ وَعَلَامَةُ رَفْعِهِ الضَّمَّةُ الظَّاهِرَةُ عَلَى آخِرِهِ","فِعْلٌ مُضَارِعٌ","مُبْتَدَأٌ"],"a":1,"w":"الْعَدَّاءُ هُوَ مَنْ قَامَ بِالشُّرْبِ، وَآخِرُهُ ضَمَّةٌ."},{"q":"«بَلَّغَ الرَّسُولُ الْإِسْلَامَ». مَا الْفَاعِلُ وَمَا الْمَفْعُولُ بِهِ؟","o":["الْفَاعِلُ الرَّسُولُ وَالْمَفْعُولُ بِهِ الْإِسْلَامُ","الْفَاعِلُ الْإِسْلَامُ وَالْمَفْعُولُ بِهِ الرَّسُولُ","الْفَاعِلُ بَلَّغَ وَالْمَفْعُولُ بِهِ الرَّسُولُ","لَا يُوجَدُ مَفْعُولٌ بِهِ"],"a":0,"w":"الرَّسُولُ هُوَ مَنْ قَامَ بِالتَّبْلِيغِ، وَالْإِسْلَامُ هُوَ مَا بُلِّغَ."},{"q":"مَا الْفَرْقُ بَيْنَ الْفَاعِلِ وَالْمَفْعُولِ بِهِ فِي «يَحْصُدُ الْفَلَّاحُ الزَّرْعَ»؟","o":["الْفَلَّاحُ مَفْعُولٌ بِهِ، وَالزَّرْعُ فَاعِلٌ","كِلَاهُمَا فَاعِلٌ","كِلَاهُمَا مَفْعُولٌ بِهِ","الْفَلَّاحُ فَاعِلٌ مَرْفُوعٌ، وَالزَّرْعُ مَفْعُولٌ بِهِ مَنْصُوبٌ"],"a":3,"w":"الْفَلَّاحُ قَامَ بِالْحَصَادِ وَآخِرُهُ ضَمَّةٌ، وَالزَّرْعُ وَقَعَ عَلَيْهِ الْحَصَادُ وَآخِرُهُ فَتْحَةٌ."},{"q":"فِي «شَارَكَ التِّلْمِيذُ فِي الْحَمْلَةِ» هَلْ فِيهَا مَفْعُولٌ بِهِ؟","o":["نَعَمْ، التِّلْمِيذُ","نَعَمْ، الْحَمْلَةُ","نَعَمْ، شَارَكَ","لَا، الْحَمْلَةُ اسْمٌ مَجْرُورٌ بِحَرْفِ الْجَرِّ"],"a":3,"w":"«الْحَمْلَةُ» اسْمٌ مَجْرُورٌ بِـ «فِي»، وَلَيْسَتْ مَنْصُوبَةً، فَلَا مَفْعُولَ بِهِ هُنَا."},{"q":"مَا الْخَطُّ الَّذِي نَدْرُسُهُ فِي الْمَرْحَلَةِ الِابْتِدَائِيَّةِ؟","o":["الثُّلُثُ","النَّسْخُ","الدِّيوَانِيُّ","الْكُوفِيُّ"],"a":1,"w":"هُوَ خَطُّ النَّسْخِ."},{"q":"كَمْ قِسْمًا تَنْقَسِمُ إِلَيْهِ حُرُوفُ النَّسْخِ مِنْ حَيْثُ كِتَابَتُهَا عَلَى السَّطْرِ؟","o":["قِسْمٌ وَاحِدٌ","ثَلَاثَةُ أَقْسَامٍ","أَرْبَعَةُ أَقْسَامٍ","قِسْمَانِ"],"a":3,"w":"قِسْمٌ مُرْتَكِزٌ عَلَى السَّطْرِ وَقِسْمٌ يَنْزِلُ جُزْءٌ مِنْهُ أَسْفَلَ السَّطْرِ."},{"q":"أَيُّ حَرْفٍ مِنْ هَؤُلَاءِ مُرْتَكِزٌ عَلَى السَّطْرِ؟","o":["د","ن","ق","ج"],"a":0,"w":"الدَّالُ مُرْتَكِزَةٌ عَلَى السَّطْرِ."},{"q":"أَيُّ حَرْفٍ مِنْ هَؤُلَاءِ يَنْزِلُ جُزْءٌ مِنْهُ أَسْفَلَ السَّطْرِ؟","o":["أ","ط","م","ف"],"a":2,"w":"الْمِيمُ مِنْ حُرُوفِ الْقِسْمِ الثَّانِي."},{"q":"كَيْفَ أَجْلِسُ عِنْدَ الْكِتَابَةِ؟","o":["مُنْحَنِيًا","مُعْتَدِلًا","مُسْتَلْقِيًا","وَاقِفًا"],"a":1,"w":"الْإِرْشَادُ: أَجْلِسُ مُعْتَدِلًا."},{"q":"أَيْنَ أَضَعُ قَدَمَيَّ عِنْدَ الْكِتَابَةِ؟","o":["عَلَى الْكُرْسِيِّ","عَلَى الطَّاوِلَةِ","عَلَى الْأَرْضِ","فِي الْهَوَاءِ"],"a":2,"w":"أَضَعُ قَدَمَيَّ كِلْتَيْهِمَا عَلَى الْأَرْضِ."},{"q":"مِنْ أَيْنَ أَبْدَأُ الْكِتَابَةَ فِي الصَّفْحَةِ؟","o":["مِنْ أَعْلَاهَا","مِنْ وَسَطِهَا","مِنْ أَيِّ مَكَانٍ","مِنْ أَسْفَلِهَا"],"a":3,"w":"أَبْدَأُ الْكِتَابَةَ مِنْ أَسْفَلِ الصَّفْحَةِ إِلَى أَعْلَاهَا."},{"q":"كَمْ سَنْتِيمِتْرًا تَبْعُدُ الْوَرَقَةُ عَنْ عَيْنَيَّ؟","o":["٣٠ سم","١٠ سم","٢٠ سم","٥٠ سم"],"a":0,"w":"أُبْعِدُ الْوَرَقَةَ عَنْ عَيْنَيَّ مَسَافَةَ ٣٠ سم."},{"q":"إِلَى أَيِّ جِهَةٍ أَجْعَلُ الْوَرَقَةَ مَائِلَةً قَلِيلًا؟","o":["إِلَى الْيَمِينِ","إِلَى الْيَسَارِ","إِلَى الْأَعْلَى","لَا أُمِيلُهَا"],"a":1,"w":"أَجْعَلُهَا مَائِلَةً إِلَى الْيَسَارِ قَلِيلًا."},{"q":"إِلَى أَيِّ جِهَةٍ أَجْعَلُ يَدِي مَائِلَةً عِنْدَ الْكِتَابَةِ؟","o":["إِلَى الْيَسَارِ","إِلَى الْأَعْلَى","إِلَى الْيَمِينِ","إِلَى الْأَسْفَلِ"],"a":2,"w":"أَجْعَلُ يَدِي مَائِلَةً إِلَى الْيَمِينِ."},{"q":"مَاذَا أَفْعَلُ أَوَّلًا عِنْدَ كِتَابَةِ الْكَلِمَةِ؟","o":["أَضَعُ النُّقَطَ ثُمَّ الْأُصُولَ","أَضَعُ الْحَرَكَاتِ فَقَطْ","أَكْتُبُ كُلَّ حَرْفٍ بَعِيدًا عَنِ الْآخَرِ","أَكْتُبُ أُصُولَهَا دُونَ تَوَقُّفٍ ثُمَّ أَضَعُ النُّقَطَ وَالْحَرَكَاتِ"],"a":3,"w":"أَكْتُبُ الْكَلِمَةَ دُونَ تَوَقُّفٍ حَتَّى الِانْتِهَاءِ مِنْ أُصُولِهَا، ثُمَّ أَضَعُ النُّقَطَ وَالْحَرَكَاتِ."},{"q":"كَمْ خُطْوَةً فِي رَسْمِ الْبَاءِ؟","o":["ثَلَاثُ خُطُوَاتٍ","خُطْوَتَانِ","أَرْبَعُ خُطُوَاتٍ","خُطْوَةٌ وَاحِدَةٌ"],"a":0,"w":"يَمِيلُ يَمِينًا، مُسْتَقِرٌّ عَلَى السَّطْرِ، قَوْسٌ إِلَى الْأَعْلَى."},{"q":"كَمْ خُطْوَةً فِي رَسْمِ الدَّالِ؟","o":["ثَلَاثُ خُطُوَاتٍ","خُطْوَتَانِ","أَرْبَعُ خُطُوَاتٍ","خُطْوَةٌ وَاحِدَةٌ"],"a":1,"w":"يَمُرُّ رَسْمُ الدَّالِ بِخُطْوَتَيْنِ."},{"q":"مَاذَا نُلَاحِظُ عَلَى الدَّالِ وَالذَّالِ؟","o":["يَسْتَقِرَّانِ عَلَى السَّطْرِ","يَنْزِلَانِ أَسْفَلَ السَّطْرِ","يَرْتَفِعَانِ عَنِ السَّطْرِ كَثِيرًا","لَا يُكْتَبَانِ مُنْفَرِدَيْنِ"],"a":0,"w":"حَرْفَا الدَّالِ وَالذَّالِ يَسْتَقِرَّانِ عَلَى السَّطْرِ."},{"q":"أَيُّ حَرْفٍ لَهُ أَلِفٌ وَحِلْيَةٌ وَرَأْسُ صَادٍ؟","o":["الْفَاءُ","الْكَافُ","الطَّاءُ","الدَّالُ"],"a":2,"w":"هَذِهِ أَجْزَاءُ الطَّاءِ."},{"q":"الْفَاءُ تُشْبِهُ الْبَاءَ وَتَرْتَكِزُ عَلَى السَّطْرِ فِي:","o":["ثُلُثِهَا الْأَوَّلِ","نِصْفِهَا الْأَوَّلِ","ثُلُثِهَا الْأَخِيرِ","رَأْسِهَا"],"a":2,"w":"الْفَاءُ تَرْتَكِزُ عَلَى السَّطْرِ فِي ثُلُثِهَا الْأَخِيرِ."},{"q":"مِمَّ يَتَكَوَّنُ رَسْمُ الْكَافِ؟","o":["رَأْسٍ وَعُنُقٍ","حِلْيَةٍ وَطَرَفٍ صَغِيرٍ","نُقْطَةٍ وَقَوْسٍ فَقَطْ","أَلِفٍ وَشَارَةِ الْكَافِ"],"a":3,"w":"رَسْمُ الْكَافِ يَتَكَوَّنُ مِنْ خُطْوَتَيْنِ: أَلِفٌ وَشَارَةُ الْكَافِ."},{"q":"أَيُّ هَذِهِ الْمَجْمُوعَاتِ كُلُّهَا حُرُوفٌ مُرْتَكِزَةٌ عَلَى السَّطْرِ؟","o":["أ، ن، د، ط","ب، ق، ف، ك","د، ص، ط، ك","أ، ب، د، ط"],"a":3,"w":"الْمُرْتَكِزَةُ: أ، ب، د، ط، ف، ك، هـ."},{"q":"أَيُّ مَجْمُوعَةٍ كُلُّهَا حُرُوفٌ يَنْزِلُ جُزْءٌ مِنْهَا أَسْفَلَ السَّطْرِ؟","o":["أ، ص، ل، ي","ن، ص، ل، ي","ن، ب، ل، ي","ن، ص، ك، ي"],"a":1,"w":"ن وَص وَل وَي كُلُّهَا مِنَ الْقِسْمِ الثَّانِي."},{"q":"أَيُّ الْكَلِمَاتِ الْآتِيَةِ اسْمٌ مِنْ كَلِمَاتِ الْكِتَابِ فِي الْحُرُوفِ (أ، ب، ت، ث، ف، د، ذ، ط، ظ)؟","o":["تَبُثُّ","ثَبَتَ","دُفٌّ","تَفَتَّتَ"],"a":2,"w":"دُفٌّ اسْمٌ، وَالْبَاقِي أَفْعَالٌ."},{"q":"أَيُّ الْكَلِمَاتِ الْآتِيَةِ فِعْلٌ مِنْ كَلِمَاتِ الْكِتَابِ؟","o":["ثَبَتَ","طِبٌّ","دُبٌّ","بَطٌّ"],"a":0,"w":"ثَبَتَ فِعْلٌ، وَالْبَاقِي أَسْمَاءٌ."},{"q":"كَيْفَ أَضَعُ الْخُطُوطَ تَحْتَ الْكَلِمَاتِ فِي سُؤَالِ الْأَسْمَاءِ وَالْأَفْعَالِ؟","o":["خَطَّيْنِ تَحْتَ الْأَسْمَاءِ وَخَطًّا تَحْتَ الْأَفْعَالِ","خَطًّا تَحْتَ كُلِّ الْكَلِمَاتِ","خَطًّا تَحْتَ الْأَسْمَاءِ وَخَطَّيْنِ تَحْتَ الْأَفْعَالِ","لَا أَضَعُ خُطُوطًا"],"a":2,"w":"هَكَذَا فِي السُّؤَالِ."},{"q":"أَيُّ مِمَّا يَأْتِي لَيْسَ مِنْ مُمَيِّزَاتِ خَطِّ النَّسْخِ؟","o":["تَسَاوِي أَحْجَامِ الْحُرُوفِ","صُعُوبَةُ قِرَاءَةِ الْكَلِمَاتِ","سُهُولَةُ الْقِرَاءَةِ","الِاهْتِمَامُ بِوَضْعِ الْحَرَكَاتِ"],"a":1,"w":"قِرَاءَةُ الْكَلِمَاتِ وَالْجُمَلِ فِي النَّسْخِ سَهْلَةٌ."},{"q":"أُكْمِلُ: الْحَرْفُ (ط) لَا ............ أَسْفَلَ السَّطْرِ.","o":["يَنْزِلُ","يَرْتَفِعُ","يَخْتَفِي","يَدُورُ"],"a":0,"w":"الْحَرْفُ (ط) لَا يَنْزِلُ أَسْفَلَ السَّطْرِ."},{"q":"مَنْ شَاعِرُ قَصِيدَةِ «لِمَ تَأَلَّمَتِ الْفَرَاشَةُ؟»","o":["أَحْمَدُ شَوْقِي","مُحَمَّدٌ الْفَاضِلُ سُلَيْمَانُ","حَافِظٌ إِبْرَاهِيمُ","الْمُتَنَبِّي"],"a":1,"w":"اِسْمُ الشَّاعِرِ فِي آخِرِ الْقَصِيدَةِ."},{"q":"بِمَنْ شَبَّهَتِ الْفَرَاشَةُ تَجَوُّلَهَا فِي هَنَاءٍ؟","o":["بُلْبُلٍ","نَحْلَةٍ","عُصْفُورٍ","حَمَامَةٍ"],"a":0,"w":"«فِي هَنَاءٍ مِثْلَ بُلْبُلْ»."},{"q":"مَعْنَى (أَتَجَوَّلُ):","o":["أَنَامُ","أَجْلِسُ","أَبْكِي","أَتَنَقَّلُ مِنْ مَكَانٍ إِلَى آخَرَ"],"a":3,"w":"«أَتَجَوَّلُ» تَعْنِي أَتَنَقَّلُ مِنْ مَكَانٍ إِلَى آخَرَ، كَقَوْلِ الْفَرَاشَةِ: «كُنْتُ دَوْمًا أَتَجَوَّلْ». (ص١٣٣ وَالْمَعْنَى ص١٣٤)"},{"q":"مَعْنَى (النَّضَارَةُ):","o":["الْقَذَارَةُ","الْحُزْنُ","الْحُسْنُ وَالْإِشْرَاقُ","الْمَرَارَةُ"],"a":2,"w":"النَّضَارَةُ هِيَ الْحُسْنُ وَالْإِشْرَاقُ، كَمَا فِي «وَارْفَعُوا تَاجَ النَّضَارَةْ». (ص١٣٣–١٣٤)"},{"q":"مَعْنَى (التَّآخِي):","o":["الْغَضَبُ","الْبُعْدُ","الْخِلَافُ","التَّفَاهُمُ وَالْمَحَبَّةُ"],"a":3,"w":"التَّآخِي هُوَ التَّفَاهُمُ وَالْمَحَبَّةُ، كَمَا فِي «حَقِّقُوا رُوحَ التَّآخِي». (ص١٣٣–١٣٤)"},{"q":"مَعْنَى (شَاحِبٌ):","o":["جَمِيلٌ","مُتَغَيِّرُ اللَّوْنِ، ذَابِلٌ","لَامِعٌ","سَرِيعٌ"],"a":1,"w":"شَاحِبٌ أَيْ مُتَغَيِّرُ اللَّوْنِ، ذَابِلٌ، كَمَا فِي «شَاحِبَ اللَّوْنِ مُعَكَّرْ». (ص١٣٣–١٣٤)"},{"q":"كَلِمَةُ (آهًا) تَدُلُّ عَلَى:","o":["التَّأَلُّمِ","الرِّضَا","الْفَرَحِ","الْغَضَبِ"],"a":0,"w":"تَدُلُّ عَلَى التَّأَلُّمِ، لِأَنَّ الْفَرَاشَةَ تَقُولُ: «غَيْرَ أَنَّ الْآنَ آهًا كُلُّ شَيْءٍ قَدْ تَغَيَّرْ». (ص١٣٣–١٣٤، أَوْرَاقُ الْعَمَلِ ص٣٩)"},{"q":"نَبَاتُ الْحَنْظَلِ شَدِيدُ:","o":["الْحَلَاوَةِ","الْمُلُوحَةِ","الْمَرَارَةِ","الْحُمُوضَةِ"],"a":2,"w":"الْحَنْظَلُ شَدِيدُ الْمَرَارَةِ، وَلِذَلِكَ شَبَّهَتِ الْفَرَاشَةُ بِهِ طَعْمَ الرَّحِيقِ: «طَعْمُهُ لِي مِثْلَ حَنْظَلْ». (ص١٣٤، أَوْرَاقُ الْعَمَلِ ص٣٩)"},{"q":"ضِدُّ كَلِمَةِ (أَقْبَلَ):","o":["بَدَا","أَمْسَى","تَغَيَّرَ","أَدْبَرَ"],"a":3,"w":"ضِدُّ «أَقْبَلَ» هُوَ «أَدْبَرَ»، كَمَا فِي «لَوْنُهُ السِّحْرِيُّ أَدْبَرْ». (ص١٣٣ وَص١٣٥، أَوْرَاقُ الْعَمَلِ ص٤٠)"},{"q":"جَمْعُ (صَغِيرٍ) فِي الْقَصِيدَةِ:","o":["صِغَارٌ","صَغِيرُونَ","أَصَاغِرُ","صُغَرَاءُ"],"a":0,"w":"جَمْعُهَا «صِغَارٌ»، كَمَا فِي «أَنْقِذُونِي يَا صِغَارُ». (ص١٣٣ وَص١٣٥، أَوْرَاقُ الْعَمَلِ ص٤٠)"},{"q":"كَلِمَةٌ بَدَأَتْ بِهَمْزَةِ قَطْعٍ فِي الْقَصِيدَةِ:","o":["انْشُرُوا","أَتَجَوَّلُ","ارْفَعُوا","اسْلُكُوا"],"a":1,"w":"«أَتَجَوَّلُ» هَمْزَتُهَا هَمْزَةُ قَطْعٍ، أَمَّا «انْشُرُوا» وَ«ارْفَعُوا» وَ«اسْلُكُوا» فَهَمْزَتُهَا هَمْزَةُ وَصْلٍ. (ص١٣٥، أَوْرَاقُ الْعَمَلِ ص٤٠)"},{"q":"كَلِمَةٌ بَدَأَتْ بِهَمْزَةِ وَصْلٍ فِي الْقَصِيدَةِ:","o":["أَدْبَرَ","أَتَجَوَّلُ","انْشُرُوا","أَمْسَى"],"a":2,"w":"«انْشُرُوا» هَمْزَتُهَا هَمْزَةُ وَصْلٍ، أَمَّا «أَدْبَرَ» وَ«أَمْسَى» وَ«أَتَجَوَّلُ» فَهَمْزَتُهَا هَمْزَةُ قَطْعٍ. (ص١٣٥، أَوْرَاقُ الْعَمَلِ ص٤٠)"},{"q":"الْكَلِمَةُ الْمُخْتَلِفَةُ: صَافٍ، عَذْبٌ، نَقِيٌّ، مُعَكَّرٌ","o":["صَافٍ","مُعَكَّرٌ","عَذْبٌ","نَقِيٌّ"],"a":1,"w":"الثَّلَاثُ الْأُخْرَى بِمَعْنًى وَاحِدٍ."},{"q":"الْأَبْيَاتُ ١–٤ تَحْكِي عَنْ:","o":["التَّغَيُّرِ بِسَبَبِ التَّلَوُّثِ","نِدَاءِ الْفَرَاشَةِ لِلْأَطْفَالِ","حَالِ الْفَرَاشَةِ فِي الْمَاضِي","حَيَاةِ النَّحْلَةِ"],"a":2,"w":"تَحْكِي الْفَرَاشَةُ عَنْ حَيَاتِهَا السَّعِيدَةِ فِي الْمَاضِي بَيْنَ الْأَزْهَارِ. (أَوْرَاقُ الْعَمَلِ ص٣٨)"},{"q":"الْأَبْيَاتُ ٥–٨ تَحْكِي عَنْ:","o":["التَّغَيُّرِ بِسَبَبِ التَّلَوُّثِ","حَالِ الْفَرَاشَةِ فِي الْمَاضِي","نَصِيحَةِ الشَّاعِرِ","وُصُولِ الرَّبِيعِ"],"a":0,"w":"تَحْكِي عَنِ التَّغَيُّرِ الَّذِي حَدَثَ بِسَبَبِ التَّلَوُّثِ: الْمَاءُ وَالزَّهْرُ وَالرَّحِيقُ. (أَوْرَاقُ الْعَمَلِ ص٣٨)"},{"q":"الْأَبْيَاتُ ٩–١٢ فِيهَا:","o":["وَصْفُ الْجَدْوَلِ","ذِكْرُ الْبُلْبُلِ","حُزْنُ الْوَرْدِ","نِدَاءُ الْفَرَاشَةِ وَنَصِيحَتُهَا لِلْأَطْفَالِ"],"a":3,"w":"تُنَادِي الْفَرَاشَةُ الْأَطْفَالَ الصِّغَارَ وَتَطْلُبُ مِنْهُمْ إِزَالَةَ الْقَذَارَةِ وَالْمُحَافَظَةَ عَلَى النَّظَافَةِ. (أَوْرَاقُ الْعَمَلِ ص٣٨)"},{"q":"النَّصِيحَةُ الَّتِي خَتَمَ بِهَا الشَّاعِرُ:","o":["ابْتَعِدُوا عَنِ الْبُسْتَانِ","لَا تَسْبَحُوا","اهْجُرُوا الْوَرْدَ","حَقِّقُوا رُوحَ التَّآخِي كَيْ يَكُونَ الْعَيْشُ أَفْضَلْ"],"a":3,"w":"خَتَمَ الشَّاعِرُ بِقَوْلِهِ: «حَقِّقُوا رُوحَ التَّآخِي كَيْ يَكُونَ الْعَيْشُ أَفْضَلْ». (ص١٣٣ وَالسُّؤَالُ ص١٣٥، أَوْرَاقُ الْعَمَلِ ص٤٠)"},{"q":"(طَعْمُهُ لِي مِثْلَ حَنْظَلْ) هَذَا تَعْبِيرٌ عَنْ:","o":["حَاسَّةِ الْبَصَرِ","حَاسَّةِ التَّذَوُّقِ","حَاسَّةِ الشَّمِّ","حَاسَّةِ اللَّمْسِ"],"a":1,"w":"الطَّعْمُ يُتَذَوَّقُ. (اجْتِهَادٌ مِنَ النَّصِّ)"},{"q":"(وَانْشُرُوا الْبُسْتَانَ عِطْرًا) تَدُلُّ عَلَى حَاسَّةِ:","o":["الْبَصَرِ","التَّذَوُّقِ","الشَّمِّ","السَّمْعِ"],"a":2,"w":"الْعِطْرُ يُشَمُّ. (اجْتِهَادٌ مِنَ النَّصِّ)"},{"q":"(لَوْنُهُ السِّحْرِيُّ أَدْبَرْ) تَدُلُّ عَلَى حَاسَّةِ:","o":["الْبَصَرِ","الشَّمِّ","التَّذَوُّقِ","السَّمْعِ"],"a":0,"w":"اللَّوْنُ يُرَى. (اجْتِهَادٌ مِنَ النَّصِّ)"},{"q":"مِنْ مَظَاهِرِ النَّظَافَةِ فِي دِينِنَا:","o":["أَنَّ الْوُضُوءَ شَرْطٌ لِصِحَّةِ الصَّلَاةِ","إِلْقَاءُ الْقَاذُورَاتِ فِي الطَّرِيقِ","تَرْكُ الْبُسْتَانِ","تَلْوِيثُ الْمَاءِ"],"a":0,"w":"مِنْ مَظَاهِرِ النَّظَافَةِ أَنَّ الْوُضُوءَ شَرْطٌ لِصِحَّةِ الصَّلَاةِ، وَمِنْهَا النَّهْيُ عَنْ إِلْقَاءِ الْقَاذُورَاتِ فِي طَرِيقِ النَّاسِ. (ص١٣٦)"},{"q":"تَرْتِيبُ الْمَوَارِدِ الْمَائِيَّةِ مِنَ الْأَكْبَرِ:","o":["جَدْوَلٌ، نَهْرٌ، بَحْرٌ، مُحِيطٌ","نَهْرٌ، مُحِيطٌ، بَحْرٌ، جَدْوَلٌ","بَحْرٌ، مُحِيطٌ، جَدْوَلٌ، نَهْرٌ","مُحِيطٌ، بَحْرٌ، نَهْرٌ، جَدْوَلٌ"],"a":3,"w":"مَعْلُومَةٌ إِضَافِيَّةٌ."},{"q":"لِمَاذَا تَأَلَّمَتِ الْفَرَاشَةُ؟","o":["لِأَنَّهَا جَاعَتْ","لِأَنَّ كُلَّ شَيْءٍ جَمِيلٍ قَدْ تَغَيَّرَ بِسَبَبِ التَّلَوُّثِ","لِأَنَّ الشِّتَاءَ جَاءَ","لِأَنَّهَا ضَلَّتِ الطَّرِيقَ"],"a":1,"w":"الْمَاءُ صَارَ مُعَكَّرًا، وَالزَّهْرُ ذَهَبَ لَوْنُهُ، وَالرَّحِيقُ مُرًّا."},{"q":"تُنَادِي الْفَرَاشَةُ الْأَطْفَالَ لِأَنَّ النَّظَافَةَ:","o":["تَضُرُّ الْأَزْهَارَ","لَا فَائِدَةَ مِنْهَا","دَلِيلٌ عَلَى رُقِيِّ الْإِنْسَانِ وَحَضَارَتِهِ","لِلْكِبَارِ فَقَطْ"],"a":2,"w":"«فَهِيَ عُنْوَانُ الْحَضَارَةْ»."},{"q":"كَمْ نَوْعًا مِنَ الْمَطَرِ وَرَدَ فِي نَصِّ «الْمَطَرِ»؟","o":["اثْنَانِ","ثَلَاثَةٌ","أَرْبَعَةٌ","خَمْسَةٌ"],"a":1,"w":"التَّصَاعُدِيُّ وَالتَّضَارِيسِيُّ وَالْإِعْصَارِيُّ."},{"q":"الْمَطَرُ التَّصَاعُدِيُّ يُسَمَّى:","o":["مَطَرُ الْجَبْهَاتِ","مَطَرُ التَّضَارِيسِ","مُخِيفُ الْفَلَّاحِ","مَطَرُ السَّهْلِ"],"a":2,"w":"نَصُّ الْفِقْرَةِ."},{"q":"الْمَطَرُ الْإِعْصَارِيُّ يُسَمَّى:","o":["مُخِيفُ الْفَلَّاحِ","بَتْرِيكُور","مَطَرُ الْجِبَالِ","مَطَرُ الْجَبْهَاتِ"],"a":3,"w":"نَصُّ الْفِقْرَةِ."},{"q":"يَكْثُرُ الْمَطَرُ التَّصَاعُدِيُّ فِي الْمَنَاطِقِ:","o":["الِاسْتِوَائِيَّةِ","الْقُطْبِيَّةِ","الْجَبَلِيَّةِ فَقَطْ","الصَّحْرَاوِيَّةِ فَقَطْ"],"a":0,"w":"نَصُّ الْفِقْرَةِ."},{"q":"فِي أَيِّ وَقْتٍ مِنَ الْيَوْمِ يَكْثُرُ الْمَطَرُ التَّصَاعُدِيُّ؟","o":["الْفَجْرِ","الْمَغْرِبِ","الظَّهِيرَةِ","مُنْتَصَفِ اللَّيْلِ"],"a":2,"w":"النَّصُّ: «خَاصَّةً عِنْدَ الظَّهِيرَةِ»."},{"q":"أَيُّ هَذِهِ الْأَشْيَاءِ يَضُرُّهُ الْمَطَرُ التَّصَاعُدِيُّ؟","o":["الْجِبَالُ","الْمَحَاصِيلُ","السُّحُبُ","الرِّيَاحُ"],"a":1,"w":"تَضُرُّ الْمَحَاصِيلَ وَتُفْسِدُ التُّرْبَةَ وَتُغْرِقُ الْأَشْجَارَ."},{"q":"مَا الْعَامِلُ الْمُؤَثِّرُ عَلَى بَيْتِ الْجَدِّ؟","o":["الْبَحْرُ","الصَّحْرَاءُ","الْأَنْهَارُ","التَّضَارِيسُ"],"a":3,"w":"قَالَ الْأَبُ: التَّضَارِيسُ هِيَ الْعَامِلُ الْمُؤَثِّرُ عَلَى بَيْتِ جَدِّكُمْ."},{"q":"مَا الْعَامِلُ الْأَوَّلُ الَّذِي يَزِيدُ أَوْ يُقَلِّلُ الْمَطَرَ؟","o":["الْقُرْبُ أَوِ الْبُعْدُ مِنَ الْمُسَطَّحَاتِ الْمَائِيَّةِ","لَوْنُ الْجِبَالِ","عَدَدُ الْأَشْجَارِ","عَدَدُ الزُّوَّارِ"],"a":0,"w":"نَصُّ الْعَوَامِلِ."},{"q":"مَا الْعَامِلُ الثَّانِي الَّذِي يُؤَثِّرُ فِي كَمِّيَّةِ الْمَطَرِ؟","o":["نِظَامُ هُبُوبِ الرِّيَاحِ","حَرَارَةُ الشَّايِ","لَوْنُ التُّرْبَةِ","فَصْلُ الشِّتَاءِ فَقَطْ"],"a":0,"w":"نَصُّ الْعَوَامِلِ."},{"q":"لِمَاذَا تَتَسَاقَطُ الْأَمْطَارُ عَلَى الْجِبَالِ؟","o":["لِأَنَّ الْجِبَالَ سَاخِنَةٌ","لِأَنَّ الرِّيَاحَ لَا تَصِلُ إِلَيْهَا","لِأَنَّ الرِّيَاحَ الرَّطْبَةَ تَرْتَفِعُ فَيَبْرُدُ هَوَاؤُهَا وَيَتَكَاثَفُ بُخَارُ الْمَاءِ","لِأَنَّ الْجِبَالَ قَرِيبَةٌ مِنَ الْبَحْرِ دَائِمًا"],"a":2,"w":"شَرْحُ الْأَبِ لِتَأْثِيرِ التَّضَارِيسِ."},{"q":"أَيُّ الْمَنَاطِقِ أَكْثَرُ غَزَارَةً بِالْأَمْطَارِ؟","o":["السَّهْلِيَّةُ","الْجَبَلِيَّةُ","الصَّحْرَاوِيَّةُ","السَّاحِلِيَّةُ فَقَطْ"],"a":1,"w":"النَّصُّ: تُعَدُّ الْمَنَاطِقُ الْجَبَلِيَّةُ أَكْثَرَ غَزَارَةً."},{"q":"مَا الِاسْمُ الْعِلْمِيُّ لِرَائِحَةِ الْمَطَرِ؟","o":["كُلُورٌ","تَضَارِيسُ","إِعْصَارٌ","بَتْرِيكُور"],"a":3,"w":"نَصُّ الْكِتَابِ."},{"q":"لِمَاذَا كَسَبْنَا مَحَبَّةَ رَائِحَةِ الْمَطَرِ مِنْ أَجْدَادِنَا كَمَا يَعْتَقِدُ الْعُلَمَاءُ؟","o":["لِأَنَّهَا تُشْبِهُ الْعِطْرَ","لِأَنَّهَا كَانَتْ مُهِمَّةً لَهُمْ، فَالْأَمْطَارُ ضَرُورِيَّةٌ لِرَيِّ الْمَحَاصِيلِ وَتَوْفِيرِ مِيَاهِ الشُّرْبِ","لِأَنَّهُمْ يُحِبُّونَ الشِّتَاءَ","لِأَنَّهَا تَغْسِلُ الْغُبَارَ"],"a":1,"w":"نَصُّ الْفِقْرَةِ."},{"q":"لِمَاذَا تُفْرِزُ النَّبَاتَاتُ الزُّيُوتَ الْعِطْرِيَّةَ فِي الصَّيْفِ؟","o":["لِتَجْذِبَ الطُّيُورَ","لِتَقْتُلَ الْحَشَرَاتِ","لِتُخَفِّفَ مِنْ تَبَخُّرِ الْمَاءِ مِنْ أَوْرَاقِهَا وَتُرْبَتِهَا","لِتَحْمِيَ نَفْسَهَا مِنَ الصَّقِيعِ"],"a":2,"w":"النَّصُّ: تُخَفِّفُ مِنْ تَبَخُّرِ الْمَاءِ وَتُؤَخِّرُ نُمُوَّ الْبُذُورِ."},{"q":"تَتَكَوَّنُ إِحْدَى رَوَائِحِ الْمَطَرِ خِلَالَ:","o":["الْعَوَاصِفِ الرَّعْدِيَّةِ","الظَّهِيرَةِ الْحَارَّةِ","اللَّيْلِ الْهَادِئِ","الْفَجْرِ"],"a":0,"w":"النَّصُّ: خِلَالَ الْعَوَاصِفِ الرَّعْدِيَّةِ."},{"q":"الْعُلَا إِحْدَى مُحَافَظَاتِ مِنْطَقَةِ:","o":["الرِّيَاضِ","الشَّرْقِيَّةِ","الْمَدِينَةِ الْمُنَوَّرَةِ","عَسِيرٍ"],"a":2,"w":"نَصُّ الْعُلَا."},{"q":"إِبْرَاهِيمُ الَّذِي كَتَبَ الرِّسَالَةَ يَدْرُسُ فِي الصَّفِّ:","o":["الثَّالِثِ الِابْتِدَائِيِّ","الرَّابِعِ الِابْتِدَائِيِّ","الْأَوَّلِ الْمُتَوَسِّطِ","السَّادِسِ الِابْتِدَائِيِّ"],"a":1,"w":"نَصُّ الْعُلَا."},{"q":"كَمْ مَرْكَزًا ثَقَافِيًّا فِي الْعُلَا؟","o":["ثَلَاثَةٌ","سَبْعَةٌ","عَشَرَةٌ","خَمْسَةٌ"],"a":3,"w":"النَّصُّ: خَمْسَةُ مَرَاكِزَ ثَقَافِيَّةٍ."},{"q":"أَيُّ مِمَّا يَأْتِي لَيْسَ مِنَ الْمَرَاكِزِ الثَّقَافِيَّةِ فِي الْعُلَا؟","o":["وَاحَةُ الْأَحْسَاءِ","وَاحَةُ دَادَانَ","الْوَاحَةُ النَّبَطِيَّةُ","مَدِينَةُ الْحِجْرِ الْأَثَرِيَّةُ"],"a":0,"w":"الْمَرَاكِزُ الْخَمْسَةُ: وَاحَةُ الْبَلْدَةِ الْقَدِيمَةِ، دَادَانُ، جَبَلُ عِكْمَةَ، النَّبَطِيَّةُ، مَدِينَةُ الْحِجْرِ."},{"q":"كَمْ طُولُ الْقِطَارِ السِّيَاحِيِّ فِي الْعُلَا؟","o":["٢٠ كلم","٤٦ كلم","٦٠ كلم","٤ كلم"],"a":1,"w":"النَّصُّ: بِطُولِ ٤٦ كلم، أَيْ ٤٦ كِيلُو مِتْرًا."},{"q":"مَعْنَى «مُوغِلَةٍ» فِي قَوْلِهِ «الْمَمَالِكُ الْعَرَبِيَّةُ الْمُوغِلَةُ فِي الْقِدَمِ»:","o":["مُتَعَمِّقَةٌ","مُتَلَوِّنَةٌ","مُتَفَرِّعَةٌ","مُتَطَوِّرَةٌ"],"a":0,"w":"الْمُوغِلَةُ فِي الْقِدَمِ: الْمُتَعَمِّقَةُ فِيهِ."},{"q":"رُؤْيَةُ الْمَمْلَكَةِ الَّتِي تَتَمَاشَى مَعَهَا أَعْمَالُ الْهَيْئَةِ الْمَلَكِيَّةِ لِلْعُلَا هِيَ:","o":["رُؤْيَةُ ٢٠٢٠","رُؤْيَةُ ٢٠٥٠","رُؤْيَةُ ٢٠٣٠","رُؤْيَةُ ٢٠١٠"],"a":2,"w":"النَّصُّ: تَمَاشِيًا مَعَ أَهْدَافِ رُؤْيَةِ ٢٠٣٠."},{"q":"حَوِّلِي «إِبْرَاهِيمُ يَدْرُسُ فِي الصَّفِّ الرَّابِعِ» إِلَى جُمْلَةٍ فِعْلِيَّةٍ:","o":["إِبْرَاهِيمُ فِي الصَّفِّ الرَّابِعِ يَدْرُسُ","دَرَسَ الصَّفُّ إِبْرَاهِيمَ","الصَّفُّ يَدْرُسُ إِبْرَاهِيمَ","يَدْرُسُ إِبْرَاهِيمُ فِي الصَّفِّ الرَّابِعِ"],"a":3,"w":"نَبْدَأُ بِالْفِعْلِ."},{"q":"أَيُّ الْأَسْمَاءِ الْآتِيَةِ مُؤَنَّثٌ؟","o":["فَصْلٌ","طَالِبٌ","صُورَةٌ","سَعِيدٌ"],"a":2,"w":"«صُورَةٌ» فِيهَا تَاءٌ مَرْبُوطَةٌ."},{"q":"أَيُّ الْأَسْمَاءِ الْآتِيَةِ مُذَكَّرٌ؟","o":["الْحَرَارَةُ","الْفَصْلُ","صُورَةٌ","الطَّبِيعِيَّةُ"],"a":1,"w":"«الْفَصْلُ» مُذَكَّرٌ."},{"q":"أَمْرُ الْفِعْلِ «كَتَبَ» هُوَ:","o":["يَكْتُبُ","كَاتِبٌ","كِتَابَةٌ","اكْتُبْ"],"a":3,"w":"مِنْ «كَتَبَ فِيهَا» فِي نَصِّ الْعُلَا، وَأَمْرُهُ: اُكْتُبْ."},{"q":"أَمْرُ الْفِعْلِ الْمُضَارِعِ «يَدْرُسُ» هُوَ:","o":["ادْرُسْ","دَرَسَ","دَارِسٌ","مَدْرَسَةٌ"],"a":0,"w":"مِنْ نَصِّ الْعُلَا: يَدْرُسُ ← اُدْرُسْ."},{"q":"فِي «تَحَرَّكَ عَلَاءٌ فِي أَرْجَاءِ الْمَدْرَسَةِ»، أَيُّ كَلِمَةٍ تَحْوِي هَمْزَةَ وَصْلٍ؟","o":["عَلَاءٌ","الْمَدْرَسَةِ","أَرْجَاءِ","تَحَرَّكَ"],"a":1,"w":"«الْ» فِي أَوَّلِ «الْمَدْرَسَةِ» هَمْزَةُ وَصْلٍ، أَمَّا «أَرْجَاءِ» فَهَمْزَتُهَا قَطْعٌ فِي أَوَّلِهَا وَمُتَطَرِّفَةٌ فِي آخِرِهَا."},{"q":"ذَهَبَ النَّبِيُّ - صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ - إِلَى الطَّائِفِ ...........","o":["لِزِيَارَةِ أَقَارِبِهِ","لَعَلَّهُ يَجِدُ مَنْ يَنْصُرُهُ","لِلنُّزْهَةِ","لِيَتَمَتَّعَ بِهَوَائِهَا"],"a":1,"w":"النَّصُّ: لَعَلَّهُ يَجِدُ مَنْ يَنْصُرُهُ هُنَاكَ."},{"q":"الْقَصْرُ الَّذِي كَانَ مَقَرًّا لِإِقَامَةِ الْمَلِكِ عَبْدِ الْعَزِيزِ بِالطَّائِفِ هُوَ:","o":["قَصْرُ الْمُصْمَكِ","قَصْرُ سَلْوَى","قَصْرُ الْبَرَكَةِ","قَصْرُ شُبْرَا"],"a":3,"w":"النَّصُّ: قَصْرُ شُبْرَا."},{"q":"سَكَنَتْ قَبِيلَةُ ........ الطَّائِفَ قَبْلَ الْإِسْلَامِ.","o":["قُرَيْشٍ","ثَقِيفٍ","عَبْسٍ","مُضَرَ"],"a":1,"w":"النَّصُّ: مِنْ قَبِيلَةِ ثَقِيفٍ."},{"q":"مِنْ أَشْهَرِ أَسْوَاقِ الْعَرَبِ الَّتِي كَانَتْ تُقَامُ فِي الطَّائِفِ:","o":["سُوقُ كُنَاسَةَ","سُوقُ الْمَجَازِ","سُوقُ مَجَنَّةَ","سُوقُ عُكَاظٍ"],"a":3,"w":"النَّصُّ: سُوقُ عُكَاظٍ."},{"q":"تَضُمُّ الطَّائِفُ ........ مِنْ مَوَاقِيتِ الْحَجِّ وَالْعُمْرَةِ.","o":["مِيقَاتَيْنِ","مِيقَاتًا وَاحِدًا","ثَلَاثَةَ مَوَاقِيتَ","أَرْبَعَةَ مَوَاقِيتَ"],"a":0,"w":"النَّصُّ: مِيقَاتَيْنِ (السَّيْلُ الْكَبِيرُ وَوَادِي مَحْرَمٍ)."},{"q":"أَفْضَلُ وَقْتٍ لِزِيَارَةِ مَدِينَةِ الطَّائِفِ فَصْلُ:","o":["الرَّبِيعِ","الصَّيْفِ","الْخَرِيفِ","الشِّتَاءِ"],"a":1,"w":"النَّصُّ: مُنَاخٌ مُعْتَدِلٌ فِي فَصْلِ الصَّيْفِ."},{"q":"يَغْلِبُ عَلَى أَهْلِ الطَّائِفِ الْمَيْلُ إِلَى .........","o":["الصِّنَاعَةِ","الزِّرَاعَةِ","التِّجَارَةِ","السَّفَرِ"],"a":1,"w":"النَّصُّ: تَشْتَهِرُ الطَّائِفُ بِزِرَاعَةِ الْعِنَبِ وَالرُّمَّانِ وَغَيْرِهِمَا."},{"q":"أَيْنَ كَانَتْ تَقِفُ الشَّجَرَةُ الْعَجُوزُ؟","o":["فِي الْبَحْرِ","فِي وَسَطِ الْمَدِينَةِ","عَلَى أَطْرَافِ الْقَرْيَةِ","بِجَانِبِ النَّهْرِ"],"a":2,"w":"النَّصُّ: «شَجَرَةٌ عَجُوزٌ عَلَى أَطْرَافِ الْقَرْيَةِ»."},{"q":"مَاذَا حَدَثَ لِلْبِيئَةِ مَعَ مُرُورِ السِّنِينَ؟","o":["بَقِيَتْ كَمَا هِيَ دُونَ تَغْيِيرٍ","تَقَدَّمَتْ وَازْدَهَرَتْ","ازْدَادَتْ جَمَالًا وَصَفَاءً","تَلَوَّثَ الْهَوَاءُ وَانْتَشَرَتِ الْقُمَامَةُ"],"a":3,"w":"النَّصُّ: «انْتَشَرَتِ الْقُمَامَةُ، وَالْهَوَاءُ... أَصْبَحَ مُلَوَّثًا»."},{"q":"كَيْفَ عَبَّرَتِ الشَّجَرَةُ عَنْ حَاجَتِهَا لِلْمُسَاعَدَةِ؟","o":["بِإِرْسَالِ الطُّيُورِ إِلَيْهِمْ","بِالْبُكَاءِ","بِإِسْقَاطِ أَوْرَاقِهَا الصَّفْرَاءِ كَرِسَالَةٍ","بِالْكَلَامِ مَعَ الْأَطْفَالِ"],"a":2,"w":"اصْفَرَّتْ أَوْرَاقُهَا وَتَسَاقَطَتْ، وَكَأَنَّهَا رِسَالَةٌ."},{"q":"مُرَادِفُ كَلِمَةِ «الْحِفَاظِ»:","o":["التَّفْرِيطُ","الْحِمَايَةُ","الْهَدْمُ","الْإِهْمَالُ"],"a":1,"w":"«الْحِفَاظُ» مَعْنَاهُ «الْحِمَايَةُ»."},{"q":"لِمَاذَا قَرَّرَ الْأَطْفَالُ تَنْظِيفَ الْحَدِيقَةِ وَالِاعْتِنَاءَ بِالشَّجَرَةِ؟","o":["لِأَنَّهُمْ فَهِمُوا رِسَالَةَ الشَّجَرَةِ","لِأَنَّهُمْ أَطْفَالٌ صِغَارٌ","لِأَنَّ الشَّجَرَةَ أَعْطَتْهُمْ ثِمَارًا","لِأَنَّ أَهْلَ الْقَرْيَةِ طَلَبُوا مِنْهُمْ ذَلِكَ"],"a":0,"w":"النَّصُّ: «رَأَى الْأَطْفَالُ الْأَوْرَاقَ، وَفَهِمُوا مَعْنَى رِسَالَةِ الشَّجَرَةِ»."},{"q":"مَا الَّذِي يَدُلُّ عَلَى عَوْدَةِ الْحَيَاةِ إِلَى الشَّجَرَةِ؟","o":["فَرَحُهَا وَسُرُورُهَا","نُمُوُّ أَوْرَاقٍ جَدِيدَةٍ خَضْرَاءَ","ذُبُولُ أَغْصَانِهَا","سُقُوطُ أَوْرَاقِهَا"],"a":1,"w":"النَّصُّ: «بَدَأَتْ أَوْرَاقُ الشَّجَرَةِ... تَنْبُتُ وَتَخْضَرُّ»."},{"q":"مَا الْفِكْرَةُ الرَّئِيسَةُ الَّتِي يُرِيدُ النَّصُّ أَنْ يُوصِلَهَا؟","o":["حِمَايَةُ الْبِيئَةِ مَسْؤُولِيَّةُ الْجَمِيعِ","اللَّعِبُ فِي الْحَدِيقَةِ مُمْتِعٌ","الشَّجَرَةُ كَانَتْ حَزِينَةً","سَعَادَةُ الْأَطْفَالِ"],"a":0,"w":"الْفِكْرَةُ الرَّئِيسَةُ: حِمَايَةُ الْبِيئَةِ مَسْؤُولِيَّةُ الْجَمِيعِ."},{"q":"وَجَدَ أُسَامَةُ السَّاعَةَ فِي ........","o":["الْفَصْلِ","الْبَيْتِ","الشَّارِعِ","فِنَاءِ الْمَدْرَسَةِ"],"a":3,"w":"النَّصُّ: «يَلْعَبُ مَعَ أَصْدِقَائِهِ فِي فِنَاءِ الْمَدْرَسَةِ»."},{"q":"الصِّفَةُ الَّتِي اتَّصَفَ بِهَا أُسَامَةُ صِفَةُ ........","o":["الذَّكَاءِ","الصِّدْقِ","الْأَمَانَةِ","الْوَفَاءِ"],"a":2,"w":"شَكَرَهُ الْمُعَلِّمُ عَلَى أَمَانَتِهِ."},{"q":"لُقِّبَ النَّبِيُّ -صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ- قَبْلَ الْبَعْثَةِ بِـ ........","o":["الذَّكِيِّ الْأَمِينِ","الصَّادِقِ الْأَمِينِ","الصَّادِقِ فَقَطْ","الْأَمِينِ فَقَطْ"],"a":1,"w":"النَّصُّ: «قَبْلَ الْبَعْثَةِ بِالصَّادِقِ الْأَمِينِ»."},{"q":"الَّذِي أَمَرَهُ النَّبِيُّ -صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ- أَنْ يَتَأَخَّرَ بَعْدَهُ فِي الْهِجْرَةِ هُوَ ........","o":["عُمَرُ بْنُ الْخَطَّابِ","أَبُو بَكْرٍ الصِّدِّيقُ","عَمْرُو بْنُ الْعَاصِ","عَلِيُّ بْنُ أَبِي طَالِبٍ"],"a":3,"w":"النَّصُّ: «أَمَرَ عَلِيًّا بْنَ أَبِي طَالِبٍ أَنْ يَتَأَخَّرَ»."},{"q":"ضِدُّ كَلِمَةِ (الْأَمِينِ):","o":["الشُّجَاعُ","الْخَائِنُ","الظَّالِمُ","الْكَاذِبُ"],"a":1,"w":"ضِدُّ «الْأَمِينِ»: «الْخَائِنُ»."},{"q":"مَا اسْمُ الدُّودَةِ الَّتِي أَخَذَتْهَا نُورَةُ؟","o":["الْفَرَاشَةُ","دُودَةُ الْقَزِّ","الشَّرْنَقَةُ"],"a":1,"w":"النَّصُّ: «إِنَّ هَذِهِ الدُّودَةَ تُسَمَّى دُودَةَ الْقَزِّ»."},{"q":"زَارَتْ نُورَةُ جَدَّهَا فِي فَصْلِ ........","o":["الْخَرِيفِ","الصَّيْفِ","الرَّبِيعِ","الشِّتَاءِ"],"a":2,"w":"النَّصُّ: «فِي فَصْلِ الرَّبِيعِ»."},{"q":"انْبَهَرَتْ نُورَةُ بِجَمَالِ ........","o":["الْحَقْلِ","الْعُصْفُورِ","الْجَدِّ","الْفَرَاشَةِ"],"a":3,"w":"النَّصُّ: «وَهِيَ مُنْبَهِرَةٌ بِجَمَالِهَا» أَيْ جَمَالِ الْفَرَاشَةِ."},{"q":"تَتَغَذَّى دُودَةُ الْقَزِّ عَلَى وَرَقِ ........","o":["الْخَوْخِ","الْكَرْتُونِ","الْبَرْدِيِّ","التُّوتِ"],"a":3,"w":"النَّصُّ: «وَأَوْصَاهَا بِإِطْعَامِهَا وَرَقَ التُّوتِ»."},{"q":"وَضَعَ الْجَدُّ الدُّودَةَ فِي صُنْدُوقٍ بِغِطَائِهِ بَعْضُ ........","o":["الْخُيُوطِ","اللَّعِبِ","الطَّعَامِ","الْفَتَحَاتِ"],"a":3,"w":"النَّصُّ: «بِغِطَائِهِ بَعْضُ الثُّقُوبِ»، وَالثُّقُوبُ هِيَ الْفَتَحَاتُ."},{"q":"تَنْسُجُ دُودَةُ الْقَزِّ حَوْلَ نَفْسِهَا خُيُوطًا مِنَ ........","o":["الْكَتَّانِ","الْوَرَقِ","الْحَرِيرِ","الصُّوفِ"],"a":2,"w":"النَّصُّ: «شَرْنَقَةٍ مِنْ خُيُوطِ الْحَرِيرِ»."},{"q":"تَتَحَوَّلُ دُودَةُ الْقَزِّ إِلَى فَرَاشَةٍ بَعْدَ ........","o":["يَوْمَيْنِ","شَهْرَيْنِ","يَوْمٍ وَاحِدٍ","أُسْبُوعَيْنِ"],"a":3,"w":"النَّصُّ: «بَعْدَ مُرُورِ أُسْبُوعَيْنِ»."},{"q":"مَعْنَى «تَجَوُّلِهَا»:","o":["تَنَقُّلِهَا","جُلُوسِهَا","نَوْمِهَا","تَوَقُّفِهَا"],"a":0,"w":"«تَجَوُّلُهَا» أَيْ «تَنَقُّلُهَا»."},{"q":"اخْتَرِ الْوَصْفَ الصَّحِيحَ لِحَالِ الْفَرَاشَةِ وَهِيَ تَتَجَوَّلُ بَيْنَ الْأَزْهَارِ قَبْلَ تَلَوُّثِ الْبِيئَةِ الَّتِي كَانَتْ تَعِيشُ فِيهَا.","o":["كَانَتْ تَلْعَبُ حَوْلَ الْوُرُودِ وَتَمْتَصُّ الرَّحِيقَ الصَّافِيَ الْعَذْبَ","كَانَتْ تَتَأَلَّمُ وَتَقُولُ «آهٍ»","كَانَتْ تَشْرَبُ الْمَاءَ الْمُعَكَّرَ"],"a":0,"w":"النَّصُّ: «كُنْتُ أَلْهُو فِي رَخَاءٍ حَوْلَ وَرْدٍ»، وَ«كُنْتُ أَمْتَصُّ رَحِيقًا صَافِيًا عَذْبًا»."},{"q":"الْكَلِمَةُ الْمُخْتَلِفَةُ هِيَ كَلِمَةُ:","o":["عَذْبٌ","صَافٍ","مُعَكَّرٌ","نَقِيٌّ"],"a":2,"w":"«مُعَكَّرٌ» عَكْسُ مَعْنَى الْكَلِمَاتِ الْأُخْرَى."},{"q":"كَلِمَةُ (آهٍ) تَدُلُّ عَلَى:","o":["التَّعَجُّبِ","التَّأَلُّمِ","الْغَضَبِ","الرِّضَا"],"a":1,"w":"«آهٍ» تَدُلُّ عَلَى التَّأَلُّمِ."},{"q":"يَتَمَيَّزُ نَبَاتُ الْحَنْظَلِ بِأَنَّهُ:","o":["كَثِيرُ الْحَلَاوَةِ","شَدِيدُ الْمَرَارَةِ","شَدِيدُ الْحُمُوضَةِ","شَدِيدُ الْمُلُوحَةِ"],"a":1,"w":"الْحَنْظَلُ نَبَاتٌ طَعْمُهُ شَدِيدُ الْمَرَارَةِ."},{"q":"مَعْنَى كَلِمَةِ (أَتَجَوَّلُ):","o":["أَتَنَقَّلُ","أَنَامُ","أَجْرِي","أَجْلِسُ"],"a":0,"w":"«أَتَجَوَّلُ» أَيْ «أَتَنَقَّلُ»."},{"q":"الصُّورَةُ ١ فِيهَا شَارِعٌ فِي حَيٍّ نَظِيفٍ. أَيُّ كَلِمَةٍ تَدُلُّ عَلَيْهَا؟","o":["بِيئَةٌ نَظِيفَةٌ","غِذَاءٌ صِحِّيٌّ مُتَوَازِنٌ","عَادَاتٌ صِحِّيَّةٌ","رُمُوزُ أَحْوَالِ الطَّقْسِ"],"a":0,"w":"الصُّورَةُ ١ شَارِعٌ نَظِيفٌ أَمَامَ الْبُيُوتِ، فَهِيَ «بِيئَةٌ نَظِيفَةٌ»."},{"q":"الصُّورَةُ ٢ فِيهَا طِفْلٌ يَرْكَبُ دَرَّاجَةً فِي حَدِيقَةٍ. أَيُّ كَلِمَةٍ تَدُلُّ عَلَيْهَا؟","o":["بِيئَةٌ نَظِيفَةٌ","غِذَاءٌ صِحِّيٌّ مُتَوَازِنٌ","رُمُوزُ أَحْوَالِ الطَّقْسِ","عَادَاتٌ صِحِّيَّةٌ"],"a":3,"w":"رُكُوبُ الدَّرَّاجَةِ وَالرِّيَاضَةُ مِنَ «الْعَادَاتِ الصِّحِّيَّةِ»."},{"q":"الصُّورَةُ ٣ فِيهَا سُحُبٌ وَشَمْسٌ وَقَمَرٌ وَثَلْجٌ. أَيُّ كَلِمَةٍ تَدُلُّ عَلَيْهَا؟","o":["بِيئَةٌ نَظِيفَةٌ","رُمُوزُ أَحْوَالِ الطَّقْسِ","عَادَاتٌ صِحِّيَّةٌ","غِذَاءٌ صِحِّيٌّ مُتَوَازِنٌ"],"a":1,"w":"هَذِهِ رُمُوزٌ تَدُلُّ عَلَى حَالَةِ الْجَوِّ، فَهِيَ «رُمُوزُ أَحْوَالِ الطَّقْسِ»."},{"q":"الصُّورَةُ ٤ فِيهَا فَطِيرَةٌ وَتُفَّاحَةٌ وَبَيْضٌ وَحَلِيبٌ. أَيُّ كَلِمَةٍ تَدُلُّ عَلَيْهَا؟","o":["رُمُوزُ أَحْوَالِ الطَّقْسِ","بِيئَةٌ نَظِيفَةٌ","عَادَاتٌ صِحِّيَّةٌ","غِذَاءٌ صِحِّيٌّ مُتَوَازِنٌ"],"a":3,"w":"وَجْبَةٌ فِيهَا أَنْوَاعٌ مُخْتَلِفَةٌ مِنَ الطَّعَامِ، فَهِيَ «غِذَاءٌ صِحِّيٌّ مُتَوَازِنٌ»."},{"q":"مِنْ أَيِّ سُورَةٍ الْآيَةُ الَّتِي تَدَبَّرْنَاهَا؟","o":["سُورَةُ الْأَنْعَامِ","سُورَةُ الْبَقَرَةِ","سُورَةُ الْكَهْفِ","سُورَةُ يَسْ"],"a":0,"w":"الْحَاشِيَةُ فِي الْكِتَابِ: سُورَةُ الْأَنْعَامِ، الْآيَةُ رَقْمُ ٩٩."},{"q":"مَا النِّعْمَةُ الَّتِي «بِدُونِهَا لَا تَحْيَا الْكَائِنَاتُ» وَقِيلَ عَنْهَا: أَغْلَى مَفْقُودٍ وَأَرْخَصُ مَوْجُودٍ؟","o":["الْمَاءُ","الذَّهَبُ","الْخُبْزُ","الثِّمَارُ"],"a":0,"w":"الْآيَةُ تَبْدَأُ بِإِنْزَالِ الْمَاءِ مِنَ السَّمَاءِ، وَبِهِ خَرَجَ النَّبَاتُ. فَالنِّعْمَةُ هِيَ الْمَاءُ."},{"q":"أَيُّ مِمَّا يَأْتِي لَمْ يُذْكَرْ فِي الْآيَةِ مِنَ الْأَطْعِمَةِ؟","o":["الرُّمَّانُ","الزَّيْتُونُ","الْعِنَبُ","الْمَوْزُ"],"a":3,"w":"الْآيَةُ ذَكَرَتِ الْحَبَّ وَالنَّخْلَ وَالْعِنَبَ وَالزَّيْتُونَ وَالرُّمَّانَ، وَلَمْ تَذْكُرِ الْمَوْزَ."},{"q":"«قِنْوَانٌ دَانِيَةٌ» تَخْرُجُ مِنْ شَجَرَةِ:","o":["الزَّيْتُونِ","النَّخْلِ","الْعِنَبِ","الرُّمَّانِ"],"a":1,"w":"قَالَ اللهُ: ﴿وَمِنَ النَّخْلِ مِن طَلْعِهَا قِنْوَانٌ دَانِيَةٌ﴾."},{"q":"مَا الَّذِي أَنْزَلَهُ اللهُ مِنَ السَّمَاءِ فَأَخْرَجَ بِهِ نَبَاتَ كُلِّ شَيْءٍ؟","o":["ثَلْجًا","رِيحًا","مَاءً","نُورًا"],"a":2,"w":"﴿أَنزَلَ مِنَ السَّمَاءِ مَاءً فَأَخْرَجْنَا بِهِ نَبَاتَ كُلِّ شَيْءٍ﴾."},{"q":"النَّادِلُ هُوَ:","o":["صَاحِبُ الْمَطْعَمِ","مُقَدِّمُ الطَّعَامِ","عَامِلُ النَّظَافَةِ","الْمُحَاسِبُ"],"a":1,"w":"النَّادِلُ هُوَ مَنْ يُقَدِّمُ الطَّعَامَ لِلزَّبَائِنِ فِي الْمَطْعَمِ."},{"q":"تَعَلَّمَ مَاجِدٌ حِفْظَ النِّعْمَةِ مِنْ:","o":["أَبِيهِ","صَدِيقِهِ","مُعَلِّمِهِ","أُخْتِهِ"],"a":0,"w":"قَالَ مَاجِدٌ: «وَقَدْ رَبَّانِي أَبِي عَلَى ذَلِكَ»."},{"q":"مَاذَا يَفْعَلُ مَاجِدٌ بِالطَّعَامِ النَّظِيفِ بَعْدَ الِانْتِهَاءِ مِنَ الْوَجْبَةِ؟","o":["يَرْمِيهِ","يَتْرُكُهُ عَلَى الطَّاوِلَةِ","يَتَصَدَّقُ بِهِ عَلَى مَنْ يَحْتَاجُهُ","يَأْخُذُهُ لِلنَّادِلِ"],"a":2,"w":"قَالَ: نَأْخُذُ الطَّعَامَ النَّظِيفَ لِنَتَصَدَّقَ بِهِ عَلَى مَنْ يَحْتَاجُهُ."},{"q":"أَيْنَ يَضَعُ مَاجِدٌ بَقَايَا الطَّعَامِ؟","o":["فِي الْمَطْبَخِ","فِي الشَّارِعِ","فِي سَيَّارَتِهِ","فِي مَكَانٍ مُنَاسِبٍ لِتَأْكُلَهُ الْبَهَائِمُ"],"a":3,"w":"قَالَ: نَضَعُ بَقَايَا الطَّعَامِ فِي مَكَانٍ مُنَاسِبٍ لِتَأْكُلَهُ الْبَهَائِمُ."},{"q":"مَنِ الَّذِي قَالَ: «تَنْظِيفُ الْمَكَانِ دَوْرُ عَامِلِ النَّظَافَةِ، وَلَيْسَ مَسْؤُولِيَّتَنَا»؟","o":["مَاجِدٌ","أَيْمَنُ","النَّادِلُ","أَبُو مَاجِدٍ"],"a":1,"w":"قَالَهُ أَيْمَنُ، فَرَدَّ عَلَيْهِ مَاجِدٌ: «كُلُّنَا مَسْؤُولٌ يَا أَيْمَنُ»."},{"q":"أَرْسُمِي دَائِرَةً حَوْلَ الْكَلِمَةِ الْمُخْتَلِفَةِ: تُفَّاحَةٌ، كُمَّثْرَى، خُبْزٌ، تِينٌ","o":["تُفَّاحَةٌ","كُمَّثْرَى","تِينٌ","خُبْزٌ"],"a":3,"w":"التُّفَّاحَةُ وَالْكُمَّثْرَى وَالتِّينُ فَوَاكِهُ، أَمَّا الْخُبْزُ فَلَيْسَ فَاكِهَةً."},{"q":"الْكَلِمَةُ الْمُخْتَلِفَةُ: الْمُبِيدَاتُ، عَوَادِمُ السَّيَّارَاتِ، النَّبَاتَاتُ، النُّفَايَاتُ","o":["الْمُبِيدَاتُ","عَوَادِمُ السَّيَّارَاتِ","النَّبَاتَاتُ","النُّفَايَاتُ"],"a":2,"w":"الْمُبِيدَاتُ وَالْعَوَادِمُ وَالنُّفَايَاتُ تُلَوِّثُ الْبِيئَةَ، أَمَّا النَّبَاتَاتُ فَتُفِيدُ الْبِيئَةَ."},{"q":"الْكَلِمَةُ الْمُخْتَلِفَةُ: مَشْرُوبَاتٌ غَازِيَّةٌ، عَصِيرٌ طَازَجٌ، خَضْرَاوَاتٌ، سَمَكٌ","o":["مَشْرُوبَاتٌ غَازِيَّةٌ","عَصِيرٌ طَازَجٌ","خَضْرَاوَاتٌ","سَمَكٌ"],"a":0,"w":"الْعَصِيرُ وَالْخَضْرَاوَاتُ وَالسَّمَكُ أَغْذِيَةٌ صِحِّيَّةٌ، أَمَّا الْمَشْرُوبَاتُ الْغَازِيَّةُ فَلَيْسَتْ صِحِّيَّةً."},{"q":"تَنْظِيفُ الْمَكَانِ بَعْدَ الْأَكْلِ مَسْؤُولِيَّةُ:","o":["كُلُّنَا","عَامِلِ النَّظَافَةِ فَقَطْ","النَّادِلِ فَقَطْ","أَيْمَنَ فَقَطْ"],"a":0,"w":"قَالَ مَاجِدٌ: «كُلُّنَا مَسْؤُولٌ»."},{"q":"مِنْ تَصَرُّفَاتِ مَاجِدٍ الْإِيجَابِيَّةِ بَعْدَ الْوَجْبَةِ:","o":["تَرْكُ الطَّعَامِ عَلَى الطَّاوِلَةِ","رَمْيُ بَقَايَا الطَّعَامِ فِي الشَّارِعِ","أَخْذُ الطَّعَامِ النَّظِيفِ لِلتَّصَدُّقِ بِهِ","الْمُغَادَرَةُ دُونَ اهْتِمَامٍ"],"a":2,"w":"هَذَا مَا ذَكَرَهُ مَاجِدٌ فِي الْحِوَارِ."},{"q":"أُدْخِلُ الْوَاوَ عَلَى «إِذَا» فَأَقُولُ «وَإِذَا». مَاذَا حَدَثَ لِلْهَمْزَةِ؟","o":["اخْتَفَتْ فِي النُّطْقِ","تَغَيَّرَتْ إِلَى أَلِفٍ فَقَطْ","ظَهَرَتْ فِي النُّطْقِ"],"a":2,"w":"إِذَا ظَهَرَتِ الْهَمْزَةُ فِي النُّطْقِ فَهِيَ هَمْزَةُ قَطْعٍ."},{"q":"أُدْخِلُ الْوَاوَ عَلَى «اكْتُبْ» فَأَقُولُ «وَاكْتُبْ». مَاذَا حَدَثَ لِلْهَمْزَةِ؟","o":["اخْتَفَتْ فِي النُّطْقِ","ظَهَرَتْ فِي النُّطْقِ","صَارَتْ مَكْسُورَةً"],"a":0,"w":"إِذَا اخْتَفَتِ الْهَمْزَةُ فِي النُّطْقِ فَهِيَ هَمْزَةُ وَصْلٍ."},{"q":"أَيُّ الْكَلِمَاتِ الْآتِيَةِ تَسْقُطُ هَمْزَتُهَا عِنْدَ دُخُولِ الْوَاوِ عَلَيْهَا؟","o":["أَقْبَلَ","اِسْتَقْبَلَ","أَسْرَعَ"],"a":1,"w":"نَقُولُ: وَاسْتَقْبَلَ، فَلَا تُنْطَقُ الْهَمْزَةُ، فَهِيَ وَصْلٌ. أَمَّا أَقْبَلَ وَأَسْرَعَ فَتَظْهَرُ هَمْزَتُهُمَا."},{"q":"أَيُّ الْكَلِمَاتِ تَظْهَرُ هَمْزَتُهَا بَعْدَ الْوَاوِ؟","o":["الْعَرَقُ","إِلَى","اِبْتَسَمَ","السَّحَابُ"],"a":1,"w":"نَقُولُ: وَإِلَى، فَتَظْهَرُ الْهَمْزَةُ، فَهِيَ قَطْعٌ."},{"q":"مَا نَوْعُ هَمْزَةِ (الْ) التَّعْرِيفِ فِي «الْكِتَابُ»؟","o":["قَطْعٌ","لَا هَمْزَةَ فِيهَا","وَصْلٌ"],"a":2,"w":"هَمْزَةُ الْوَصْلِ تُوجَدُ فِي (الْ) التَّعْرِيفِ."},{"q":"أَيُّ الْحُرُوفِ الْآتِيَةِ هَمْزَتُهُ وَصْلٌ؟","o":["إِنْ","أَوْ","الْ","أَمْ"],"a":2,"w":"مِنَ الْحُرُوفِ، (الْ) التَّعْرِيفِ فَقَطْ هَمْزَتُهَا وَصْلٌ. وَبَاقِي الْحُرُوفِ هَمْزَتُهَا قَطْعٌ."},{"q":"كَيْفَ أَكْتُبُ هَمْزَةَ «اِنْطَلَقَ» ؟","o":["أَ","ا بِلَا هَمْزَةٍ","إِ"],"a":1,"w":"هَمْزَةُ وَصْلٍ فَتُرْسَمُ أَلِفًا بِلَا هَمْزَةٍ."},{"q":"كَيْفَ أَكْتُبُ هَمْزَةَ «أُخْتٌ» ؟","o":["أُ","ا بِلَا هَمْزَةٍ","إِ"],"a":0,"w":"هَمْزَةُ قَطْعٍ مَضْمُومَةٌ تُكْتَبُ (أُ)."},{"q":"كَيْفَ أَكْتُبُ هَمْزَةَ «إِنْسَانٌ» ؟","o":["ا بِلَا هَمْزَةٍ","إِ","أَ"],"a":1,"w":"هَمْزَةُ قَطْعٍ مَكْسُورَةٌ تُكْتَبُ (إِ) أَيْ أَلِفًا تَحْتَهَا هَمْزَةٌ."},{"q":"كَيْفَ أَكْتُبُ هَمْزَةَ «أَنْ» ؟","o":["أَ","ا بِلَا هَمْزَةٍ","إِ"],"a":0,"w":"هَمْزَةُ قَطْعٍ مَفْتُوحَةٌ تُكْتَبُ (أَ)."},{"q":"كَيْفَ أَكْتُبُ هَمْزَةَ «اِسْتَقْبَلَ» ؟","o":["أَ","إِ","ا بِلَا هَمْزَةٍ"],"a":2,"w":"نَقُولُ: وَاسْتَقْبَلَ، فَتَخْتَفِي الْهَمْزَةُ، فَهِيَ وَصْلٌ."},{"q":"كَيْفَ أَكْتُبُ هَمْزَةَ «أَسْرَعَ» ؟","o":["ا بِلَا هَمْزَةٍ","إِ","أَ"],"a":2,"w":"نَقُولُ: وَأَسْرَعَ، فَتَظْهَرُ الْهَمْزَةُ، فَهِيَ قَطْعٌ مَفْتُوحَةٌ."},{"q":"أَيُّ الْكِتَابَاتِ الْآتِيَةِ صَحِيحَةٌ لِكَلِمَةٍ مَعْنَاهَا: يَتَجَرَّأُ وَلَا يَخَافُ؟","o":["يَجْرُؤُ","يَجْرُأُ","يَجْرُئُ","يَجْرُءُ"],"a":0,"w":"الرَّاءُ مَضْمُومَةٌ، فَتُكْتَبُ الْهَمْزَةُ عَلَى الْوَاوِ."},{"q":"أَيُّ الْكِتَابَاتِ الْآتِيَةِ صَحِيحَةٌ لِكَلِمَةٍ مَعْنَاهَا: يَتَأَخَّرُ وَلَا يُسْرِعُ؟","o":["يَتَبَاطُؤُ","يَتَبَاطِئُ","يَتَبَاطَءُ","يَتَبَاطَأُ"],"a":3,"w":"الط
