هُوَ مَفْعُولٌ بِهِ مَنْصُوبٌ بِالْفَتْحَةِ."},{"q":"أَعَانَ الْمُسْلِمُ الْفَقِيرَ. إِعْرَابُ «الْفَقِيرَ»:","o":["فَاعِلٌ مَرْفُوعٌ","خَبَرٌ مَرْفُوعٌ","مَفْعُولٌ بِهِ مَنْصُوبٌ وَعَلَامَةُ نَصْبِهِ الْفَتْحَةُ الظَّاهِرَةُ عَلَى آخِرِهِ"],"a":2,"w":"«الْفَقِيرُ» وَقَعَ عَلَيْهِ فِعْلُ الْإِعَانَةِ، فَهُوَ مَفْعُولٌ بِهِ مَنْصُوبٌ."},{"q":"أَيُّ هَذِهِ الْحُرُوفِ يَرْتَكِزُ عَلَى السَّطْرِ؟","o":["ن","ي","ص","د"],"a":3,"w":"الدَّالُ مِنَ الْحُرُوفِ الْمُرْتَكِزَةِ: أ، ب، د، ط، ف، ك."},{"q":"أَيُّ هَذِهِ الْحُرُوفِ يَنْزِلُ جُزْءٌ مِنْهُ أَسْفَلَ السَّطْرِ؟","o":["ب","ل","ط","ك"],"a":1,"w":"اللَّامُ مِنْ حُرُوفِ: ن، ص، ل، ي، ش، ر، و، ق، ج، م، ع."},{"q":"أَيُّ هَذِهِ الْحُرُوفِ مُرْتَكِزٌ عَلَى السَّطْرِ؟","o":["ق","ج","م","ط"],"a":3,"w":"الطَّاءُ لَا تَنْزِلُ عَنِ السَّطْرِ."},{"q":"أَيُّ هَذِهِ الْحُرُوفِ لَيْسَ مُرْتَكِزًا عَلَى السَّطْرِ؟","o":["أ","ف","ر","د"],"a":2,"w":"الرَّاءُ يَنْزِلُ جُزْءٌ مِنْهَا أَسْفَلَ السَّطْرِ، أَمَّا الْبَاقِي فَمُرْتَكِزَةٌ."},{"q":"أَيُّ هَذِهِ الْحُرُوفِ مُرْتَكِزٌ عَلَى السَّطْرِ؟","o":["ك","و","ي","ش"],"a":0,"w":"الْكَافُ مِنَ الْحُرُوفِ الْمُرْتَكِزَةِ."},{"q":"أَيُّ هَذِهِ الْحُرُوفِ يَنْزِلُ جُزْءٌ مِنْهُ أَسْفَلَ السَّطْرِ؟","o":["ع","ب","د","ف"],"a":0,"w":"الْعَيْنُ مِنْ حُرُوفِ الْقِسْمِ الثَّانِي."},{"q":"الْحَرْفُ الَّذِي لَا يَنْزِلُ عَنِ السَّطْرِ وَفِيهِ أَلِفٌ وَحِلْيَةٌ هُوَ:","o":["ق","ص","ج","ط"],"a":3,"w":"الْحَرْفُ (ط) لَا يَنْزِلُ عَنِ السَّطْرِ."},{"q":"مَا الْوَصْفُ الصَّحِيحُ لِجِلْسَتِي عِنْدَ الْكِتَابَةِ؟","o":["أَجْلِسُ مُعْتَدِلًا","أَنْحَنِي عَلَى الطَّاوِلَةِ","أَرْفَعُ قَدَمَيَّ عَنِ الْأَرْضِ"],"a":0,"w":"الْإِرْشَادُ الْأَوَّلُ: أَجْلِسُ مُعْتَدِلًا."},{"q":"أَيْنَ أَضَعُ الْقَلَمَ؟","o":["فِي قَبْضَةِ يَدِي كُلِّهَا","بَيْنَ السَّبَّابَةِ وَالْإِبْهَامِ مُسْتَنِدًا عَلَى الْوُسْطَى","بَيْنَ الْخِنْصَرِ وَالْبِنْصِرِ"],"a":1,"w":"هَكَذَا أُمْسِكُ الْقَلَمَ."},{"q":"مَاذَا تَفْعَلُ يَدِيَ الْيُسْرَى؟","o":["تُمْسِكُ الْقَلَمَ","تُغَطِّي الْكِتَابَةَ","تُثَبِّتُ الْوَرَقَةَ"],"a":2,"w":"أَضَعُ يَدِيَ الْيُسْرَى عَلَى الْوَرَقَةِ لِتَثْبِيتِهَا."},{"q":"أَيُّ وَصْفٍ صَحِيحٌ لِلْبَاءِ؟","o":["حَرْفٌ يَنْزِلُ كُلُّهُ أَسْفَلَ السَّطْرِ","يَمِيلُ يَمِينًا، ثُمَّ يَسْتَقِرُّ عَلَى السَّطْرِ، ثُمَّ قَوْسٌ إِلَى الْأَعْلَى","أَلِفٌ فَقَطْ"],"a":1,"w":"هَذِهِ خُطُوَاتُ رَسْمِ الْبَاءِ."},{"q":"أَيُّ وَصْفٍ صَحِيحٌ لِلْفَاءِ؟","o":["رَأْسٌ مُفَرَّغٌ وَعُنُقٌ وَنُقْطَةٌ فَوْقَ الرَّأْسِ","أَلِفٌ وَشَارَةٌ","حَرْفٌ بِلَا نُقْطَةٍ وَبِلَا رَأْسٍ"],"a":0,"w":"هَذِهِ أَجْزَاءُ الْفَاءِ."},{"q":"أَيُّ وَصْفٍ صَحِيحٌ لِلْكَافِ؟","o":["رَأْسٌ مُفَرَّغٌ وَعُنُقٌ","حِلْيَةٌ وَرَأْسُ صَادٍ","أَلِفٌ وَشَارَةُ الْكَافِ"],"a":2,"w":"رَسْمُ الْكَافِ يَتَكَوَّنُ مِنْ خُطْوَتَيْنِ: أَلِفٌ وَشَارَةُ الْكَافِ."},{"q":"يَذْهَبُ الْأَ_فَالُ إِلَى الْبَحْرِ. أَيُّ حَرْفٍ نَاقِصٌ؟","o":["ب","ط","د","ف"],"a":1,"w":"الْكَلِمَةُ: الْأَطْفَالُ."},{"q":"يَذْهَبُ الْأَطْفَالُ إِلَى الْ_حْرِ. أَيُّ حَرْفٍ نَاقِصٌ؟","o":["د","ط","ب","ف"],"a":2,"w":"الْكَلِمَةُ: الْبَحْرِ."},{"q":"فِي فَصْلِ الصَّيْ_ يُفَضِّلُ الْأَطْفَالُ الذَّهَابَ إِلَى الْبَحْرِ. أَيُّ حَرْفٍ نَاقِصٌ؟","o":["ب","د","ف","ط"],"a":2,"w":"الْكَلِمَةُ: الصَّيْفِ."},{"q":"اجْعَلْ غِذَاءَكَ _وَاءَكَ. أَيُّ حَرْفٍ نَاقِصٌ؟","o":["ط","د","ف","ب"],"a":1,"w":"الْكَلِمَةُ: دَوَاءَكَ."},{"q":"مِنَ الْعَوَامِلِ الَّتِي أَسْهَمَتْ فِي ظَاهِرَةِ التَّصَحُّرِ قِلَّةُ الْأَمْ_ارِ. أَيُّ حَرْفٍ نَاقِصٌ؟","o":["ب","ف","د","ط"],"a":3,"w":"الْكَلِمَةُ: الْأَمْطَارِ."},{"q":"وَيَنْ_تُ الْعُشْبُ كَثِيفًا. أَيُّ حَرْفٍ نَاقِصٌ؟","o":["ب","ف","د","ط"],"a":0,"w":"الْكَلِمَةُ: يَنْبُتُ."},{"q":"الْقَنَاعَةُ _نْزٌ لَا يَفْنَى. أَيُّ حَرْفٍ نَاقِصٌ؟","o":["ب","د","ف","ك"],"a":3,"w":"الْكَلِمَةُ: كَنْزٌ."},{"q":"كَيْفَ كَانَتْ حَالُ الْفَرَاشَةِ فِي الْمَاضِي؟","o":["كَانَتْ حَزِينَةً","كَانَتْ نَائِمَةً","كَانَتْ تَتَجَوَّلُ فِي هَنَاءٍ مِثْلَ الْبُلْبُلِ","كَانَتْ خَائِفَةً"],"a":2,"w":"قَالَتْ: «كُنْتُ دَوْمًا أَتَجَوَّلْ فِي هَنَاءٍ مِثْلَ بُلْبُلْ»."},{"q":"مَا النَّصِيحَةُ الَّتِي خَتَمَ بِهَا الشَّاعِرُ أَبْيَاتَهُ؟","o":["حَقِّقُوا رُوحَ التَّآخِي كَيْ يَكُونَ الْعَيْشُ أَفْضَلْ","اسْبَحُوا فِي الْجَدْوَلِ","ازْرَعُوا الْقَرَنْفُلَ","ابْتَعِدُوا عَنِ الْبُسْتَانِ"],"a":0,"w":"هَذَا آخِرُ بَيْتٍ فِي الْقَصِيدَةِ."},{"q":"يَتَمَيَّزُ نَبَاتُ الْحَنْظَلِ بِأَنَّهُ:","o":["كَثِيرُ الْحَلَاوَةِ","شَدِيدُ الْمَرَارَةِ","شَدِيدُ الْمُلُوحَةِ","شَدِيدُ الْحُمُوضَةِ"],"a":1,"w":"الْحَنْظَلُ مُرٌّ جِدًّا، لِذَلِكَ شَبَّهَ الشَّاعِرُ بِهِ طَعْمَ الرَّحِيقِ بَعْدَ التَّلَوُّثِ."},{"q":"كَلِمَةُ (آهًا) فِي الْبَيْتِ تَدُلُّ عَلَى:","o":["الرِّضَا","التَّعَجُّبِ","الْغَضَبِ","التَّأَلُّمِ"],"a":3,"w":"الْفَرَاشَةُ تَتَأَلَّمُ لِأَنَّ كُلَّ شَيْءٍ قَدْ تَغَيَّرَ."},{"q":"الْكَلِمَةُ الْمُخْتَلِفَةُ هِيَ كَلِمَةُ:","o":["صَافٍ","مُعَكَّرٌ","عَذْبٌ","نَقِيٌّ"],"a":1,"w":"صَافٍ وَعَذْبٌ وَنَقِيٌّ مَعْنَاهَا وَاحِدٌ تَقْرِيبًا، أَمَّا مُعَكَّرٌ فَهُوَ عَكْسُهَا."},{"q":"مَاذَا حَدَثَ لِلْمَاءِ النَّقِيِّ بَعْدَ التَّلَوُّثِ؟","o":["صَارَ حُلْوًا","صَارَ سَاخِنًا","اخْتَفَى","بَدَا شَاحِبَ اللَّوْنِ مُعَكَّرًا"],"a":3,"w":"«فَبَدَا الْمَاءُ النَّقِيُّ شَاحِبَ اللَّوْنِ مُعَكَّرْ»."},{"q":"مَاذَا طَلَبَتِ الْفَرَاشَةُ مِنَ الصِّغَارِ؟","o":["أَنْ يَصْطَادُوهَا","أَنْ يَقْطِفُوا الْأَزْهَارَ","أَنْ يُبْعِدُوا الْقَذَارَةَ","أَنْ يَتْرُكُوهَا"],"a":2,"w":"قَالَتْ: «أَنْقِذُونِي يَا صِغَارُ أَبْعِدُوا عَنِّي الْقَذَارَةْ»."},{"q":"مِنْ مَظَاهِرِ النَّظَافَةِ فِي دِينِنَا:","o":["أَنَّ الْوُضُوءَ شَرْطٌ لِصِحَّةِ الصَّلَاةِ","إِلْقَاءُ الْقَاذُورَاتِ فِي الطَّرِيقِ","إِهْمَالُ الْبُسْتَانِ","الْمَاءُ الْمُعَكَّرُ"],"a":0,"w":"مِنْ مَظَاهِرِ النَّظَافَةِ فِي دِينِنَا أَنَّ الْوُضُوءَ شَرْطٌ لِصِحَّةِ الصَّلَاةِ، وَمِنْهَا النَّهْيُ عَنْ إِلْقَاءِ الْقَاذُورَاتِ فِي طَرِيقِ النَّاسِ."},{"q":"كَلِمَةٌ بَدَأَتْ بِهَمْزَةِ قَطْعٍ:","o":["انْشُرُوا","أَتَجَوَّلُ","ارْفَعُوا","اسْلُكُوا"],"a":1,"w":"الْجَوَابُ فِي وَرَقَةِ الْعَمَلِ: أَتَجَوَّلُ."},{"q":"كَلِمَةٌ بَدَأَتْ بِهَمْزَةِ وَصْلٍ:","o":["انْشُرُوا","أَدْبَرَ","أَمْسَى","أَلْهُو"],"a":0,"w":"الْجَوَابُ فِي وَرَقَةِ الْعَمَلِ: اُنْشُرُوا."},{"q":"جَمْعُ كَلِمَةِ (صَغِيرٍ):","o":["صُغَرَاءُ","أَصَاغِرُ","صِغَارٌ","صَغِيرُونَ"],"a":2,"w":"صِغَارٌ كَمَا فِي الْقَصِيدَةِ."},{"q":"اسْمُ طَائِرٍ عُرِفَ بِحُسْنِ صَوْتِهِ:","o":["قَرَنْفُلٌ","حَنْظَلٌ","بُلْبُلٌ","جَدْوَلٌ"],"a":2,"w":"الْبُلْبُلُ طَائِرٌ جَمِيلُ الصَّوْتِ."},{"q":"يَكْثُرُ تَسَاقُطُ الْأَمْطَارِ التَّصَاعُدِيَّةِ فِي:","o":["أَوَّلِ الصَّبَاحِ","مُنْتَصَفِ الْفَجْرِ","أَوَّلِ اللَّيْلِ","مُنْتَصَفِ النَّهَارِ"],"a":3,"w":"فِي النَّصِّ: «خَاصَّةً عِنْدَ الظَّهِيرَةِ»، وَالظَّهِيرَةُ مُنْتَصَفُ النَّهَارِ."},{"q":"أَيٌّ مِمَّا يَلِي لَيْسَ مِنْ أَنْوَاعِ الْأَمْطَارِ؟","o":["الْأَمْطَارُ الصَّيْفِيَّةُ","الْأَمْطَارُ التَّصَاعُدِيَّةُ","الْأَمْطَارُ التَّضَارِيسِيَّةُ","الْأَمْطَارُ الْإِعْصَارِيَّةُ"],"a":0,"w":"الْأَنْوَاعُ الثَّلَاثَةُ الْمَذْكُورَةُ: التَّصَاعُدِيُّ وَالتَّضَارِيسِيُّ وَالْإِعْصَارِيُّ، وَلَمْ يُذْكَرِ الْمَطَرُ الصَّيْفِيُّ."},{"q":"يَقَعُ بَيْتُ الْجَدِّ فِي مَكَانٍ:","o":["تَكْثُرُ فِيهِ الْأَمْطَارُ","تَقِلُّ فِيهِ الْأَمْطَارُ","تَزِيدُ فِيهِ الرِّيَاحُ","تَنْعَدِمُ فِيهِ الرِّيَاحُ"],"a":0,"w":"بَيْتُ الْجَدِّ فِي أَعْلَى الْجَبَلِ، وَالْمَنَاطِقُ الْجَبَلِيَّةُ أَكْثَرُ غَزَارَةً بِالْأَمْطَارِ."},{"q":"فِي فَصْلِ الصَّيْفِ تُفْرِزُ النَّبَاتَاتُ الزُّيُوتَ الْعِطْرِيَّةَ مِنْ أَجْلِ أَنْ:","o":["تَبْعَثَ فِي النَّفْسِ الرَّاحَةَ","تُسَاعِدَ فِي هُطُولِ الْأَمْطَارِ الْغَزِيرَةِ","تُحَافِظَ عَلَى الْمَاءِ فِي أَوْرَاقِ النَّبَاتِ","تُعَطِّرَ الْأَجْوَاءَ بِرَائِحَتِهَا"],"a":2,"w":"النَّصُّ: زُيُوتٌ عِطْرِيَّةٌ تُخَفِّفُ مِنْ تَبَخُّرِ الْمَاءِ مِنْ أَوْرَاقِهَا وَتُرْبَتِهَا."},{"q":"اسْتَطَاعَ الِابْنُ شَمَّ رَائِحَةِ الْمَطَرِ:","o":["قَبْلَ هُطُولِ الْمَطَرِ","عِنْدَ بَدْءِ هُطُولِ الْمَطَرِ","فِي أَثْنَاءِ هُطُولِ الْمَطَرِ","عِنْدَ تَوَقُّفِ هُطُولِ الْمَطَرِ"],"a":3,"w":"النَّصُّ: «وَحِينَمَا تَوَقَّفَ الْمَطَرُ شَمَمْتُ رَائِحَتَهُ»."},{"q":"الْأَمْطَارُ الَّتِي تَسَاقَطَتْ عَلَى بَيْتِ الْجَدِّ هِيَ:","o":["الْأَمْطَارُ الْإِعْصَارِيَّةُ","الْأَمْطَارُ التَّضَارِيسِيَّةُ","الْأَمْطَارُ التَّصَاعُدِيَّةُ","الْأَمْطَارُ السَّهْلِيَّةُ"],"a":1,"w":"قَالَ الْأَبُ: «التَّضَارِيسُ، وَهِيَ الْعَامِلُ الْمُؤَثِّرُ عَلَى بَيْتِ جَدِّكُمْ»."},{"q":"لِمَاذَا يَقْلَقُ الْفَلَّاحُ مِنَ الْأَمْطَارِ التَّصَاعُدِيَّةِ؟","o":["لِأَنَّهَا لَا تَسْقُطُ أَبَدًا","لِأَنَّهَا تَضُرُّ الْمَحَاصِيلَ وَتُفْسِدُ التُّرْبَةَ وَتُغْرِقُ الْأَشْجَارَ","لِأَنَّهَا تَسْقُطُ فِي الشِّتَاءِ فَقَطْ","لِأَنَّهَا بَارِدَةٌ جِدًّا"],"a":1,"w":"هَذَا مَا قَالَهُ النَّصُّ عَنْ سَبَبِ قَلَقِ الْفَلَّاحِ."},{"q":"أَيٌّ مِمَّا يَأْتِي مِنَ الْعَوَامِلِ الْمُؤَثِّرَةِ فِي كَمِّيَّةِ الْمَطَرِ؟","o":["لَوْنُ السَّمَاءِ","عَدَدُ الْأَشْجَارِ فَقَطْ","نِظَامُ هُبُوبِ الرِّيَاحِ","سُرْعَةُ السَّيَّارَاتِ"],"a":2,"w":"الْعَوَامِلُ: الْقُرْبُ أَوِ الْبُعْدُ مِنَ الْمُسَطَّحَاتِ الْمَائِيَّةِ، وَنِظَامُ هُبُوبِ الرِّيَاحِ، وَالتَّضَارِيسُ."},{"q":"مِنَ الْعَوَامِلِ الَّتِي تَزِيدُ أَوْ تُقَلِّلُ كَمِّيَّةَ الْمَطَرِ:","o":["مَوْعِدُ الْغَدَاءِ","عَدَدُ الْبُيُوتِ","لَوْنُ الْجِبَالِ","الْقُرْبُ أَوِ الْبُعْدُ مِنَ الْمُسَطَّحَاتِ الْمَائِيَّةِ"],"a":3,"w":"هُوَ الْعَامِلُ الْأَوَّلُ فِي النَّصِّ."},{"q":"لِمَاذَا تَتَسَاقَطُ الْأَمْطَارُ عَلَى الْجِبَالِ بِغَزَارَةٍ؟","o":["لِأَنَّ الْجِبَالَ تَصُدُّ الرِّيَاحَ الرَّطْبَةَ فَتَرْتَفِعُ وَيَبْرُدُ هَوَاؤُهَا وَيَتَكَاثَفُ بُخَارُ الْمَاءِ","لِأَنَّ الْجِبَالَ حَارَّةٌ جِدًّا","لِأَنَّ الرِّيَاحَ لَا تَهُبُّ عَلَيْهَا","لِأَنَّهَا بَعِيدَةٌ عَنِ السَّمَاءِ"],"a":0,"w":"هَذَا شَرْحُ الْأَبِ لِدَوْرِ التَّضَارِيسِ."},{"q":"لِمَاذَا يُوجَدُ لِلْمَطَرِ أَكْثَرُ مِنْ رَائِحَةٍ؟","o":["لِأَنَّهَا مُرَكَّبَةٌ مِنْ عِدَّةِ رَوَائِحَ","لِأَنَّ الْمَطَرَ يَخْتَلِطُ بِالْوَرْدِ","لِأَنَّنَا نَتَخَيَّلُهَا","لِأَنَّهَا تَتَغَيَّرُ كُلَّ سَاعَةٍ"],"a":0,"w":"النَّصُّ: رَائِحَةُ الْمَطَرِ لَيْسَتْ وَاحِدَةً بَلْ مُرَكَّبَةٌ مِنْ عِدَّةِ رَوَائِحَ."},{"q":"مَا الِاسْمُ الْعِلْمِيُّ لِرَائِحَةِ الْمَطَرِ؟","o":["كُلُور","تَصَاعُدِيّ","إِعْصَار","بَتْرِيكُور"],"a":3,"w":"«وَتُسَمَّى عِلْمِيًّا (بَتْرِيكُور)»."},{"q":"إِحْدَى رَوَائِحِ الْمَطَرِ أَقْرَبُ إِلَى رَائِحَةِ:","o":["الْوَرْدِ","الْخُبْزِ","الْكُلُورِ الْمُخَفَّفِ","الْبَحْرِ"],"a":2,"w":"النَّصُّ: أَقْرَبُ إِلَى رَائِحَةِ الْكُلُورِ الْمُخَفَّفِ الْمُسْتَخْدَمِ فِي بَعْضِ الْمُنَظِّفَاتِ، وَتَتَكَوَّنُ فِي الْعَوَاصِفِ الرَّعْدِيَّةِ."},{"q":"فِي الْعُلَا ................ كِيلُو مِتْرٍ مِنَ الْمَنَاظِرِ الطَّبِيعِيَّةِ السَّاحِرَةِ.","o":["٢٠","٢٠٠٠٠","٢٠٠","٢٠٠٠"],"a":1,"w":"النَّصُّ: «٢٠ أَلْفَ كِيلُو مِتْرٍ»، أَيْ ٢٠٠٠٠."},{"q":"مَعْنَى كَلِمَةِ (مُوغِلَةٍ):","o":["مُتَطَوِّرَةٍ","مُتَفَرِّعَةٍ","مُتَلَوِّنَةٍ","مُتَعَمِّقَةٍ"],"a":3,"w":"الْمَمَالِكُ الْعَرَبِيَّةُ الْمُوغِلَةُ فِي الْقِدَمِ، أَيِ الْمُتَعَمِّقَةُ فِيهِ."},{"q":"تَقَعُ الْعُلَا فِي أَيِّ جِهَةٍ مِنَ الْمَمْلَكَةِ؟","o":["جَنُوبَ شَرْقِ الْمَمْلَكَةِ","وَسَطَ الْمَمْلَكَةِ","شَمَالَ غَرْبِ الْمَمْلَكَةِ","شَرْقَ الْمَمْلَكَةِ"],"a":2,"w":"النَّصُّ: «الْوَاقِعَةِ شَمَالَ غَرْبِ الْمَمْلَكَةِ»."},{"q":"الْعُلَا إِحْدَى مُحَافَظَاتِ مِنْطَقَةِ:","o":["الرِّيَاضِ","الْمَدِينَةِ الْمُنَوَّرَةِ","مَكَّةَ الْمُكَرَّمَةِ","الْقَصِيمِ"],"a":1,"w":"النَّصُّ: «إِحْدَى مُحَافَظَاتِ مِنْطَقَةِ الْمَدِينَةِ الْمُنَوَّرَةِ»."},{"q":"عَدَدُ الْمَرَاكِزِ الثَّقَافِيَّةِ فِي الْعُلَا:","o":["خَمْسَةٌ","ثَلَاثَةٌ","أَرْبَعَةٌ","سِتَّةٌ"],"a":0,"w":"النَّصُّ: «تَحْوِي خَمْسَةَ مَرَاكِزَ ثَقَافِيَّةٍ»."},{"q":"طُولُ الْقِطَارِ السِّيَاحِيِّ الصَّدِيقِ لِلْبِيئَةِ:","o":["٤٦ كلم","٢٠ كلم","٢٠٠٠ كلم","٦٤ كلم"],"a":0,"w":"النَّصُّ: «بِطُولِ ٤٦ كلم»، أَيْ ٤٦ كِيلُو مِتْرًا."},{"q":"لِمَاذَا أُنْشِئَتِ الْهَيْئَةُ الْمَلَكِيَّةُ لِمُحَافَظَةِ الْعُلَا؟","o":["لِبَيْعِ الْآثَارِ","لِلْحِفَاظِ عَلَى تُرَاثِ وَإِرْثِ الْعُلَا","لِإِغْلَاقِ الْمُحَافَظَةِ","لِبِنَاءِ مَصَانِعَ فَقَطْ"],"a":1,"w":"النَّصُّ: «لِلْحِفَاظِ عَلَى تُرَاثِ وَإِرْثِ الْعُلَا»."},{"q":"«تَشْهَدُ الْمُحَافَظَةُ حَالِيًّا أَعْمَالًا تَطْوِيرِيَّةً». مَا رُكْنَا هَذِهِ الْجُمْلَةِ الْفِعْلِيَّةِ؟","o":["الْمُبْتَدَأُ «تَشْهَدُ» وَالْخَبَرُ «الْمُحَافَظَةُ»","الْفِعْلُ «أَعْمَالًا» وَالْفَاعِلُ «حَالِيًّا»","الْفِعْلُ «تَشْهَدُ» وَالْفَاعِلُ «الْمُحَافَظَةُ»","الْفَاعِلُ «تَشْهَدُ» وَالْمَفْعُولُ «الْمُحَافَظَةُ»"],"a":2,"w":"الْجُمْلَةُ الْفِعْلِيَّةُ: فِعْلٌ وَفَاعِلٌ. الْفِعْلُ «تَشْهَدُ»، وَالْفَاعِلُ «الْمُحَافَظَةُ»، وَ«أَعْمَالًا» مَفْعُولٌ بِهِ."},{"q":"أَيُّ جُمْلَةٍ فِعْلِيَّةٍ هِيَ تَحْوِيلُ الْجُمْلَةِ الِاسْمِيَّةِ «إِبْرَاهِيمُ يَدْرُسُ فِي الصَّفِّ الرَّابِعِ الِابْتِدَائِيِّ»؟","o":["إِبْرَاهِيمُ دَرَسَ الصَّفَّ","الصَّفُّ الرَّابِعُ يَدْرُسُ إِبْرَاهِيمَ","فِي الصَّفِّ إِبْرَاهِيمُ يَدْرُسُ","يَدْرُسُ إِبْرَاهِيمُ فِي الصَّفِّ الرَّابِعِ الِابْتِدَائِيِّ"],"a":3,"w":"الْجُمْلَةُ الْفِعْلِيَّةُ تَبْدَأُ بِالْفِعْلِ، فَنُقَدِّمُ «يَدْرُسُ» عَلَى «إِبْرَاهِيمَ»."},{"q":"«مَحَطَّاتُ قِطَارِ الرِّيَاضِ حَدِيثَةٌ». رُكْنَا الْجُمْلَةِ الِاسْمِيَّةِ هُمَا:","o":["قِطَارُ (فِعْلٌ) وَالرِّيَاضِ (فَاعِلٌ)","حَدِيثَةٌ (مُبْتَدَأٌ) وَمَحَطَّاتُ (خَبَرٌ)","الرِّيَاضِ (مُبْتَدَأٌ) وَحَدِيثَةٌ (فَاعِلٌ)","مَحَطَّاتُ (مُبْتَدَأٌ) وَحَدِيثَةٌ (خَبَرٌ)"],"a":3,"w":"«مَحَطَّاتُ» هُوَ الْمُبْتَدَأُ، وَ«حَدِيثَةٌ» هُوَ الْخَبَرُ، وَ«قِطَارِ الرِّيَاضِ» مُضَافٌ إِلَيْهِ."},{"q":"حَوِّلِي الْجُمْلَةَ الْمَنْفِيَّةَ إِلَى مُثْبَتَةٍ: «لَمْ يَذْهَبْ جَاسِرٌ إِلَى الْمَدْرَسَةِ».","o":["لَا يَذْهَبُ جَاسِرٌ إِلَى الْمَدْرَسَةِ","ذَهَبَ جَاسِرٌ إِلَى الْمَدْرَسَةِ","لَنْ يَذْهَبَ جَاسِرٌ إِلَى الْمَدْرَسَةِ","مَا ذَهَبَ جَاسِرٌ إِلَى الْمَدْرَسَةِ"],"a":1,"w":"نَحْذِفُ «لَمْ» وَنَجْعَلُ الْفِعْلَ مَاضِيًا: ذَهَبَ جَاسِرٌ إِلَى الْمَدْرَسَةِ."},{"q":"«تُرَتِّبُ الْأُسْرَةُ الْبَيْتَ اسْتِعْدَادًا لِلْعِيدِ». الْمَفْعُولُ بِهِ هُوَ:","o":["الْأُسْرَةُ","اسْتِعْدَادًا","الْبَيْتَ","الْعِيدِ"],"a":2,"w":"الْمَفْعُولُ بِهِ هُوَ مَنْ وَقَعَ عَلَيْهِ الْفِعْلُ: مَاذَا تُرَتِّبُ الْأُسْرَةُ؟ الْبَيْتَ."},{"q":"«وَضَعَتْ مُنَى ......... فِي الْحَقِيبَةِ». أَيُّ مَفْعُولٍ بِهِ مَضْبُوطٍ ضَبْطًا صَحِيحًا يُنَاسِبُ الْفَرَاغَ؟","o":["كِتَابًا","كِتَابٌ","كِتَابٍ","كِتَابُ"],"a":0,"w":"الْمَفْعُولُ بِهِ مَنْصُوبٌ، وَعَلَامَةُ نَصْبِهِ هُنَا الْفَتْحَةُ (مَعَ تَنْوِينِ الْفَتْحِ): كِتَابًا."},{"q":"«قَرَأْتُ ..... آثَارِ التَّلَوُّثِ». أَيُّ حَرْفِ جَرٍّ يُنَاسِبُ الْفَرَاغَ؟","o":["ثُمَّ","لَمْ","عَنْ","وَ"],"a":2,"w":"«عَنْ» حَرْفُ جَرٍّ، وَالِاسْمُ بَعْدَهُ مَجْرُورٌ: قَرَأْتُ عَنْ آثَارِ التَّلَوُّثِ."},{"q":"الْمَسْؤُولُ عَنِ الطُّلَّابِ فِي الرِّحْلَةِ الْمَدْرَسِيَّةِ هُوَ مُعَلِّمُ:","o":["الرِّيَاضِيَّاتِ","التَّرْبِيَةِ الْبَدَنِيَّةِ","اللُّغَةِ الْعَرَبِيَّةِ","الْعُلُومِ"],"a":2,"w":"ذَهَبَ عُمَرُ فِي الرِّحْلَةِ مَعَ مُعَلِّمِ اللُّغَةِ الْعَرَبِيَّةِ."},{"q":"ضِدُّ كَلِمَةِ (التَّلَوُّثِ):","o":["التَّرْتِيبُ","التَّنْظِيمُ","التَّدْنِيسُ","التَّطْهِيرُ"],"a":3,"w":"ضِدُّ التَّلَوُّثِ: التَّطْهِيرُ."},{"q":"يُوجَدُ فِي الْوَقْتِ الْحَاضِرِ ........ مَادَّةٍ سَامَّةٍ تُلَوِّثُ الْهَوَاءَ.","o":["٥٠ أَلْفَ","٨٠ أَلْفَ","٧٠ أَلْفَ","٦٠ أَلْفَ"],"a":1,"w":"فِي النَّصِّ: حَوَالَى ٨٠ أَلْفَ مَادَّةٍ سَامَّةٍ."},{"q":"الدُّخَانُ الَّذِي تُطْلِقُهُ الْمَصَانِعُ مُشْبَعٌ بِغَازٍ:","o":["ثَانِي أُكْسِيدِ الْكَرْبُونِ","النَّيْتْرُوجِينِ","الْأُكْسِجِينِ","الْهَيْدْرُوجِينِ"],"a":0,"w":"النَّصُّ: يُلَوِّثُ الْهَوَاءَ بِغَازِ ثَانِي أُكْسِيدِ الْكَرْبُونِ."},{"q":"يَتِمُّ نَقْلُ الْمَاءِ الْمُعَالَجِ إِلَى .........","o":["الْمَنَازِلِ","الْأَوْدِيَةِ","الْبِحَارِ","الْأَنْهَارِ"],"a":0,"w":"الشَّبَكَاتُ تَنْقُلُ الْمَاءَ الْمُعَالَجَ إِلَى الْمَنَازِلِ وَالْمُؤَسَّسَاتِ."},{"q":"نَجَحَ الْإِنْسَانُ فِي تَحْلِيَةِ مِيَاهِ .........","o":["النَّهْرِ","الْبَحْرِ","السَّمَاءِ","الْمَطَرِ"],"a":1,"w":"النَّصُّ: طُرُقٌ نَاجِحَةٌ لِتَحْلِيَةِ مَاءِ الْبَحْرِ."},{"q":"ضِدُّ كَلِمَةِ (حَدِيثَةٌ):","o":["جَدِيدَةٌ","جَمِيلَةٌ","قَدِيمَةٌ","قَبِيحَةٌ"],"a":2,"w":"ضِدُّ حَدِيثَةٍ: قَدِيمَةٌ."},{"q":"مُرَادِفُ كَلِمَةِ (تَرْشِيدٌ):","o":["تَجْمِيلٌ","تَقْلِيلٌ","إِسْرَافٌ","تَبْذِيرٌ"],"a":1,"w":"التَّرْشِيدُ يَعْنِي التَّقْلِيلَ مِنَ الِاسْتِهْلَاكِ."}];

var muted=false;var ROSTER={"1": ["ألين بدير", "تالا المستادي", "ترف السلمي", "حور الجغثمي", "ردينا الصريمي", "رغد الخطابي", "رواسن المغربي", "روز صيرفي", "ريم الخطابي", "ريما الشهري", "ساره الحربي", "سمر العمودي", "غزل اليعقوبي", "فجر الذبياني", "قمر", "لانا العميري", "لينا الرشيدي", "ماريا الشمراني", "مريم بادنجكي", "وجد خرمي"], "2": ["أرام عسيري", "أسيل وداد", "تالا الشمراني", "تالا القريقري", "تيلا أبو صالح", "جميلة السميري", "جنى الشريف", "حلا الغامدي", "دانه اليوبي", "روز الحمراني", "ريتاج عواجي", "ريما بن خميس", "شدن الخرماني", "شذى يونس", "علا زهران", "علويه الحداد", "غني العوفي", "لارين الشمري", "لانا آل شبيب", "لجين الحانطي", "لميس اليوبي", "لين بازهير", "ماريا الحربي", "مريم باشماخ", "مشاعل ثابت", "ميار الجهني", "ندى السهلي", "هديل الفارسي", "ورد الزهراني"]};var NAME='';var RID=Math.random().toString(36).slice(2,10);var SENT=true;
function send(f){try{var x=new XMLHttpRequest();x.open('POST','https://ntfy.sh/'+CFG.topic,true);x.onreadystatechange=function(){if(x.readyState===4){SENT=(x.status>=200&&x.status<300);var e=document.getElementById('sent');if(e&&f)e.innerHTML=SENT?'✓ أُرسلت نتيجتكِ إلى شاشة المعلمة':'⚠ لم تصل النتيجة، تأكدي من الإنترنت'}};x.send(JSON.stringify({t:'p',s:CFG.subj,c:gm?gm[1]:'0',g:gm?+gm[2]:0,name:NAME,rid:RID,n:i,sc:sc,f:f?1:0,at:(new Date()).getTime()}))}catch(e){}}
function snd(n,v,delay){if(muted)return;setTimeout(function(){try{var a=new Audio(CFG.sfx+n+'.mp3');a.volume=v;var p=a.play();if(p&&p.catch)p.catch(function(){})}catch(e){}},delay||0)}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function ar(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.charAt(+d)})}
var N=10,pool=shuf(DATA),pi=0,qs_=[],i=0,sc=0,mark=[];
function start(){
 var cl=gm?gm[1]:'1';var list=ROSTER[cl]||[];var h=top()+'<div class="card center pop"><h2 style="font-size:1.8rem">مرحبًا! من أنتِ؟</h2><p>اختاري اسمكِ لتظهر نتيجتكِ على الشاشة.</p><select id="sel"><option value="">— اختاري اسمكِ —</option>';
 for(var k=0;k<list.length;k++)h+='<option>'+esc(list[k])+'</option>';
 h+='<option value="__o">اسم آخر…</option></select><input class="nm" id="oth" placeholder="اكتبي اسمكِ" style="display:none"><button class="btn" id="go">ابدأي المسابقة</button></div>';
 app.innerHTML=h;bindTop();
 var sel=document.getElementById('sel'),oth=document.getElementById('oth');sel.onchange=function(){oth.style.display=sel.value==='__o'?'block':'none'};
 document.getElementById('go').onclick=function(){var v=sel.value==='__o'?oth.value.replace(/^\s+|\s+$/g,''):sel.value;if(!v){sel.style.borderColor='#e0483a';return}NAME=v;newRound()}}
function newRound(){RID=Math.random().toString(36).slice(2,10);qs_=[];while(qs_.length<N){if(pi>=pool.length){pool=shuf(DATA);pi=0}var q=pool[pi++];var opts=[];for(var k=0;k<q.o.length;k++)opts.push({t:q.o[k],k:k});if(!q.fixed)opts=shuf(opts);qs_.push({q:q,o:opts})}i=0;sc=0;mark=[];draw()}
function top(){return '<div class="top"><div class="t"><h1>'+esc(CFG.title)+'</h1><small>'+esc(label)+'</small></div><div class="m"><button class="snd" id="snd" aria-label="الصوت">'+(muted?'🔇':'🔊')+'</button></div></div>'}
function bindTop(){var s=document.getElementById('snd');if(s)s.onclick=function(){muted=!muted;s.innerHTML=muted?'🔇':'🔊'}}
function draw(){
 if(i>=N){return end()}
 var it=qs_[i],q=it.q,dots='';for(var d=0;d<N;d++)dots+='<i class="'+(d<i?(mark[d]?'on':'no'):(d===i?'cur':''))+'"></i>';
 var h=top()+'<div class="card pop"><div class="dots">'+dots+'</div><p class="center" style="margin:0;opacity:.75">السؤال '+ar(i+1)+' من '+ar(N)+'</p>'+(q.img?'<img class="pic" src="'+CFG.img+q.img+'.webp" alt="">':'')+'<div class="q">'+esc(q.q)+'</div><div class="opts">';
 for(var k=0;k<it.o.length;k++)h+='<button class="opt" data-k="'+it.o[k].k+'">'+esc(it.o[k].t)+'</button>';
 h+='</div><div class="fb" id="fb" style="display:none"></div></div>';
 app.innerHTML=h;bindTop();
 var btns=app.getElementsByClassName('opt');var done=false;
 for(var b=0;b<btns.length;b++)(function(btn){btn.onclick=function(){if(done)return;done=true;snd('pop',.4);var ok=(+btn.getAttribute('data-k')===q.a);
  for(var x=0;x<btns.length;x++){var kk=+btns[x].getAttribute('data-k');if(kk===q.a)btns[x].className+=' ok';else if(btns[x]===btn)btns[x].className+=' no shake';else btns[x].className+=' dim'}
  mark[i]=ok;if(ok)sc+=0;var fb=document.getElementById('fb');fb.style.display='block';
  if(ok){sc++;snd('correct',.6,0);snd('sparkle',.5,60);snd('clap',.5,420);fb.innerHTML='👏 أحسنتِ! '+esc(q.w||'')}
  else{snd('wrong',.5,0);fb.innerHTML='❌ الإجابة الصحيحة: <b>'+esc(q.o[q.a])+'</b>. '+esc(q.w||'')}
  fb.innerHTML+='<div class="center"><button class="btn" id="nx">'+(i+1<N?'السؤال التالي':'النتيجة')+'</button></div>';
  document.getElementById('nx').onclick=function(){i++;if(i===5)send(false);draw();window.scrollTo(0,0)}}})(btns[b])}
function end(){
 var st=sc>=9?3:sc>=7?2:sc>=5?1:0;send(true);var s='';for(var k=0;k<3;k++)s+=(k<st?'⭐':'☆');
 app.innerHTML=top()+'<div class="card center pop"><div class="big">'+ar(sc)+' من '+ar(N)+'</div><div class="stars">'+s+'</div><p style="font-size:1.3rem;font-weight:800">'+(sc>=9?'ممتاز! ما شاء الله':sc>=7?'أحسنتِ، جيّد جدًّا':sc>=5?'جيّد، نكمل ونتحسّن':'نعيد المحاولة معًا')+'</p><p class="sent" id="sent">جارٍ إرسال النتيجة…</p><button class="btn" id="ag">لعب جديد</button></div>';
 bindTop();if(st>=1){snd('win',.6,0);snd('clap_long',.5,300)}else snd('wrong',.4,0);
 document.getElementById('ag').onclick=function(){newRound();window.scrollTo(0,0)}}
start();
})();
</script></body></html>
