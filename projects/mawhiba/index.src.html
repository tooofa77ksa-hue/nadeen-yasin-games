<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>تدريب موهبة</title><meta name="theme-color" content="#FFC72C">
<style>
@font-face{font-family:B;src:url('../animals/fonts/baloo-800.ttf');font-weight:800}
@font-face{font-family:R;src:url('../animals/fonts/readex-400.ttf');font-weight:400}
@font-face{font-family:R;src:url('../animals/fonts/readex-600.ttf');font-weight:600}
:root{--ink:#2b1b10;--bg:#FFC72C;--card:#fff;--line:#2b1b10}
*{box-sizing:border-box}html,body{margin:0}
body{font:400 17px/1.7 R,Tahoma,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:70px}
h1,h2,h3{font-family:B,R,sans-serif;font-weight:800;margin:.2em 0}
.wrap{max-width:820px;margin:0 auto;padding:12px 14px}
.card{background:var(--card);border:4px solid var(--line);border-radius:22px;padding:14px 16px;margin:12px 0;box-shadow:0 5px 0 var(--line)}
.btn{font:800 1.05rem B,R;color:#fff;background:#3d7bff;border:3px solid #fff;border-radius:999px;padding:10px 22px;min-height:46px;cursor:pointer;box-shadow:0 5px 0 #0003}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0003}.btn.g{background:#22A55A}.btn.o{background:#ff8a3d}.btn.p{background:#8f6bff}.btn.w{background:#fff;color:var(--ink);border-color:var(--ink)}
input,select{font:600 1rem R;padding:10px 12px;border-radius:12px;border:3px solid var(--ink);width:100%;margin:6px 0;background:#fff}
.muted{color:#6b5a4a;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border:4px solid var(--ink);border-radius:18px;padding:10px;background:#fff;text-align:center;cursor:pointer;position:relative;font:inherit;color:inherit}
.tile b{font:800 1.2rem B;display:block}.tile small{display:block;color:#6b5a4a}
.tile.due{background:#fff3b0}.tile .badge{position:absolute;top:-10px;left:-6px;background:#e11d48;color:#fff;border-radius:999px;font:800 .75rem B;padding:2px 9px}
.grpL{background:#d9f7d9}.grpQ{background:#ffe3cc}.grpF{background:#dbe8ff}.grpS{background:#f0e0ff}
.pg{width:100%;display:block;border:3px solid #ccc;border-radius:12px;margin:10px 0;background:#fff;min-height:200px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}.top .sp{flex:1}
.timer{font:800 1.6rem B;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:2px 14px;min-width:96px;text-align:center}
.timer.late{background:#ffd6d6}
.marks{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;margin:10px 0}
.mk{border:3px solid var(--ink);border-radius:12px;background:#fff;padding:6px 0;font:800 1.1rem B;cursor:pointer;text-align:center}
.mk.ok{background:#bdf3c8}.mk.no{background:#ffc9c9}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:4px solid var(--ink);padding:8px 12px;display:flex;gap:8px;justify-content:center;z-index:9}
.hid{display:none!important}
.stars{letter-spacing:2px}
</style></head><body><div class="wrap" id="app"></div>
<script>
(function(){
var app=document.getElementById('app'),KEY=null,MAN=null,IT=200000;
var AR=function(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d]})};
function $(s,r){return (r||document).querySelector(s)}
var LS={get:function(k,d){try{var v=localStorage.getItem('mk_'+k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem('mk_'+k,JSON.stringify(v))}catch(e){}}};
function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function deriveKey(pw,salt){var enc=new TextEncoder();return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']).then(function(m){return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:IT,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['decrypt'])})}
function dec(buf){var u=new Uint8Array(buf);return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},KEY,u.slice(12))}
function getBin(p){return fetch(p).then(function(r){if(!r.ok)throw new Error(p);return r.arrayBuffer()})}
var cache={};
function pageUrl(n){var k='p'+n;if(cache[k])return Promise.resolve(cache[k]);var f='data/p'+('00'+n).slice(-3)+'.bin';return getBin(f).then(dec).then(function(b){return cache[k]=URL.createObjectURL(new Blob([b],{type:'image/webp'}))})}
function imgs(list,into){into.innerHTML=list.map(function(n){return '<img class="pg" data-n="'+n+'" alt="صفحة '+n+'">'}).join('');
 var io=('IntersectionObserver' in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){io.unobserve(e.target);var im=e.target;pageUrl(+im.dataset.n).then(function(u){im.src=u;im.style.minHeight='0'})}})},{rootMargin:'600px'}):null;
 [].forEach.call(into.querySelectorAll('img'),function(im){if(io)io.observe(im);else pageUrl(+im.dataset.n).then(function(u){im.src=u})})}

// ---------- lock ----------
function lock(msg){app.innerHTML='<div class="card" style="text-align:center"><h1>🔒 تدريب موهبة</h1><p>خاصٌّ بنادين وزميلاتها المشاركات مع الأستاذ إبراهيم قشير. اكتبي كلمة السر التي أعطتكِ إياها المعلمة.</p><input id="nm" placeholder="اسمكِ" value="'+(LS.get('name','')||'')+'" maxlength="24"><input id="pw" type="password" placeholder="كلمة السر" autocomplete="off"><div id="er" class="muted" style="color:#c00">'+(msg||'')+'</div><button class="btn g" id="go">دخول</button></div>';
 var go=function(){var nm=$('#nm').value.trim(),pw=$('#pw').value;if(!nm){$('#er').textContent='اكتبي اسمكِ أولًا';return}LS.set('name',nm);$('#er').textContent='جاري الفتح…';open(pw)};
 $('#go').onclick=go;$('#pw').onkeydown=function(e){if(e.key==='Enter')go()}}
function open(pw){getBin('data/salt.bin').then(function(s){return deriveKey(pw,new Uint8Array(s))}).then(function(k){KEY=k;return getBin('data/manifest.bin')}).then(dec).then(function(b){MAN=JSON.parse(new TextDecoder().decode(b));try{sessionStorage.setItem('mkpw',pw)}catch(e){}home()}).catch(function(){KEY=null;lock('كلمة السر غير صحيحة')})}

// ---------- state ----------
var BOX=[1,3,7,14,30];
function today(){return Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/864e5)}
function R(){return LS.get('res',{})}
function recordResult(t,ok,n,wrong){var r=R(),e=r[t.id]||{box:0,best:0,tries:0},pct=Math.round(ok/n*100);e.tries++;e.last=pct;e.best=Math.max(e.best,pct);e.wrong=wrong;e.box=pct>=80?Math.min(4,e.box+1):0;e.due=today()+BOX[e.box];e.date=today();r[t.id]=e;LS.set('res',r);return e}
function stars(p){return p>=90?'⭐⭐⭐':p>=70?'⭐⭐☆':p>0?'⭐☆☆':'☆☆☆'}

// ---------- home ----------
function home(){var r=R(),td=today(),G=[['grpL','الجزء اللفظي',[1,2,3,4,5]],['grpQ','الجزء الكمي',[6,7,8,9,10]],['grpF','المرونة العقلية',[11,12,13]],['grpS','الجزء العلمي',[14,15]]];
 var due=MAN.tests.filter(function(t){return r[t.id]&&r[t.id].due<=td});
 app.innerHTML='<div class="top"><h1>🧠 المتميز في مقياس موهبة</h1></div><div class="card"><b>أهلًا '+(LS.get('name','')||'')+'!</b> هذه تدريبات الكتاب (٣–٤ ابتدائي) للأستاذ إبراهيم قشير، بترتيبها وحلولها. جرّبي الاختبار أولًا بدون النظر للحل، ثم اكشفي الحل وعلّمي إجاباتكِ.<br><span class="muted">ركّزي وكرّري تصلي بإذن الله 💗</span></div>'+
 (due.length?'<div class="card" style="background:#fff3b0"><b>🔔 للمراجعة اليوم ('+AR(due.length)+'):</b> '+due.map(function(t){return '<button class="btn o" data-t="'+t.id+'" style="margin:3px;padding:6px 14px;min-height:36px">'+t.name+'</button>'}).join('')+'</div>':'')+
 '<div class="grid" style="margin:10px 0"><button class="tile" data-s="intro"><b>📖 المقدمة</b><small>إرشادات وتعبئة الورقة</small></button><button class="tile" data-s="types"><b>🧩 أنواع الأسئلة</b><small>أمثلة وفنيات الإجابة</small></button></div>'+
 G.map(function(g){return '<h2>'+g[1]+'</h2><div class="grid">'+g[2].map(function(i){var t=MAN.tests[i-1],e=r[t.id],d=e&&e.due<=td;return '<button class="tile '+g[0]+(d?' due':'')+'" data-t="'+t.id+'">'+(d?'<span class="badge">راجعي</span>':'')+'<b>'+t.name+'</b><small>'+(t.n?AR(t.n)+' سؤالًا — ':'')+(t.min?AR(t.min)+' دقيقة':'')+'</small><span class="stars">'+(e?stars(e.best):'☆☆☆')+'</span>'+(e?'<small>آخر نتيجة '+AR(e.last)+'٪</small>':'')+'</button>'}).join('')+'</div>'}).join('')+
 '<div class="card" style="margin-top:16px;text-align:center"><button class="btn g" id="snd">📤 أرسلي ملخصي لمها</button><div class="muted" id="ss"></div></div>';
 [].forEach.call(app.querySelectorAll('[data-t]'),function(b){b.onclick=function(){testView(MAN.tests[+b.dataset.t-1])}});
 [].forEach.call(app.querySelectorAll('[data-s]'),function(b){b.onclick=function(){secView(b.dataset.s)}});
 $('#snd').onclick=send;window.scrollTo(0,0)}
function secView(k){var s=MAN[k];app.innerHTML='<div class="top"><button class="btn w" id="bk">→ رجوع</button><h2>'+s.name+'</h2></div><div id="pgs"></div>';$('#bk').onclick=home;imgs(s.pages,$('#pgs'))}
function send(){var r=R(),nm=LS.get('name','')||'؟',done=MAN.tests.filter(function(t){return r[t.id]});var txt='ملخص '+nm+' (تدريب موهبة): '+(done.length?done.map(function(t){return t.name+' '+r[t.id].last+'٪'}).join('، '):'لم تبدأ بعد')+'. عدد المحاولات: '+done.reduce(function(a,t){return a+r[t.id].tries},0);
 var rec={t:'res',p:nm.indexOf('نادين')>=0?'nadeen':'friend',name:nm,game:'progress',label:txt,score:0,max:0,stars:0,at:Date.now()},st=$('#ss'),wa='<a target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(txt)+'">أرسليه بالواتساب</a>';
 st.textContent='جاري الإرسال…';try{var x=new XMLHttpRequest();x.open('POST','https://ntfy.sh/nyg-2eb9e87e63b27b4e',true);x.onload=function(){st.innerHTML=(x.status>=200&&x.status<300)?'✅ وصل الملخص للمعلمة':'لم يصل تلقائيًا. '+wa};x.onerror=function(){st.innerHTML='لم يصل تلقائيًا. '+wa};x.send(JSON.stringify(rec))}catch(e){st.innerHTML='لم يصل تلقائيًا. '+wa}}

// ---------- one test ----------
var tmr=null;
function testView(t){var phase=0,left=(t.min||25)*60,over=false;
 function stop(){if(tmr){clearInterval(tmr);tmr=null}}
 function p0(){app.innerHTML='<div class="top"><button class="btn w" id="bk">→ رجوع</button><h2>'+t.name+'</h2></div><div class="card"><p>'+(t.n?'عدد الأسئلة: <b>'+AR(t.n)+'</b>. ':'')+'زمن الاختبار في الكتاب: <b>'+AR(t.min||25)+'</b> دقيقة.</p><p>جهّزي ورقة وقلمًا، وأجيبي بدون النظر إلى الحل. <b>تذكّري: الخطأ شيء جميل، عرفناه الآن.</b></p><button class="btn g" id="st">ابدئي الاختبار ⏱</button> <button class="btn w" id="sk">أريد رؤية الاختبار بدون مؤقّت</button></div>';
  $('#bk').onclick=function(){stop();home()};$('#st').onclick=function(){p1(true)};$('#sk').onclick=function(){p1(false)}}
 function fmt(s){var m=Math.floor(Math.abs(s)/60),x=Math.abs(s)%60;return (s<0?'+':'')+AR(('0'+m).slice(-2))+':'+AR(('0'+x).slice(-2))}
 function p1(timed){app.innerHTML='<div class="top"><button class="btn w" id="bk">→</button><h2>'+t.name+'</h2><span class="sp"></span>'+(timed?'<span class="timer" id="tm">'+fmt(left)+'</span>':'')+'</div><div id="pgs"></div><div class="bar"><button class="btn o" id="fin">أنهيتُ — اكشفي الحل 👀</button></div>';
  $('#bk').onclick=function(){stop();home()};imgs(t.test,$('#pgs'));
  if(timed){tmr=setInterval(function(){left--;var e=$('#tm');if(e){e.textContent=fmt(left);if(left<0)e.classList.add('late')}},1000)}
  $('#fin').onclick=function(){stop();p2()};window.scrollTo(0,0)}
 function p2(){var N=t.n||20,st=[];for(var i=0;i<400;i++)st.push(0);
  app.innerHTML='<div class="top"><button class="btn w" id="bk">→</button><h2>الحل: '+t.name+'</h2></div><div class="card"><b>اكتبي أمام كل سؤال: ✓ أصبتُ أو ✗ أخطأتُ</b> بعد أن تنظري في الحل. اضغطي على رقم السؤال مرة (✓) ومرتين (✗).<br>عدد الأسئلة: <input id="n" type="number" min="1" max="80" value="'+N+'" style="width:90px;display:inline-block"> '+(t.n?'':'<span class="muted">(راجعي العدد من الورقة)</span>')+'<div class="marks" id="mk"></div><div id="sc" style="font:800 1.2rem B"></div><button class="btn g" id="sv">احفظي نتيجتي</button><div id="out"></div></div><div id="pgs"></div>';
  $('#bk').onclick=home;imgs(t.ans,$('#pgs'));
  function draw(){N=Math.max(1,Math.min(80,+$('#n').value||1));$('#mk').innerHTML='';for(var i=0;i<N;i++){(function(i){var b=document.createElement('button');b.className='mk'+(st[i]===1?' ok':st[i]===2?' no':'');b.textContent=AR(i+1)+(st[i]===1?' ✓':st[i]===2?' ✗':'');b.onclick=function(){st[i]=(st[i]+1)%3;draw()};$('#mk').appendChild(b)})(i)}
   var ok=0,no=0;for(i=0;i<N;i++){if(st[i]===1)ok++;if(st[i]===2)no++}$('#sc').textContent='أصبتِ '+AR(ok)+' ، أخطأتِ '+AR(no)+' ، لم تعلّمي '+AR(N-ok-no)}
  $('#n').oninput=draw;draw();
  $('#sv').onclick=function(){var ok=0,wr=[];for(var i=0;i<N;i++){if(st[i]===1)ok++;else wr.push(i+1)}var e=recordResult(t,ok,N,wr),pct=Math.round(ok/N*100);
   $('#out').innerHTML='<div class="card" style="background:#d9f7d9"><b>'+stars(pct)+' '+AR(ok)+' من '+AR(N)+' ('+AR(pct)+'٪)</b><br>'+(pct>=80?'ركّزتِ وكرّرتِ فوصلتِ 🌟 والتوفيق من الله.':'جميل أنكِ حاولتِ! الأسئلة التي أخطأتِ فيها: '+wr.slice(0,25).map(AR).join('، ')+'. أعيديها بهدوء، وسنراجع الاختبار غدًا.')+'<br><span class="muted">موعد مراجعة هذا الاختبار القادم: بعد '+AR(BOX[e.box])+' يوم.</span></div>'}}
 p0()}

// ---------- start ----------
var pw0=null;try{pw0=sessionStorage.getItem('mkpw')}catch(e){}
if(pw0)open(pw0);else lock();
})();
</script></body></html>
